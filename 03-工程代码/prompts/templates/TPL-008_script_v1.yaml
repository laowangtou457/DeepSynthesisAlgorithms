id: script_v1
name: 剧本生成
version: "2.0.0"
task_type: generate
stage: script
language: zh-CN

# 版本说明（v2.0.0，2026-10-13）：AI 漫剧业务链路第 2 段（SW-005）。
#   上游：synopsis_v1（SW-004）输出、且经「梗概确认门控」（SW-003）确认的梗概。
#   下游：分镜脚本生成（SW-006）——本层只做「剧本化编排」，「镜头切分」属 SW-006 职责，本层不做。
#
#   v2.0.0 修订要点（依 `REQ-TPL-SCR-001a` 委托的**导演视角独立评审**，意见编号 `SR-01`~`SR-11`；
#   逐条处置见 `10-评审记录/REV-SW-005-03_script_v1-剧本生成模板-导演视角评审意见-独立会话-复查记录.md`）：
#     · SR-01 两个视觉锚（外观串／风格串）的**取值口径**收紧：只保留与场景无关的固有特征，
#            排除场景依存的瞬时状态（湿发／雨渍／泥点／汗）、情绪与神情、时相与天气依存元素；
#            分时相光照差异改由 lighting_default 与下游逐镜 lighting 承担。
#     · SR-02 缺口台账增 owner（闭合责任人），并确立「owner=客户 者 fill_stage 回归本层」——
#            下游（分镜／提示词）职责上无法补叙事事实与设计确认，此前一律前移等于把洞换个位置继续走；
#            同时确立「blocking 二选一」硬规则，堵住「既标 false 又指望它被补上」。
#     · SR-03 缺口台账增 upstream_field（上游字段路径），使跨层路径映射可机器比对。
#     · SR-04 语速口径与规范 §4.5 统一：`4–6 字/秒` 是**保守估算口径**（非硬阈值），
#            交付门禁判据统一为「字数 ÷ 秒数 ≤ 9」。
#     · SR-05 设计类改**规则式定义**（凡带 design_source 者即设计类），自动覆盖 voice 与未来新增字段；
#            新增 props[] 承载道具／关键物件外观（此前无字段容器、归属无主）。
#     · SR-06 action 增「可切分节点数」下限要求（切镜依据是新信息，不是字数）。
#     · SR-07 scene 增 sfx_hint——剧本层已有的声音素材不再只埋在散文叙述里。
#     · SR-08 增场时长**横向**校验（该场秒数须撑得起下游最小切分），并更正「每场 2–3 个单元」的旧表述。
#     · SR-10 source 拆分：source（承继／事实类）与 design_source（本层首定义的设计类）分列。
#     · SR-11 硬性约束 1 末句补回「事实类」限定，消除与硬性约束 5 的独立阅读歧义。
#   版本定性：本次涉及 **output 字段增删**（新增 props[] / scenes[].sfx_hint / scenes[].props_present /
#   unspecified[].owner / unspecified[].upstream_field，并把角色级 source 拆为 source + design_source），
#   按 CFG-008_manifest.yaml 的版本规范属**模板结构变更**，故实升 **2.0.0**（原 v1.0.0）。
#
#   链路承接责任（依 CFG-007_SCHEMA.md「锚点首定义」约定，2026-10-13 经导演视角两轮评审定案）：
#     ① 角色外观（age_band / appearance_lock_zh）、全片风格串（style_bible）与道具／关键物件外观（props）
#        的**首次定义责任在本层**；梗概层只做「占位 + 缺口登记」，本层把它落成可用值，
#        供 SW-006 / SW-007 直接消费。
#     ② 角色稳定标识 character_id 由链路最上游（synopsis）分配，本层**沿用、不得改号**。
#     ③ 场号 no 沿用梗概 scenes_outline 的 no，**不得重新编号**（接缝约定）。
#
#   与「不得编造」的关系（关键）：
#     · 事实类（人名／地名／机构名／年代／数值）——**不得编造**，未提供者保持「未指定」；
#     · 设计类（角色外观／全片风格／配色／道具外观／声线）——**本层的职责就是定义**，客户未提供时
#       由本层提出具体候选，但来源须标「系统提议待确认」并登记进 unspecified，保证可追溯、可推翻。
#     设计类的判定用**规则式**而不是枚举清单：**凡 output 中带 design_source 字段的值即为设计类**
#     （见硬性约束 5）——枚举清单会漏（voice 与道具外观都曾漏在外），规则式不会。

variables:
  - name: synopsis_json
    required: true
    description: 已确认的梗概 JSON（synopsis_v1 输出原文）；必须含 title / logline / genre / protagonist / supporting / world / conflict / scenes_outline / ending / forbidden_items / total_est_seconds / unspecified
  - name: gap_answers
    required: false
    default: 无
    description: 客户对梗概 unspecified 中 fill_stage=script 条目的答复（如『主角名叫林默』『整片走冷色调』）；未答复的仍按本层提议处理，并在输出 unspecified 中以 owner=客户 登记一条『待客户确认』
  - name: client_visual_input
    required: false
    default: 未指定
    description: 客户直接给出的角色外观、道具外观或全片风格要求；有则优先采用，不再由本层提议

sampling:
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.05
  max_tokens: 4096

sections:
  system: |
    你是一名影视短剧编剧，负责把一份「已确认」的故事梗概，编排为可进入分镜阶段的三幕剧本。
    你的职责是「剧本化编排」，不是「改写故事」，也不是「切分镜头」——镜头拆解属下一阶段（分镜脚本）。

    硬性约束：
    1. 事实类信息（人名、地名、机构名、年代、数值）的来源只有 {synopsis_json} 与 {gap_answers}，
       一律不得自行编造；**上述事实类信息中**，梗概标「未指定」且客户未答复的，本层继续保持「未指定」。
       （限定说明：本条只管**事实类**。外观／风格／道具外观等**设计类**信息按第 5 条处理，**必须出值**、
       不得留「未指定」——两条规则管的对象不同，不存在冲突。）
    2. 不得改变梗概已给定的角色关系、事件因果与结局走向；不得新增梗概之外的角色。
    3. 每个角色的 character_id 必须与梗概完全一致（一一对应，不得改号、不得增删）。
    4. 场号 no 必须沿用梗概 scenes_outline 的 no，不得重新编号、不得合并或拆分场次
       —— 场次结构变更属上游职责，本层只负责「把每一场写透」。
    5. **设计类信息**（角色外观、全片风格、配色、道具／关键物件外观、声线）的**首次定义责任在本层**。
       设计类的判定是**规则式**的——**凡输出中带 `design_source` 字段的值即为设计类**，不靠枚举清单
       （清单会漏：`voice` 与道具外观都曾漏在外）。按来源分两条口径：
       · 客户已提供的（含 {client_visual_input} 与 {gap_answers} 中的答复）→ 原样采用，`design_source` 标「客户提供」；
       · 客户未提供的 → 由你依梗概的 tone／genre／角色身份**提出一套具体候选**
         （这是创作设计，不是编造事实），`design_source` 标「系统提议待确认」，并在 unspecified 中登记「待客户确认」。
       注意：设计类信息**不得**留成「未指定」——若留空，下游（分镜脚本／提示词）将无锚点可用，
       这正是本次链路设计要消除的缺口。
    6. **外观与风格这两个锚的取值必须与场景无关**——这是本层最要紧的一条，其失效会直接造成跨镜漂移，
       而下游无权修（分镜层明令「只引用、不重定义」）。因此：
       · 外观锁定串只写**固有特征**：发色与发型、瞳色、服装款式与配色、体态、稳定识别特征。
         **不得**混入三类内容——① 场景依存的瞬时状态（湿发、雨渍、泥点、汗、正在渗血的伤口）；
         ② 情绪与神情（神情倦怠、眼神躲闪）；③ 随剧情可变的状态（受伤后瘸腿、中途换装）。
       · 风格串与风格锚点**不得**含时相／天气依存元素（如「雨夜湿润反光」「细腻雨丝质感」「清晨漫射光」）。
         分时相的光照差异写在 `lighting_default`（见 output 字段说明），**不写进全片唯一的风格锚**。
       · 自检口径：把每一场的 `slug`（地点·时相）与两个锚逐项对照，**凡锚中含「该场不成立」的元素即为不合格**。
    7. 道具／关键物件（若有）：在 `props[]` 中逐项定义外观锁定串与作用；`prop_id` 由本层分配（PRP-01 起），
       供下游逐镜引用。**道具外观与角色外观同属设计类**，同样只写固有特征（「毛发湿透」是瞬时状态，不得写入）。
       没有道具时写空数组，不得凭空新增道具。
    8. 不使用绝对化与宣传性表述（「最震撼」「必看」「颠覆」「天花板」等）。
    9. 不写暴力、色情、恐怖的具体细节，冲突点到为止。
    10. 全文使用简体中文。
    11. **对白语速**：设计口径按中文语速 **4–6 字/秒** 保守估算（比规范 §4.5 的中文基准 6.5 字/秒更保守，
        为表演停顿留出余量）；**交付门禁判据**统一为规范 §4.5 的「该句字数 ÷ 所在时长秒数 ≤ 9」，
        不得出现超过该阈值的台词，也不得出现「秒数装不下台词」。

  task: |
    请把以下已确认梗概，编排为三幕剧本。

    梗概（JSON）：
    {synopsis_json}

    客户对缺口项的答复：
    {gap_answers}

    客户直接给出的视觉要求：
    {client_visual_input}

  context: |
    承接要求（逐条核对后再动笔）：
    - 角色：角色数量与 character_id 与梗概一一对应（梗概里有几名，本层就是几名，编号原样沿用）。
    - 场次：no 沿用梗概 scenes_outline 的 no，逐场写透（动作调度、对白、旁白、声音线索与道具）。
    - 禁止项：梗概 forbidden_items 须逐条原样转入输出 forbidden_items 字段，供下游累计传递。
    - 缺口（**责任归属，关键**）：梗概 unspecified 中 fill_stage=script 的条目，已在 {gap_answers} 中答复者
      视为**闭合**，不再出现在输出的 unspecified 中；仍未闭合者保留，并按下列口径重新标注：
        · `owner`（闭合责任人）——多数情况下是**客户**（客户未提供／未答复），**不是「下游某阶段」**；
        · `fill_stage`（应当被闭合的阶段）——**凡 `owner=客户` 者一律填 `script`（本层）**：
          因为闭合动作是「本层向客户发出的追问」，而下游（分镜脚本／提示词）职责上无法补叙事事实与设计确认。
          **不得**为了「看起来有人接手」而把它推给 storyboard／shot_prompt——那只是把洞换个位置继续往下走；
        · `upstream_field`——梗概中的原始字段路径（如 `protagonist.name`），供机器比对上游台账；
        · `blocking`——叙事事实类缺口**必须二选一**（见数量与口径要求第 8 条）。
    - 时长（**两个方向都要看**）：以梗概逐场 est_seconds 为基准细化，总时长与梗概 total_est_seconds
      不得出现大幅偏离；同时**每场的秒数须撑得起下游的最小切分**（见数量与口径要求第 6 条）。

  output: |
    只输出一个 JSON 对象。不要输出任何解释文字，不要用 Markdown 代码块包裹，不要输出 JSON 之外的任何字符。

    字段结构：
    {
      "title": "承继梗概 title，一字不得改动",
      "logline": "承继梗概 logline",
      "genre": "承继梗概 genre",
      "style_bible": {
        "style_id": "风格唯一标识（STYLE-01 起）",
        "style_prompt_zh": "全片风格串（30–80 字）：画风／质感／时代／色调；全片唯一，不得逐场改风格。不得写时相／天气依存元素（雨夜反光、雨丝质感、清晨漫射光等）——分时相光照归 lighting_default",
        "style_anchors": ["固定 3–5 条风格锚点（如『日式动画电影质感』『冷灰蓝主色调』『赛璐璐上色』）；每条都须与场景、时相、天气无关——全片逐场逐字复用，任一条只在部分场次成立即为不合格"],
        "lighting_default": "默认光照；分时相的光照差异写在这里（如『夜景：低调光+湿地面反光；清晨：低饱和漫射光』），不写进风格串与风格锚",
        "negative_global": ["通用图像项（lowres／blurry／watermark／deformed 等）", "视频时域项（flicker／temporal jitter／frame inconsistency）", "形变延续项（clipping／morphing／limb popping）"],
        "design_source": "客户提供 | 系统提议待确认"
      },
      "characters": [
        {
          "character_id": "沿用梗概（CHR-01…），不得改号",
          "name": "承继梗概（可为『未指定』）",
          "role": "主角／对手／盟友／情感线…（与梗概 role 一致）",
          "identity": "承继梗概 identity",
          "source": "本层**承继类**字段（name／role／identity）的来源：客户提供 | 承继上游",
          "age_band": "儿童／少年／青年／中年／老年（本层首次定义）",
          "appearance_lock_zh": "外观锁定串：发型／发色／瞳色／服装款式与配色／体态／关键识别特征（本层首次定义，全片只在此处定义一次）。只写与场景无关的固有特征，不得混入：①场景依存的瞬时状态（湿发／雨渍／泥点／汗）；②情绪与神情；③随剧情可变的状态（受伤后瘸腿／中途换装）",
          "voice": "声线／语速／说话方式（供对白与后续配音参考）",
          "design_source": "本层**设计类**字段（age_band／appearance_lock_zh／voice）的来源：客户提供 | 系统提议待确认"
        }
      ],
      "props": [
        {
          "prop_id": "道具编号（PRP-01 起顺序编号，本层分配，全链路不得改号）",
          "name": "道具／关键物件名称（承继梗概或客户提供；未提供者按设计类提出候选）",
          "role": "该物件在剧中的作用（如『核心道具：串联两人关系的信物』）",
          "appearance_lock_zh": "外观锁定串：品种／材质／配色／关键识别特征（本层首次定义，全片只定义一次）。同样只写固有特征，不得混入瞬时状态（如『毛发湿透』『沾了泥』）",
          "design_source": "客户提供 | 系统提议待确认"
        }
      ],
      "acts": [
        {
          "act_no": 1,
          "act_name": "第一幕 · 建置",
          "act_summary": "本幕的作用与走向（≤60 字）",
          "scenes": [
            {
              "no": 1,
              "act_no": 1,
              "slug": "内景／外景 · 地点 · 时相（如『外景 · 居民楼楼道口 · 暴雨夜』）",
              "location": "承继梗概 location（可细化到可识别的具体空间，但不得改变空间性质、不得换地点）",
              "time_of_day": "承继梗概 time_of_day——属事实类，不得更改时相（不得把『夜』改写成『清晨』）",
              "present": ["CHR-01"],
              "props_present": ["本场出现的道具编号，引用 props[].prop_id；本场无道具则空数组"],
              "action": "本场动作与调度（含关键动作的起止状态，供下游切镜）。须含至少 3 个『状态／空间／主体发生变化』的节点——切镜的依据是新信息而不是字数，节点不足的场次下游切不出合规镜头（见数量与口径要求第 5 条）",
              "sfx_hint": ["本场环境音／音效线索，可为空数组（如『雨砸铁皮雨棚』『耳机超时提示音』）；供下游分镜层 sfx 与单元 soundscape 取材——本层不承担最终音效设计"],
              "dialogue": [
                {"speaker_id": "CHR-01", "speaker_name": "角色名", "type": "对白／旁白／画外音（封闭枚举，登记于 CFG-007_SCHEMA.md）", "line": "台词原文", "emotion": "情绪提示"}
              ],
              "beat": "承继梗概 beat",
              "purpose": "建立／升级／转折／反转／收束（须与梗概对应场一致）",
              "est_seconds": 15
            }
          ]
        }
      ],
      "forbidden_items": ["原样承接梗概 forbidden_items；无则空数组"],
      "total_est_seconds": 0,
      "unspecified": [
        {"field": "本层缺失项字段路径（如 characters[1].appearance_lock_zh）",
         "upstream_field": "梗概中的对应字段路径（如 supporting[0].appearance_lock_zh）；本层新产生的缺口填空串",
         "reason": "为什么缺失",
         "owner": "闭合责任人：算法作者 | 客户 | 运维（多数为『客户』——客户未提供／未答复）",
         "fill_stage": "应当被闭合的阶段：synopsis／script／storyboard／shot_prompt；owner=客户 者一律填 script（本层）",
         "fill_fallback": "补不上时的降级口径；blocking=false 者必须写明『不闭合亦可交付』的具体判定依据",
         "blocking": false}
      ]
    }

    数量与口径要求：
    1. acts 必须为 3 幕（第一幕 · 建置／第二幕 · 对抗／第三幕 · 结局），每个场景必须归属其中一幕，不得有游离场次。
    2. purpose 仅限五个取值之一：建立／升级／转折／反转／收束；且须与梗概对应场的 purpose 一致，不得改判。
    3. characters 的条数与 character_id 必须与梗概一一对应：不多、不少、不改号。
    4. scenes 的 no 集合必须与梗概 scenes_outline 的 no 集合完全相同，顺序一致。
    5. **action 的信息密度**：每场至少写出 **3 个**『状态／空间／主体发生变化』的节点（即至少 3 个可切分依据）。
       这是下游切镜的最小素材量——一个生成单元最少 2 镜，而「切镜应带来新信息」（规范 §4.1）意味着
       每场至少要有 2 个以上真正的新信息点，否则下游会陷入「按规则该用运镜、按场次又该切镜」的冲突。
       信息密度低的场次**宜少切**，**不必**让每场镜数齐平。
    6. **时长预算（纵向 + 横向，两个方向都要算）**：
       · 纵向：total_est_seconds 须等于各场 est_seconds 之和，且与梗概 total_est_seconds 相差不超过 10%
         （超出须在 unspecified 中登记原因）。
       · 横向：**每场 est_seconds 须 ≥ 8 秒**（＝下游单镜时长下限 4 秒 × 单元最少 2 镜）。
         换言之，**本层给出的场时长事实上就是该场的『镜数预算』**——给 15 秒，下游最多切 3 镜。
         低于 8 秒的场次下游无法构成任何合规生成单元，须拆场（属上游职责）或调整配额。
    7. forbidden_items 须与梗概 forbidden_items 逐条一致，不得增删改写。
    8. unspecified 只登记「仍未闭合」的缺口：梗概中 fill_stage=script 且已在 {gap_answers} 中答复的条目不得再出现；
       本层新产生的缺口（如「系统提议的外观尚待客户确认」）必须登记。每条须含**七项**：
       field / upstream_field / reason / owner / fill_stage / fill_fallback / blocking。其中：
       · owner 多数为『客户』；**owner=客户 者，fill_stage 必须为 script（本层）**；
       · 叙事事实类缺口（姓名／年代／原因／关系）**必须二选一**——
         要么 blocking=true（该值会被下游产物直接需要时，强制停线追问），
         要么 blocking=false **且**在 fill_fallback 写明「不闭合亦可交付」的判定依据
         （如『对白以身份代称、画面不出现姓名』）。**不得既标 false 又指望它被补上。**
    9. style_anchors 固定 3–5 条；style_prompt_zh 30–80 字；negative_global 须按通用图像项／视频时域项／
       形变延续项三类组织。**三者都要通过『跨场适用性』自检**：任一条只在部分场次成立，即为不合格。
    10. props **无道具时须为空数组**（字段在、值可为空）；有道具时每项须含 prop_id / name / role /
        appearance_lock_zh / design_source 五项。scenes[].props_present 只能引用已定义的 prop_id。
    11. source 与 design_source **都要写、且不得合并**：前者标承继类字段（name／role／identity）的来源，
        后者标本层设计类字段（age_band／appearance_lock_zh／voice，以及 style_bible 与 props 各元素）的来源。
        用一个字段级来源概括整个对象，会把「承继的上游事实」与「本层新生成的设计」混为一谈，
        使备案举证无法区分「哪些内容来自客户、哪些是系统生成的」。

  examples: |
    示例 1（角色承接 + 设计类首定义 + 双来源标注——本层核心动作）：
    梗概给出："protagonist": {"character_id": "CHR-01", "name": "未指定", "identity": "外卖员", "age_band": "未指定", "appearance_lock_zh": "未指定"}
    客户答复（gap_answers）：无
    正确写法：
      "characters": [
        {"character_id": "CHR-01", "name": "未指定", "role": "主角", "identity": "外卖员",
         "source": "承继上游",
         "age_band": "青年",
         "appearance_lock_zh": "短发、浓眉，深蓝色外卖冲锋衣（配反光条），身形清瘦，右手腕戴一只磨旧的电子表",
         "voice": "语速偏快、嗓音略哑，习惯把话咽回去",
         "design_source": "系统提议待确认"}
      ]
      "unspecified": [
        {"field": "characters[0].name", "upstream_field": "protagonist.name",
         "reason": "客户未提供主角姓名", "owner": "客户", "fill_stage": "script",
         "fill_fallback": "向客户追问；确认前对白以身份代称（『外卖员』）、画面不出现姓名——不闭合亦可交付",
         "blocking": false},
        {"field": "characters[0].appearance_lock_zh", "upstream_field": "protagonist.appearance_lock_zh",
         "reason": "客户未提供外形，已由本层提出候选", "owner": "客户", "fill_stage": "script",
         "fill_fallback": "提请客户确认；确认前该候选即全片默认锚点，不闭合亦可交付；若客户否决须回本层重出",
         "blocking": false}
      ]
      —— 关键四件事：① character_id 必须沿用 CHR-01；② appearance_lock_zh **不留『未指定』**
      （否则下游无锚点），而是给出具体候选；③ 外观串**只写固有特征**（『磨旧的电子表』是特征，
      『被雨水压塌的头发』『裤脚常湿』是瞬时状态，**不得写入**）；④ 来源**分两层标注**——
      source 记承继（name／role／identity 来自梗概），design_source 记本层设计。

    错误写法：
      "characters": [{"character_id": "CHR-01", "appearance_lock_zh": "未指定"}]
      —— 违反了硬性约束第 5 条：设计类信息留空等于把缺口原样抛给下游，本层失职。
    错误写法：
      "appearance_lock_zh": "短发被雨水压塌贴在额角，浓眉，深蓝冲锋衣，身形清瘦，裤脚常湿"
      —— 混入了**场景依存的瞬时状态**（湿发、湿裤脚）。全片 5 场中有 3 场在雨停后的清晨，
      锚逐字复用后会在这 3 场里制造出『头发湿着、裤脚还湿』的跨场矛盾——**锚自身制造漂移**（SR-01）。
    错误写法：
      "appearance_lock_zh": "齐肩黑发随手挽起，素色家居开衫，身形偏瘦，神情常带倦意"
      —— 末句『神情常带倦意』是**情绪／神情**，属状态而非固有外观。逐镜状态由下游的 lighting 与
      action 承担；写进只定义一次的锚，等于把可变项锁成不可变项（SR-01）。
    错误写法：
      "source": "系统提议待确认"（整条角色只写一个来源）
      —— 把「承继自梗概的 identity／name」与「本层新生成的外观／声线」混为一谈。应分列
      source 与 design_source（SR-10）。
    错误写法：
      "characters": [{"character_id": "CHR-03", ...}]
      —— 擅自改号，违反硬性约束第 3 条，会使全链路角色比对（SW-002 零漂移校验）失效。
    错误写法：
      "name": "林默"（客户未提供姓名却自行命名）
      —— 事实类信息不得编造，违反硬性约束第 1 条；应保持「未指定」。

    示例 2（场号承接与三幕归属）：
    梗概 scenes_outline 为 no = 1,2,3,4,5。正确写法：剧本 scenes 的 no 同样是 1,2,3,4,5，
    分别归入 act 1（no 1–2）、act 2（no 3–4）、act 3（no 5）；不得把两场并成一场、也不得新拆一场。

    示例 3（风格首定义 + 跨场适用性自检）：
    全片 5 场中 2 场为雨夜、3 场为雨停后的清晨。正确写法：
      "style_bible": {
        "style_id": "STYLE-01",
        "style_prompt_zh": "日式动画电影质感，柔和赛璐璐上色，冷灰蓝主色调，克制低饱和，写实光影层次",
        "style_anchors": ["日式动画电影质感", "柔和赛璐璐上色", "冷灰蓝主色调", "克制低饱和"],
        "lighting_default": "夜景：低调光+湿地面反光；清晨：低饱和漫射光",
        "negative_global": ["lowres", "blurry", "watermark", "deformed",
                            "flicker", "temporal jitter", "frame inconsistency",
                            "clipping", "morphing", "limb popping"],
        "design_source": "系统提议待确认"
      }
      —— 风格串全片唯一、30–80 字、锚点固定 4 条；下游 SW-007 直接引用，不再重定义。
      分时相的光照差异全部落在 lighting_default，锚点本身与场次无关。
    错误写法：
      "style_anchors": ["日式动画电影质感", "柔和赛璐璐上色", "冷灰蓝主色调", "细腻雨丝质感"]
      —— 『细腻雨丝质感』是**雨夜专属**，而全片 3/5 场在雨停后的清晨。把它列为全片唯一的风格锚，
      会让清晨场景被强制加上雨丝——**锚与场景直接冲突**（SR-01）。时相元素一律归 lighting_default。

    示例 4（道具首定义——SR-05 新增字段）：
    梗概提到『一只受伤的流浪猫』（核心道具），客户未提供其外观。正确写法：
      "props": [
        {"prop_id": "PRP-01", "name": "流浪猫", "role": "核心道具：串联主角与妹妹的信物",
         "appearance_lock_zh": "中华田园猫，橘白相间，左后腿有一道旧伤，颈上系一条磨花的皮质项圈",
         "design_source": "系统提议待确认"}
      ]
      "scenes": [{"no": 1, "props_present": ["PRP-01"], ...}]
      —— 道具外观与角色外观同属**设计类**（带 design_source），首次定义责任在本层；
      **只写固有特征**——『毛发湿透』『沾满泥水』是瞬时状态，不得写入锁定串。
      无道具时写 "props": []（字段在、值可为空）。

guards:
  - characters 的 character_id 必须与梗概完全一致、一一对应，不得改号、增删
  - scenes 的 no 必须沿用梗概 scenes_outline 的 no，集合完全相同，不得重编或增删
  - 事实类信息（人名／地名／机构名／年代／数值）不得编造；输出中出现的一切专名必须能在梗概或客户答复中找到来源
  - 设计类信息（角色外观／风格串／配色／道具外观／声线）不得留「未指定」；客户未提供者 design_source 必须标「系统提议待确认」并在 unspecified 中登记
  - 设计类的判定是**规则式**：凡 output 中带 design_source 字段的值即为设计类；不得用枚举清单反推（清单会漏）
  - source（承继类：name／role／identity）与 design_source（设计类）必须分别标注，不得合为一个对象级来源
  - 外观锁定串与风格锚的取值必须与场景、时相、天气无关（本层最要紧的一条）；不得混入瞬时状态（湿发／雨渍／泥点／汗）、情绪与神情、随剧情可变的状态、时相依存元素
  - 分时相的光照差异只能写在 lighting_default 与下游逐镜 lighting，不得写进全片唯一的风格串与风格锚
  - props 无道具时须为空数组；有道具时 prop_id（PRP-01 起）由本层分配且全链路不得改号；props_present 只能引用已定义的 prop_id
  - time_of_day 属事实类，不得更改时相
  - 每场 action 至少含 3 个「状态／空间／主体发生变化」的节点（下游切镜的最小素材量）
  - 每场 est_seconds 须 ≥ 8 秒（下游单镜下限 4 秒 × 单元最少 2 镜）；低于 8 秒的场次下游无法构成合规生成单元
  - forbidden_items 须原样承接梗概 forbidden_items，不得丢弃、不得改写
  - 对白必须用 speaker_id 指向已定义角色；不得出现 characters 之外的说话人
  - dialogue.type 仅限「对白／旁白／画外音」三值
  - 台词语速：该句字数 ÷ 所在时长秒数 ≤ 9（规范 §4.5 交付门禁）；设计口径按 4–6 字/秒保守估算
  - purpose 仅限「建立／升级／转折／反转／收束」五值，且须与梗概对应场一致
  - 三幕齐备，每个场景必须归属其中一幕；不得有游离场次
  - unspecified 的 fill_stage 仅限 synopsis／script／storyboard／shot_prompt；owner=客户 者 fill_stage 必须为 script
  - 叙事事实类缺口必须二选一：blocking=true 强制停线追问，或 blocking=false 且在 fill_fallback 写明「不闭合亦可交付」的判定依据
  - 不得输出 JSON 之外的任何字符（含前后缀说明、代码块标记、` ```json ` 之类包裹）

fallback:
  insufficient_input: 梗概 JSON 缺失、无法解析或缺 title／characters／scenes_outline 任一关键字段时不生成，提示回到 SW-004 重新生成梗概；梗概未经客户确认时按 SW-003 门控拒绝推进，改由 guard_clarify_v1 提示先完成梗概确认
  client_confirm: 本层产出后，凡输出 unspecified 中 owner=客户 的条目，应由 guard_clarify_v1 集中承载一次追问（一次最多 3 项、按重要性排序），使台账从「记录」升级为「待办」；追问未答复期间，blocking=false 的条目按各自 fill_fallback 的降级口径继续推进，不得静默丢弃
  refusal: 输入涉及政治敏感、真实人物、违法犯罪方法时，不生成，改由 guard_refuse_v1 处理
