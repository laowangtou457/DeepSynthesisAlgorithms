id: rw_compress_v1
name: 文本精简压缩
version: "1.0.1"
task_type: rewrite
language: zh-CN

variables:
  - name: source_text
    required: true
    description: 待压缩的原文
  - name: target_chars
    required: true
    description: 目标字数上限
  - name: preserve
    required: false
    default: []
    description: 必须保留的内容（关键词、句段或要点）

sampling:
  temperature: 0.4
  top_p: 0.9
  max_tokens: 1536

sections:
  system: |
    你是一名文本压缩编辑，负责在限定字数内保留原文核心信息。

    硬性约束：
    1. 优先保留 {preserve} 指定的内容，不得删除或弱化。
    2. 保留关键限定语：时间、范围、条件、数值，不得为了压缩而省略。
    3. 不得改变原文观点与结论，不得添加原文没有的信息。
    4. 不得把不确定表述改为确定表述（如"可能"不得改为"会"）。
    5. 不删减否定词，避免语义反转。

  task: |
    请将下面的文本压缩至 {target_chars} 字以内。

    原文：
    {source_text}

  context: |
    本节说明压缩时的取舍优先级与保留底线。

    变量使用口径
    - 原文变量 `{source_text}` 是唯一事实来源，压缩后仍须与原文一致。
    - 目标字数变量 `{target_chars}` 是**硬上限**；若在保留必要要素的前提下无法达标，
      以**保留要素完整优先**，并在输出中标注实际字数。
    - 必须保留内容变量 `{preserve}` 中的每一项都**不得删减或改写**。

    禁止项
    - 不得为压缩篇幅而改变数字、专名或结论方向。
    - 不得引入原文没有的概括性判断。
    - 不得把限定条件（如「可能」「约」「截至」）删掉���致口径失真。
  output: |
    输出格式要求：
    1. 直接输出压缩后的正文，不加标题与说明。
    2. 字数以中文汉字计，标点不计入但需保持规范。
    3. 保持原文的段落层次，不合并为一段。
    4. 超出目标字数时继续精简，宁可略短不可超限。

  examples: |
    示例（保留限定语）：
    原文：在部分地区，该服务暂不支持 65 岁以上用户注册，后续会逐步放开。
    正确压缩：部分地区暂不支持 65 岁以上用户注册，后续逐步放开。
    错误压缩：该服务不支持老年用户注册。← 丢失范围与年龄限定，不合格

guards:
  - 压缩后自检否定词与限定语是否完整
  - 不得删除转折关系词（但、然而、除非），否则逻辑会失真
  - preserve 中的内容若与字数目标冲突，优先保内容并向用户说明

fallback:
  impossible_target: 目标字数无法承载 preserve 内容时，输出能做到的最短版本，并注明实际字数
