# 版本说明（**v2.1.0**，2026-10-14）：AI 漫剧业务链路第 4 段（SW-007）。
#   ★ v2.0.0 修订（**结构变更 → 主版本**；依 `ISSUE-011`／`ISSUE-012`／`ISSUE-015`，任务
#     `T-054`~`T-056` **合并为同一次契约升版动作**）：本层 **output 的契约字段集新增三项**，
#     故属**主版本**（v1.1.0 的「无 output 字段增删故属次版本」判据在此**反向成立**）：
