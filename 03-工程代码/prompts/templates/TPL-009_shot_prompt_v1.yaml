      "style_ref": "STYLE-01",                                    ← 本层补出
      "aspect_ratio": "16:9",                                     ← 本层补出（取 meta.aspect_ratio_default）
      "prompt_zh": "远景：暴雨夜的居民楼楼道口，一个外卖员拎着外卖箱站在檐下，半边肩在雨里；他侧身往墙里挪了半步，背贴墙面站定，视线压在手机屏上。镜头从楼道口外三米、齐腰高度缓缓前推，停在他的肩背，雨幕堆在身后，浅景深把雨帘化开。人物落在画面右三分，左侧三分之一是被雨帘遮住的楼道纵深，前景溅起的水花压住画面下缘；空间轴左为楼道口、右为街面，全集不越此轴。楼道感应灯在他下半张脸上打出一道硬边，街灯反光从积水里泛上来。雨水顺着袖口成股下淌，在脚边积出一小滩，又被新雨点打出密密的涟漪。日式动画电影质感，柔和赛璐璐上色，冷灰蓝主色调，克制低饱和。",
      "prompt_en": "A wide shot of a delivery rider taking shelter at the entrance of an old residential building on a stormy night, a delivery box in one hand and one shoulder still in the rain. He shifts half a step toward the wall and settles with his back against it, eyes fixed on his phone. The camera pushes in with small amplitude at slow speed from three meters out at waist height, stopping on his shoulders and back with the rain curtain piling up behind him, holding a shallow depth of field so the rain falls out of focus. He sits in the right third of the frame with the deep entrance shaft filling the left third, spray from the ground pressing the lower edge. The space axis runs from the dark entrance on the left to the bright street on the right, uncrossed throughout. A practical light from the motion-sensor lamp cuts a hard edge across the lower half of his face while streetlight reflects up from the standing water. Rain runs down his sleeve in a steady stream, pooling at his feet and dimpling under fresh drops. Japanese anime film look, soft cel shading, cool grey-blue palette, restrained low saturation."

    逐维核对（**这就是「八维双落地」的验收动作**）：
      | 维 | 字段 | 正文中对应句 |
      | --- | --- | --- |
      | 景别 | shot_size=wide | 起句 "A wide shot of …" / "远景：……" |
      | 运镜 | push_in/small/slow/from/to | "The camera pushes in with small amplitude at slow speed from three meters out…" |
      | 角度 | height=eye_level | "at waist height" 起幅机位（平视口径，未越轴） |
      | 光学 | optics=shallow_focus | "holding a shallow depth of field so the rain falls out of focus" |
      | 构图 | shot_language.composition | "He sits in the right third …, the deep entrance shaft filling the left third" |
      | 轴线 | shot_language.axis | "The space axis runs from the dark entrance on the left to the bright street on the right" |
      | 光线 | lighting=practical_light（+中文光位说明已移入正文） | "A practical light from the motion-sensor lamp cuts a hard edge across the lower half of his face" |
      | 画面结果 | shot_language.result | "Rain runs down his sleeve … pooling at his feet and dimpling under fresh drops" |

    注意三点：
      · **外观一个词都没写**——"深蓝色冲锋衣""反光条""浓眉"全部不在正文里（规范 §3.4）；
        它们固化在 characters[CHR-01].appearance_lock_zh，由锚注入。读者照样能看懂这一镜在发生什么。
      · **单人镜的具名锚点**——该角色 `name` 为「未指定」，故全片用稳定指称：
        中文「外卖员」／英文 `the delivery rider`。**每一镜都必须用这同一个词组**，
        不得这镜叫「骑手」、下镜叫「男人」（那等于换了个人，模型会照做）。
      · **风格句在末尾**——每一镜都要写，不能只写第一镜。

    示例 2（**package_head 段**：style_bible／characters 的补齐与承继）：
      style_bible 的 style_prompt_zh／style_anchors／negative_global 逐字承继剧本层；
      **style_prompt_en 是本层补出**（上游无此字段）：
        "style_prompt_en": "Japanese anime film look, soft cel shading, cool grey-blue palette, restrained low saturation"
      ⚠️ 英文侧**不得增加**中文锚里没有的风格词（如不得因为"雨天"就加 `rainy mood` —— 那会造成风格漂移，
         且违反"锚点封闭"）；分时相差异已由剧本层的 `lighting_default` 承载。
      characters[].appearance_lock_en 同理：`"short hair, thick brows, a dark blue delivery jacket, lean build, a worn digital watch on the right wrist"`
      —— 是 zh 的**同义英译**，不是自由创作（zh 里没有的特征一个都不能加）。
      aigc_meta 是**规则区**：ProduceID 与 meta.pack_id 同值，ContentPropagator 与 ContentProducer 同值。

    示例 3（分段：一次只出一段，拼装后才是完整包）：
      segment = "package_head"  → 输出 schema_version／meta／style_bible／characters／aigc_meta
      segment = "unit:U01"      → 输出 {"units": [U01 项], "shots": [S01-SH001, S01-SH002, S01-SH003]}
      segment = "unit:U02"      → 输出 {"units": [U02 项], "shots": [S02-SH001, …]}
      —— 拼装：package_head + 各 unit 段按 unit_id 顺序合并；shots 顺序＝全片镜序。
      ⚠️ **分段产物不可能单独通过交付包 schema**：`package_head` 缺 `units`／`shots`
      （schema 的 required 六项不齐）、`unit:<id>` 缺 `meta`／`style_bible`／`aigc_meta`。
      分段产物只做**段级结构自检**（键名正确、枚举合法、引用命中）；**完整 schema 校验与
      `validate_pack.py` 门禁在拼装后执行**。（评审 PR-09：原文「每段都能单独过一遍 schema」
      不成立，属**失实表述**，特此更正。）

    错误写法（**改了不该改的**）：
      "duration_ms": 6000（上游为 5000，理由是"让台词更从容"）
      —— 本层不改时长。台词念不完属上游缺陷，须回退上游重出（见 fallback），
      改了会让 total_duration_ms 与分镜层镜表同时失真。
    错误写法（**外观重述**）：
      "prompt_zh": "远景：穿深蓝色冲锋衣的外卖员，冲锋衣上带反光条，站在楼道口……"
      —— 外观只定义一次（§3.4）。正文里写的是"这一镜在发生什么"，不是"这个人长什么样"。
    错误写法（**八维只落字段、不落正文**）：
      "camera": {"move": "push_in", …} 而 prompt_en 通篇没有运镜句
      —— 只填字段不写正文 = 这一维等于不存在（规范 §4.1 的双条件）。
      而且 H3 侧会按"画面呆滞、模型默认静止"处理。
    错误写法（**风格漂移**）：
      "prompt_zh": "……赛璐璐上色，水彩晕染质感……"（style_anchors 里没有"水彩"）
      —— prompt_* 中不得出现锚点清单之外的风格词（§3.3）。
    错误写法（**负向残留**）：
      "prompt_en": "… The rain stays moderate. (negative: no modern buildings, no text)"
      —— 负向写法不得出现在正文里（§6.4）；须转写为正向约束句：
      "The rain stays moderate and the architecture remains period Jiangnan, with no modern structures and no on-screen text."
    错误写法（**自拟姓名**）：
      客户未提供姓名，本层在正文里写成「外卖员陈默」
      —— 事实类不得编造。"具名锚点"的可执行形式是**稳定指称**，不是自造一个名字。
    错误写法（**元数据编造**）：
      "pack_id": "FR-PK-20261013-AB12CD34"（pack_meta 未提供，模型自行按格式生成）
      —— 编号必须可反查到生成记录（§5.2）；自拟编号 = 断链，且属备案举证造假。

# guards 的分工说明（与 CFG-007_SCHEMA.md 的定义一致）：
#   标注【增量】者为本层**独有**的失败模式，默认必须注入；
#   其余为对 system 硬性约束的兜底复述，按失败模式定向追加。
guards:
  - 【增量】**正文密度下界**：逐镜自检"只看 prompt_zh／prompt_en，能不能复现这一镜"——
    景别、运镜（含起止）、角度、光学落点、构图、轴线、光线、画面结果，逐项在正文里找到对应句。
    找不到的维度，要么补写，要么确认该镜本不承载该维（分镜层已留空）。
    读完仍不知道镜头怎么动 = 该镜不合格，**不得靠字段"我有填"蒙混过关**。
  - 【增量】**外观词扫描**：交付前把 characters[].appearance_lock_zh 与 props[].appearance_lock_zh
    按标点切段，逐段在 prompt_zh／prompt_en 里搜——命中即删（改写成瞬时状态或直接去掉）。
    这类词一旦进了正文，会在每一镜重复描述外观，模型把它当"变化"处理，跨镜一致性直接崩。
    同一条扫描也用于 **style_anchors**：清单之外的风格词命中即删。
  - 【增量】**指称一致性扫描**：把每个 character_id 在全片正文中的指称词组列出来，
    同一角色必须**只有一个词组**（对照 `meta.notes` 的 `CHR-xx → 词组` 映射声明核验）。
    出现两套以上（「外卖员」/「骑手」/「男人」；英文 `the delivery rider`/`the rider`）即不合格——
    多角色同框时模型可依上下文区分，单角色时指称一乱，模型会引入第二个人。
  - 【增量】**运镜句完整性**：英文侧逐镜确认存在以 `The camera` 起句的**独立句**；
    硬换行排版时**不得**把 `The camera` 拆到两行（拆开后校验器判"缺少运镜句"，而人眼看不出）。
    `static`／`pov` 的运镜句同样要有（"The camera holds a static shot."），只是不带幅度速度。
  - 【增量】**元数据溯源**：pack_id／created_at／session_id／task_id／statement_id／provider_code
    **＋ `compliance.*` 的全部子字段**（safety_check.input/output/checked_at、
    copyright_check.status/note、marking_check.explicit/implicit、statement_id）逐个回查
    {pack_meta}——凡 {pack_meta} 中没有的值，一律写占位符并登记，
    **不得出现一个"看起来对"的自拟值**。判据：这个编号能不能反查到一条生成记录？不能就是编的。
    （评审 PR-15：原清单漏 `compliance.*`，与 `system` 硬性约束 12「一律取自 {pack_meta}」不一致。）
  - 【增量】**改决策排查**：把交付包与 {storyboard_json} 做一次逐字段 diff，**diff 清单与
    `system` 硬性约束 1 的承继清单逐项对齐**（评审 PR-14：两处清单不一致会留下
    「清单外字段无人管」的漏洞）：
    shot_id／unit_id／scene_no／shot_no／units[].shot_ids／duration_ms／shot_size／camera.*／
    action.*／shot_language.*／dialogue／sfx／transition_in／transition_out／character_refs／
    **prop_refs**／soundscape／music／notes。
    **只允许出现三类必改 + 一类条件改写**：① 投影规则①（lighting 拆分）、
    ② 规则②（notes 清理）、③ 规则③（amplitude／speed 的 medium／normal → **省略该键**）；
    ④ 规则④（`shot_language.*` 等留空 → **仅从本镜已有字段派生**，且 meta.notes 有留痕）；
    外加本层补出的字段（style_ref／prompt_zh／prompt_en／aspect_ratio／顶层 **props 与 forbidden_items**）。
    ⚠️ **上游 `prop_refs` 参与 diff**（v2.0.0 起）——它已在交付契约字段集内，
    逐镜必须与上游**完全一致**；不一致即属第四类差异（改决策）。
    出现上述四类之外的差异，即说明本层改了导演决策。
  - 硬约束复述：不改导演决策（尤其 duration_ms）；双上游都要读；
    外观只定义一次；八维双落地；运镜独立成句以 The camera 起句；要素顺序
    主体→动作→环境→光线→镜头语言→风格；长度中文 **90–280 字** / 英文 **450–1200 字符**
    （**建议值、非硬约束**，v2.0.0 上修；八维全承载的长镜超长属正常，但须落在**上限内**）。
  - 枚举复述：shot_size 六值；camera.move 20 类；amplitude 只填 small／large、
    speed 只填 slow／fast（medium／normal **省略该键**）；transition 5 值；lighting 取 15 值词表；
    character_id 形如 CHR-01；shot_id 形如 S01-SH003。
    ⚠️ **枚举字段一律不得写空串**（schema 的枚举不含 ""）——留空即**省略键**（评审 PR-02）。
  - 引用完整性：style_ref 命中 style_bible.style_id；character_refs 命中 characters[].character_id；
    **prop_refs 命中 props[].prop_id**（v2.0.0 起，本层**须**做该一致性自检）。
    道具编号的对应关系仍以**上游**（storyboard_v1 / script_v1）为准，本层逐镜原样承继；
    同时保证正文不重述道具外观。
  - 单位与格式：duration_ms 为整秒；created_at／checked_at 为 ISO 8601 带时区；
    total_duration_ms 为整数；aigc_meta 仅一份且 ProduceID 与 pack_id 同值。
  - 合规复述：不使用绝对化与宣传性表述；不写暴力、色情、恐怖的具体细节；
    避免真实人物姓名与肖像描述。

fallback:
  insufficient_input: storyboard_json／script_json 任一缺失、无法解析，或缺 units／shots／style_bible／characters 任一关键结构时不生成，提示回到对应上游（storyboard_v1 为 SW-006、script_v1 为 SW-005）重新产出。**不得只喂一份上游就硬编**——只给分镜会缺 style_bible 与 characters，只给剧本会缺 units 与 shots。
  upstream_defect: 复核时发现上游缺陷（**最常见两类**：① 某镜 dialogue 字数 ÷ 秒数 > 9，语速念不完；
    ② 分镜层**硬字段**缺值或越界——如 camera.move 缺失、shot_size 不在六值内，既无法承载、
    也无法按投影规则④从本镜已有字段派生）时，
    **不回改、不自拟**——按 SW-003 门控回退到缺陷所在阶段重出，并在返回信息中写明
    「哪一层、哪一镜、哪个字段、为什么不改」。本层不改时长、不改镜头决策，是刻意的设计约束：
    改了会让 total_duration_ms 与分镜层镜表同时失真，且把导演决策混进编译层。
    ⚠️ **与「条件改写」的边界**（依评审 PR-03）：`shot_language.*` 一类**可派生**字段的上游
    留空，按投影规则④在本层派生并留痕，**不算上游缺陷、不回退**；只有**不可派生**的硬字段
    缺值才回退。此边界不写清，会让「派生」与「回退」两条路互相打架。
  output_too_long: 单次输出的分段产物仍超过模型单次窗口（`auto` 下本不应发生；显式指定
    `all` 且镜数过多时可能出现）时，**不得截断、不得压缩维度**——自动降级为
    `package_head` + 逐 `unit:<id>` 分段产出并逐段自检，拼装后再过门禁；同时在 `meta.notes`
    登记「本次为降级分段产出」及镜数。（评审 PR-08：原 fallback 无超长兜底，且自述「超长
    必然截断」与默认值 `all` 自相矛盾，此处一并修正。）
  metadata_missing: 注入的 pack_meta 缺 pack_id／statement_id／provider_code 等备案关联字段时，
    **照常产出产物**（结构完整、可交付预演），但：① 该字段写占位符（`{{PROVIDER_CODE}}` 等）；
    ② 在 meta.notes 写明「本包为占位预演，未取得编号，不得用于正式交付」。
    **不得停止生成**（停滞会阻塞整条链路），也**不得自拟值**（编造编号是备案举证造假）。
  missing_anchor_en: 剧本层 `appearance_lock_zh`／`style_prompt_zh` 本身为「未指定」时
    （理论上不应发生——剧本层已定案设计类不留「未指定」），本层**不得代为设计**，
    改由 guard_clarify_v1 发起追问并回到剧本层补齐；本层暂停该角色／风格相关的正文产出。
  refusal: 输入涉及政治敏感、真实人物、违法犯罪方法时，不生成，改由 guard_refuse_v1 处理。
