    数量与口径要求：
    1. **承继守恒**：shots 与 units 的镜数、镜序、单元构成、时长，必须与 {storyboard_json} **逐项相同**；
       total_duration_ms 必须等于各镜 duration_ms 之和，且必须等于上游 total_duration_ms
       （本层不改时长，二者不等即说明本层动了不该动的东西）。
    2. 每个镜头必须属于且仅属于一个单元；style_ref 必须命中 style_bible.style_id；
       character_refs 必须命中 characters[].character_id；**引用完整性是阻断项**（§3.8）。
    3. **每镜必有**：shot_size／camera.move／style_ref／prompt_zh／prompt_en／action{start,change,end}／
       shot_language{composition,axis,result}／character_refs／**prop_refs（v2.0.0 起；无道具为空数组 `[]`）**。
       缺任一即不得交付（与交付 schema `shot.required` 的 **14 项**逐字一致）。
    4. **prompt_zh / prompt_en 的可读性下界**（本层最易失败处）：每一镜的正文必须让读者
       **只看正文就能复现这一镜**——景别、运镜（含起点终点）、角度、光学落点、构图、轴线、
       光线、画面结果都要能读出来。读完仍不知道镜头怎么动 = 该镜不合格。
    5. 英文侧运镜句**必须以 `The camera` 起句且独立成句**；幅度／速度只在需要强调时出现
       （`small`／`large`、`slow`／`fast`；`medium`／`normal` → **省略该键**）；
       `static`／`pov` **不带二者**（即省略 `amplitude`／`speed` 两个键）。
    6. 正文**不得**复述角色外观与道具外观；**不得**出现 style_anchors 之外的风格词；
       **不得**出现模型参数指令；**不得**出现负向残留写法。
    7. 单角色镜**必须**有稳定指称（`identity` 或 character_id），不得用「他／她」或省略主语；
       同一角色的指称**全片一致**。`name` 为「未指定」时不得自拟姓名。
    8. characters[] 与 **props[]** 必须分别与剧本 characters[]／props[] **一一对应**（同数、同号、同序）；
       每镜 `prop_refs` 必须逐项命中 `props[].prop_id`（**引用完整性是阻断项**）。
       ⚠️ **v2.0.0 起本层输出这两处结构**（顶层 `props[]` 为搬运、逐镜 `prop_refs` 为承继）——
       v1.1.0 的「不输出该结构键」处置**随契约补齐已撤销**（`ISSUE-011` 闭环）。
       道具的**可见信息仍由正文承载**（只写瞬时状态与动作关系，**不得重述外观**）。
    9. `aigc_meta` **仅一份**，`ProduceID` 与 `meta.pack_id` 同值；不得出现第二个 AIGC 块。
    10. **缺口台账不在本层输出，但缺口的「状态可见性」必须在 `meta.notes` 落一条**——
        交付包没有 `unspecified` 字段（规范 §3.1 顶层**八段**中无此项），本层不产生新的叙事事实类
        缺口，上游未闭合条目**保持原状留在上游产物中**（owner／fill_stage／upstream_field
        均不改写、不搬运、不重编号）。若上游某条目导致本层**无法补出必填字段**，按 fallback
        回退上游，**不得自己编一个值填上**。
        ⚠️ **「不搬运台账」不等于「不吐露缺口」**（评审 §3-B）：本层是「锚的最后一道关」，
        锚一旦写进正文并用于生成视频，客户事后否决外观／风格的代价会从「重出剧本」放大为
        「重出 14 镜 + 重新生成全部视频」，而交付包内**当前没有任何字段**提示这件事。故
        `meta.notes` **必须**以**可机器读的形式**逐条登记「本包所依据的上游未闭合缺口」：
          格式 `[GAP] <字段路径> | owner=<…> | fill_stage=<…> | <一句 fill_fallback 摘要>`
        另需在同一处登记：① 字段投影①的 code 映射依据；② 条件改写④的派生来源；③ 超长镜号。
        ——把「交付后不可见」降为「可见但仍不动台账」，且**不违反 §3.1 顶层结构**。
    11. **分段拼装规则**：`package_head` 与各 `unit:<id>` 的产物拼装后，必须是一个能过
        validate_pack.py 的完整包——调用方按 package_head → unit:U01 → unit:U02 … 顺序合并，
        `units` 按 unit_id 顺序、`shots` 按（unit 顺序 + unit 内 shot_ids 顺序）排列，
        即全片镜序。**分段不改变任何字段取值**，只改变一次输出的范围。

