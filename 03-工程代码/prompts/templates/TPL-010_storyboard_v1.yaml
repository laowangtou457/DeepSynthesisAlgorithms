      "unspecified": [
        {"field": "本层缺失项字段路径（如 shots[3].dialogue）",
         "upstream_field": "剧本中的对应字段路径；本层新产生的缺口填空串",
         "reason": "为什么缺失",
         "owner": "闭合责任人：算法作者 | 客户 | 运维（与剧本层同口径：客户未提供／未答复者填『客户』）",
         "fill_stage": "发起闭合动作的阶段：synopsis／script／storyboard／shot_prompt；继承的客户缺口填 script、本层新产生的客户缺口填 storyboard，**owner=客户 者一律不得填 shot_prompt**",
         "fill_fallback": "补不上时的降级口径；blocking=false 者必须写明『不闭合亦可交付』的具体判定依据",
         "blocking": false}
      ],
      "quality_gate": {
        "self_check": "自查结论（一段话，**叙述性**）。可按镜序列出「shot_id 与 camera.move」的抄录清单作参考；**数值字段（shot_count／static_shot_count／move_types／move_type_min_required）一律不填**——它们是由 shots 推导的统计量，属交付前脚本复算口径（BR-12），不由本层承诺（见数量要求 8）"
      }
    }

    数量与口径要求：
    1. shots 的顺序即全片镜序；同一场的镜头在 shots 中**连续排列**，不得交错。
       **镜数有下界**（`PRO-013` §4.3）：全片镜数 ≥ ⌈剧本 `total_est_seconds` ÷ 15s⌉
       （单镜上限口径）——如 90 秒的剧本全片至少 6 镜；同时**每一场都须切到镜头**
       （`shots[].scene_no` 覆盖剧本 `scenes[].no` 的全部取值），且**每场 ≥ 2 镜**。
       ⚠️ **单场模式下**本条按「本场」理解：本场镜数必须落在 `scene_budget` 给出的区间内
       （下限 2 镜＝最小合规单元；上限＝⌊场秒数 ÷ 单镜下限 4s⌋），出场/漏场均属不合格。
    2. 每个镜头必须属于且仅属于一个单元（shots[].unit_id 命中 units[].unit_id）；
       单元的 shot_ids 成员数必须为 2 或 3，**按镜序连续递增**，且**成员同场**。
    3. shots 的 shot_id 命名格式统一为 S<场号两位>-SH<镜号三位>；shot_no 在场内从 1 连续编号，
       不得跳号。⚠️ shot_no 是**场内**编号（不是单元内编号）：同一场内按 shots 数组中的
       出现顺序依次为 1、2、3、……——一个 4 镜的场是 1/2/3/4，**不是**两个单元各编 1/2。
    4. **双守恒**：剧本每一场的每一句台词都必须出现在某镜的 dialogue 中，顺序不得打乱，旁白同样要分配；
       **同时**，每一场 action 的每个节点都须落到某一镜的 action.change 或 shot_language.result 上
       （节点清单见 context 首条）。台词守恒但动作不守恒 = **不合格**。
    5. duration_ms 必须为整秒（1000 的整数倍），且落在 {duration_bounds} 秒区间内。
    6. 转场按"单侧表达"：单元**内部**相邻镜的衔接写在后一镜的 transition_in；
       transition_out 只出现在单元末镜（**单元边界 = 前一单元末镜的出点 + 后一单元首镜的入点**，
       两个半段，不算"两头都写"；详见硬性约束 9）。
       **机械核对（写完 shots 后逐单元执行一遍）**：对每个单元，翻到它的 shot_ids 列表——
       只有**列表最后一镜**允许带 transition_out 键；列表中其余镜头**一律不写这个键**
       （不是留空串，是整个键不出现）。镜头之间的普通切换不需要任何标注。
    7. **质量门（规范 §4.2）——分两类处理，不要一律当生成时的自查项**（依评审 `BR-12` 二分）：
       **(a) 结构性约束（生成时即可遵守，必须满足）**：
         · 运镜覆盖 100%（每镜都有 camera.move）与景别覆盖 100%（每镜都有 shot_size）；
         · 单元镜数 ∈ [2,3]；单元内运镜不重复；`static`／`pov` 不带幅度速度；
         · 单场镜数 ≤ ⌊场秒数 ÷ 4s⌋。
       **(b) 统计性阈值（生成时**无法**局部判定，由交付前脚本复算，本层不承诺）**：
         · 静止镜（move=static）占比 ≤ 40%；
         · 运镜类型数 ≥ min(5, max(2, ⌈镜数/4⌉))——例如 12 镜时至少 3 种。
           **分配先行**：动笔写 shots 之前，先从运镜 20 类枚举中为**每镜**选定一个 move，
           按镜序排成一份分配清单（轮换使用不同类型，同一单元内不重复），核对清单去重后
           的种类数达到门槛，再照这份清单写各镜的 camera.move——不要边写边随手填；
         · 单一运镜类型占比 ≤ 35%；
         · 角度覆盖 ≥ 40%、光学覆盖 ≥ 30%、构图覆盖 ≥ 50%、轴线覆盖 ≥ 30%（有对手戏时强制）、
           光线覆盖 ≥ 40%、画面结果覆盖 ≥ 60%。
       **你可以**把 (b) 的结论写进 `quality_gate.self_check` 作为参考，但请注意：
       · `quality_gate` 的**数值字段是可选参考**（填了就**必须与脚本复算一致**，见下条；不填不罚）；
       · 写 `self_check` 时**不要为了"看起来满足"而编数字**——规范 §4.8 明确「**质量门是脚本产出物，不是承诺**」。
         数字好看但不实，在备案举证时会成为**伪证**，比不写更糟。
       · **不要为了字段齐全而填一个你没数过的数字** —— 填错与不填的差别，是「报告一处不实声明」与「不报告」；后者可控，前者在举证时是**伪证**。
    8. `quality_gate` 的数值字段**一律不填**（`shot_count`／`static_shot_count`／
       `move_types`／`move_type_min_required` 四个都是）——它们全是由 `shots` **推导**
       的统计量，属「交付前脚本复算」口径（`BR-12`），**不由本层承诺**。
       ⚠️ 真机实测（2026-11-04，17 镜产物）：模型把 `shot_count` 填成 22（复算 17）、
       把**转场词表值**（fade_in／fade_out／cut）混进 `move_types`——数数与词表归类
       都不可靠。填错会在备案举证时成为**伪证**（「报告一处不实声明」比「不报告」更糟）。
       `quality_gate` 对象本身仍必备，**只写 `self_check` 即可交付**（叙述性结论，
       不含数字；**不填数值字段不罚**，脚本只对填了的字段逐项比对）。
    9. music 字段与 soundscape 字段都必须有值（无配乐写 N/A）；music 不得出现抽象情绪词。
       若本层自行提议了 music 织体，须同步在 unspecified 中登记该项（本层新产生的设计内容）。
    10. forbidden_items 须与剧本 forbidden_items 逐条一致，不得增删改写。
    11. unspecified 只登记"仍未闭合"的缺口：剧本中 fill_stage=storyboard 且已在数据段 gap_answers 中答复的
        条目不得再出现；本层新产生的缺口（如"某镜台词待客户确认"）必须登记。每条须含**七项**：
        field / upstream_field / reason / owner / fill_stage / fill_fallback / blocking。其中：
        · `fill_stage` 填**发起闭合动作的阶段**（继承的客户缺口回退 `script`；本层新产生的客户缺口填
          `storyboard`；**任何 `owner=客户` 的条目都不得填 `shot_prompt`**——下游无权补）；
        · 叙事事实类缺口**必须二选一**：blocking=true（该值会被下游产物直接需要时，强制停线追问），
          或 blocking=false **且**在 fill_fallback 写明"不闭合亦可交付"的判定依据。
          **不得既标 false 又指望它被补上。**
    12. props 与 prop_refs：剧本 props 为空数组时，全片 prop_refs 亦须为空数组；prop_refs 只能引用
        剧本已定义的 prop_id，不得新增道具、不得在本层描写道具外观。**某场 `props_present` 非空时，
        该场至少要有一镜把它标进 `prop_refs`**（整场漏标即漏拍）。
    13. 切镜依据（硬性约束 15）的落地自检：逐镜问"这一镜给出了前一镜没有的什么？"——
        答不出来即应合并为一次运镜。

  examples: |
    示例 1（**先拆节点、再切镜** + 单元构成 + 八维齐备）：
    剧本第 1 场：外景 · 居民楼楼道口 · 暴雨夜；present: CHR-01；props_present: ["PRP-01"]；
    action（原文）：挤在楼道口避雨刷手机 → 脚边纸箱传来一声细弱的叫，掀开湿透的纸板看见后腿带血的猫
                    → 先站起要走、鞋已迈下台阶，又停住，蹲回去把纸箱往墙根挪了半尺。
    第一步——**拆节点**（「状态／空间／主体／视角／时间发生变化」处即一个节点）：
      ① 空间：街面 → 楼道口檐下（避雨）
      ② 主体：发现道具（猫进入画面）
      ③ 状态：离开 → 留下
    → **3 个节点 ⇒ 本场至少 3 镜**，每镜对应一个节点；再校验 15 秒的场镜数上限 ⌊15÷4⌋=3 ✓。
    正确写法（节选）：
      ⚠️ **规模边界（`PRO-013` 去示例锚）**：以下只是**第 1 场第 1 个单元**的写法示范——
      它展示的是「一场怎么切」，**不是全片的规模**。剧本有几场（scenes 的 no 全部取值）
      就必须做几遍，直到 `shots[].scene_no` 覆盖剧本**全部**场号；缺一场即漏拍。
      "units": [
        {"unit_id": "U01", "scene_no": 1, "shot_ids": ["S01-SH001", "S01-SH002", "S01-SH003"],
         "soundscape": "暴雨拍打铁皮雨棚的密集声，楼道口积水顺台阶往下淌", "music": "N/A",
         "notes": "本单元为单人戏，按单人替身法则处理"}
      ]
      "shots": [
        {"shot_id": "S01-SH001", "unit_id": "U01", "scene_no": 1, "shot_no": 1,
         "shot_size": "wide",
         "camera": {"move": "push_in", "amplitude": "small", "speed": "slow",
                    "from": "楼道口外三米、齐腰高度", "to": "落在主角肩背、雨幕压缩在身后",
                    "height": "eye_level", "roll": "level", "optics": "shallow_focus"},
         "duration_ms": 5000,
         "shot_language": {"composition": "主角位于画面右三分，左侧留出被雨帘遮住的楼道纵深，前景是溅起的水花",
                            "axis": "空间轴：画面左为楼道口（暗）、右为街面（亮），摄像机不越此轴",
                            "result": "雨点砸在肩头溅开，外卖箱表面的水痕向下淌成一道线"},
         "action": {"start": "拎着外卖箱站在楼道口檐下，半边肩在雨里",
                     "change": "侧身往墙里挪半步，耳机里跳出一声超时提醒",
                     "end": "背贴墙面站定，视线压在手机屏上"},
         "lighting": "practical_light——楼道感应灯在下半张脸上打出一道硬边，街灯的反光从雨地里泛上来",
         "character_refs": ["CHR-01"], "prop_refs": [], "ref_image": null,
         "dialogue": "还有六分钟。", "sfx": "雨声、外卖箱塑料提手摩擦声",
         "transition_in": "fade_in", "transition_out": "", "notes": "单人镜，用具名锚点指向 CHR-01；节点①：空间"},
        {"shot_id": "S01-SH002", "unit_id": "U01", "scene_no": 1, "shot_no": 2,
         "shot_size": "close_up",
         "camera": {"move": "tilt_down", "amplitude": "small", "speed": "slow",
                    "from": "主角膝下的湿砖", "to": "停在脚边被雨水泡软的纸箱",
                    "height": "high", "roll": "level", "optics": "rack_focus"},
         "duration_ms": 5000,
         "shot_language": {"composition": "构图极简，纸箱占画面下三分之一，上方是垂落的雨帘",
                            "axis": "沿用本场空间轴（楼道内·街面外）",
                            "result": "纸板被掀开，箱底蜷着一只后腿带血的猫，它抬了一下头"},
         "action": {"start": "视线压在手机屏上",
                     "change": "脚边纸箱传来一声细弱的叫，他掀开湿透的纸板",
                     "end": "看见一只后腿带血的猫蜷在箱底"},
         "lighting": "rim_light——雨丝在逆光里显形，纸箱边缘被勾出一道湿亮的光边",
         "character_refs": ["CHR-01"], "prop_refs": ["PRP-01"], "ref_image": null,
         "dialogue": "", "sfx": "纸箱里细弱的猫叫、雨声转低",
         "transition_in": "cut", "transition_out": "", "notes": "节点②：主体（发现道具）——猫入画，故 prop_refs 标 PRP-01"},
        {"shot_id": "S01-SH003", "unit_id": "U01", "scene_no": 1, "shot_no": 3,
         "shot_size": "full",
         "camera": {"move": "pull_out", "amplitude": "small", "speed": "slow",
                    "from": "蹲着的背影与纸箱", "to": "拉开到楼道口的整块纵深，人缩在画面一角",
                    "height": "eye_level", "roll": "level", "optics": "deep_focus"},
         "duration_ms": 5000,
         "shot_language": {"composition": "人与纸箱压在画面左下，右侧大片是空的楼道",
                            "axis": "沿用本场空间轴（楼道内·街面外）",
                            "result": "纸箱被往墙根挪了半尺，地上留下一道被拖出的湿痕"},
         "action": {"start": "站起，鞋已迈下台阶",
                     "change": "停住，蹲回去把纸箱往墙根挪了半尺",
                     "end": "重新站定，目光落在箱子上"},
         "lighting": "practical_light——感应灯把人的影子投到墙上，随下蹲的动作拉长",
         "character_refs": ["CHR-01"], "prop_refs": ["PRP-01"], "ref_image": null,
         "dialogue": "雨砸在铁皮雨棚上，像有人在替他数秒。", "sfx": "雨声、纸箱刮过水泥地的摩擦声",
         "transition_in": "cut", "transition_out": "fade_out", "notes": "节点③：状态；单元末镜，故填 transition_out"}
      ]
      —— 关键：**三个节点各得一镜**，每镜都给出了前一镜没有的新信息（①空间 ②主体 ③状态）——
      这正是"切点必须踩在新信息节点上"的落地；若把 SH001/SH002 合并（只差角度、无新信息）就不合格。
      三镜的 camera.move **各不相同**（push_in / tilt_down / pull_out），满足"单元内运镜不重复"；
      单元恰好 3 镜；八维逐项有字段；duration_ms 均为整秒 5000 且落在 4-15 区间。
      —— ★ **上面这三镜属于「同一份示例」**：它们的 `duration_ms` 是 5000、5000、5000
         ⇒ **`total_duration_ms` = 5000 + 5000 + 5000 = 15000**（**照这三个数加，不要凭感觉填**）。
         ⚠️ **本模板里 `duration_ms` 出现在多处**（骨架、其它正例、**下面的错误写法反例**）——
           **只把「同一份示例」内的几个数相加**，**不要跨示例拼凑**；
           尤其 ⚠️ 下方「错误写法」里的 `3200` 是**反例（非整秒、低于 4 秒下限）**，
           **绝不可抄进你的产物**。
      ⚠️ 注意 `amplitude`／`speed` 这里都填了 `small`／`slow`（**需要强调"缓推"的质感**）；
      **若不需要强调，`medium`／`normal` 一律留空串，不要填满**（规范 §3.7.2）。
      prop_refs：**有道具入画时必须标**（本场 props_present 非空，SH002/SH003 猫在画面里 → `["PRP-01"]`）；
      道具外观已在剧本层定义，本层只引编号、不写外观。

    错误写法：
      "units": [{"unit_id": "U01", "shot_ids": ["S01-SH001"]}]
      —— 1 镜单元在质量门上**结构性不合格**：运镜类型数下限 min(5,max(2,⌈1/4⌉))=2 > 1，数学上必然不达标。
    错误写法：
      "units": [{"unit_id": "U01", "shot_ids": ["S01-SH001","S01-SH002"]}] 且两镜 move 均为 "push_in"
      —— 单元内运镜类型重复，浪费了单元内唯一的多样性额度。
    错误写法（**动作不守恒**，本层最隐蔽的一种）：
      某场 action 有三个节点（避雨／发现猫／留下），却只切出两镜，且两镜都只在写"躲雨、看手机"，
      猫从头到尾没出现过——**台词一句没丢，所有守恒判据都通过，故事却缺了第一推动**。
      —— 必须按节点清单切镜；某个节点确实拍不到时，要在 unspecified 写明"为什么不拍"。
    错误写法（**外观重述**）：
      shot_language.result: "雨水顺着深蓝色反光条成股下淌"   ← "深蓝色""反光条"是外观特征词，应删
      shot_language.result: "焦点滑到磨花的宠物牌上，划痕里嵌着洗不掉的旧泥" ← "划痕""旧泥"是新增外观描写
      —— 逐镜语义字段只写瞬时状态；外观已固化在剧本层 appearance_lock_zh，由 SW-007 按锚注入。
      可以写："雨水顺着袖口成股下淌"（动作对象 + 瞬时状态）；不可以写颜色／材质／饰件／磨损／款式。
    错误写法（**为凑镜数而空切**）：
      相邻两镜只差一点距离或轻微角度（如同一位置的 wide → medium 且无任何新信息）
      —— 这不是切镜，是一次运镜；应合并为一镜 `push_in`／`zoom_in`，把省下的镜数让给真正有新信息的节点。
    错误写法（⚠️ **这是反例，其中的数值绝不可抄进你的产物**）：
      "duration_ms": 3200
      —— 非整秒，模型侧不接受毫秒精度；且 3.2 秒低于 4 秒下限（{duration_bounds}=4-15）。
      ⚠️ 真实产物里出现过「把这个 3200 当成某镜的时长」⇒ 连带 `total_duration_ms` 也被填错。
      —— **你要填的是「同一份示例内各镜 `duration_ms` 的和」**，与这个反例无关。
    错误写法：
      "shot_size": "半身"  /  "camera": {"move": "推镜头"}
      —— 景别与运镜必须用规范枚举值（medium / push_in），自造中文词无法被下游映射。
    错误写法（**缺口台账的归属被本层改写**）：
      某条 unspecified 继承自剧本层（"upstream_field": "characters[0].name"），到本层却把
      "fill_stage" 从 "script" 改写为 "storyboard"
      —— 继承项的追问阶段在剧本层就已定下，**本层不得改写**：改写了既没多问一次、又让
      「谁在管这件事」失真。本层**新产生**的客户侧缺口才填 "storyboard"（由本层发起追问）。
      两者由 "upstream_field" 是否为空串区分（**机器可判**，见 validate_output.py R21）。

    示例 2（转场的单侧表达 + **单元边界的口径**）：
    镜 1 与镜 2 同属 U01，镜 2 与镜 3 同属 U02。正确写法：
      S01-SH001（U01 内非末镜）: "transition_out": ""        ← 单元内部严格单侧，前一镜留空
      S01-SH002（U01 末镜）    : "transition_out": "fade_out" ← 出点
      S01-SH003（U02 首镜）    : "transition_in": "cut"       ← 入点
      —— 单元内部（SH001→SH002）的衔接由后一镜 SH002 的 transition_in 表达；
      **单元边界**（U01→U02）由「前一单元末镜的 exit 出点 + 后一单元首镜的 enter 入点」两个半段组成，
      **不算"两头都写"**（它们方向相反，不是对同一次衔接的重复表达）。
      "两头都写"禁的是**同一个衔接被写两次**（如相邻两镜一边写 fade_out、一边写 fade_in 表示同一次过渡）。

    示例 3（台词逐镜分配，一句不丢）：
    剧本第 2 场有 3 句对白：CHR-01 两句、CHR-02 一句。若切成 3 镜，正确分配：
      S02-SH001.dialogue = "第一句（CHR-01）"
      S02-SH002.dialogue = "第二句（CHR-02）"
      S02-SH003.dialogue = "第三句（CHR-01）"
    每镜的台词字数 ÷ 秒数 ≤ 9；若某句 12 字而该镜只有 1 秒预算，须**延长该镜**而非删句。

    示例 4（幅度／速度：默认值留空，需要强调才填）：
      "camera": {"move": "push_in", "amplitude": "", "speed": "", …}      ← 从容缓推是默认观感 → 两个都留空
      "camera": {"move": "push_in", "amplitude": "large", "speed": "fast"} ← 骤然急推、要强调 → 才填
      "camera": {"move": "static", "amplitude": "", "speed": ""}          ← static 不得携带，必须留空
      —— `medium`／`normal` 只在需要强调时出现；**不要把它们当必填值填满**。

# guards 的分工说明（依 CFG-007_SCHEMA.md 的定义与评审 §4.5 的核查意见补注）：
#   CFG-007_SCHEMA.md 定义 guards 是「**运行时追加**的约束（**按失败模式定向加工**）」，不是把静态约束再抄一遍。
#   但本模板作为**默认兜底集**，把本层最易违反的条目全部列出——因此与 system／output 有**有意为之的重复**。
#   服务层装配时应按下列分工处理，以省 token 又不减约束力：
#     · 标【增量】者：system／output 中**没有**对应条款，属 guards 独有的判据 → **默认必须注入**；
#     · 其余条目：与 system／output 重复的**兜底复述** → 仅在检出对应失败模式时**定向追加**
#       （如检出同单元运镜重复，才追加"单元内运镜不得重复"）。
#   若服务层尚未实现定向装配，则按当前的默认兜底集全量注入（保证约束力），不得删减。
guards:
  - 剧本每一句台词必须分配到某一镜的 dialogue，顺序不得打乱，一句不得丢失
  - 逐镜核对 `total_duration_ms` ＝ 各镜 `duration_ms` 之和（真机 5/5 产物填错 ⇒ 交付门禁 BLOCK）
  - 逐镜核对台词字数 ÷ 该镜秒数 ≤ 9；超了就**延长本镜**（不切碎台词、不删台词、不改画面）
  - 剧本每一场 action 的每个节点都必须落到某一镜的 action.change 或 shot_language.result 上；节点拍不到时必须在 unspecified 写明理由
  - 【增量】每个切点必须对应 action 的一个新信息节点（新主体／空间／状态／视角／时间）；相邻两镜只差距离或轻微角度时应合并为一次运镜而不是切镜——回答不出"这一镜给出了前一镜没有的什么"，即应合并
  - 【增量】相邻单元之间须做一次跨单元重复动作排查（规范 §4.6）：同一格动作不得被拍两次
  - character_refs 只能引用剧本 characters 的 character_id；不得改号、不得新增角色
  - prop_refs 只能引用剧本 props 的 prop_id；不得新增道具；剧本 props 为空时全片 prop_refs 均为空数组
  - 【增量】本场 props_present 非空时，该场至少要有一镜把它标进 prop_refs；逐镜漏标与整场漏标同属违规
  - scene_no 集合必须与剧本 scenes 的 no 集合完全相同；切镜只在场内部进行；单元亦不得跨场
  - style_ref 必须等于剧本 style_bible.style_id；本层不得定义或修改风格串
  - 【增量】本层不得把外观特征词（颜色／材质／饰件／磨损／款式）写进 action.*／shot_language.*／camera.from|to／notes——承接 action 里的动作对象可以，写外观细节不可以；逐镜语义字段只写瞬时状态
  - 每个生成单元的 shot_ids 长度必须为 2 或 3；不得出现 1 镜单元、不得出现 ≥4 镜单元
  - 【增量】单元内 shot_ids 须按镜序连续递增排列，不得逆序、不得跳号
  - 同一单元内 camera.move 取值不得重复
  - 每个 shot 的 unit_id 必须命中 units[].unit_id；一个镜头只能属于一个单元
  - 景别 shot_size 与运镜 camera.move 每镜必有（覆盖 100%）；缺失即为不合规
  - 角度／光学／构图／轴线／光线／画面结果六维须在单元与整片层面达到 §4.2 覆盖率阈值（≥40%／≥30%／≥50%／≥30%／≥40%／≥60%），**不要求每镜全开**（规范 §4.3「单元级达标」）
  - 承载画面结果维的镜头必须写出可见改变（防止"空气挥拳"）；该维全片覆盖率不得低于 60%
  - camera.move 只取 20 类内部语义标签；static 与 pov 的 amplitude／speed 必须留空
  - 【增量】camera.amplitude 只填 small／large、camera.speed 只填 slow／fast——medium／normal 是默认值，不需要强调时留空串，不得当必填值填满
  - duration_ms 必须为整秒且落在 duration_bounds 秒区间内；台词字数 ÷ 秒数必须 ≤ 9
  - 该字段 = **同一份示例内**各镜 duration_ms 逐个相加（示例：5000+5000+5000 = **15000**）
    ⚠️ **不匹配就回头逐镜核对**，不要按「镜数 × 单镜上限」估算（真机 5/5 产物这样填错 ⇒ 交付门禁 BLOCK）
  - 台词念不完时**延长本镜**（70 字 ÷ 9 ≈ 7.8 秒 ⇒ 取 8000ms），**不切碎台词**；台词按整句分配
  - 相邻镜衔接由后一镜 transition_in 单侧表达；transition_out 仅单元末镜可填；单元边界＝前单元末镜的出点 + 后单元首镜的入点，两个半段，不算"两头都写"
  - music 与 soundscape 必须有值（无配乐写 N/A）；music 不得出现抽象情绪词；若本层自行提议 music 织体须在 unspecified 登记
  - 【增量】质量门分两类：结构性约束（单元镜数 ∈[2,3]、单元内运镜不重复、static/pov 不带幅度速度、景别／运镜每镜必有、单场镜数 ≤ ⌊场秒数÷4s⌋）生成时必须满足；统计性阈值（覆盖率／占比／类型数）由**交付前脚本复算**，不由模型承诺——可写入 quality_gate.self_check 作参考，但不得为"看起来满足"而编数字
  - 【增量】quality_gate 的**数值字段可选**：`shot_count`（镜数）／`static_shot_count`（static 镜数）／`move_types`（camera.move 去重清单，**须按镜序抄录后再去重**）填写即须等于由 shots 复算的真值，否则视为不实声明；**`move_type_min_required` 一律不填** —— 它是由镜数推导的阈值（min(5,max(2,⌈镜数/4⌉))），属交付前脚本复算的统计量，不由本层承诺
  - 单人镜必须遵守单人替身法则（用具名锚点指向角色，禁省略主语）
  - 【增量】§4.4 的两条禁律对「所有静止／无人戏镜头」均适用，不限单人戏：禁「无光的镜头」、禁「无结果的静止」（任何静止镜里都必须有一样东西在动，且必须写出来）
  - forbidden_items 须原样承接剧本 forbidden_items，不得丢弃、不得改写
  - 不得输出 JSON 之外的任何字符（含前后缀说明、代码块标记、` ```json ` 之类包裹）
  - unspecified 的 fill_stage 仅限 synopsis／script／storyboard／shot_prompt；**任何 `owner=客户` 的条目都不得填 `shot_prompt`**（下游无权补），继承自剧本层者保持 `script`、本层新产生者填 `storyboard`
  - 叙事事实类缺口必须二选一：blocking=true 强制停线追问，或 blocking=false 且在 fill_fallback 写明「不闭合亦可交付」的判定依据

fallback:
  insufficient_input: 剧本 JSON 缺失、无法解析或缺 characters／acts／style_bible 任一关键字段时不生成，提示回到 SW-005 重新生成剧本；剧本含未闭合的 blocking=true 缺口时按 SW-003 门控拒绝推进
  client_confirm: 本层产出后，凡输出 unspecified 中 `owner=客户` 且 `fill_stage=storyboard` 的条目（**本层自己新产生的客户侧缺口**），应由 guard_clarify_v1 集中承载一次追问（一次最多 3 项、按重要性排序），使台账从「记录」升级为「待办」；追问未答复期间，blocking=false 的条目按各自 fill_fallback 的降级口径继续推进，**不得静默丢弃或让它停在本层**。⚠️ 本层**无 `gap_answers` 回流时亦须发出追问**——这正是本层此前缺失的出口（依评审 `BR-05` 补），与剧本层同口径
  over_shot_limit: 单场镜头数超出可承载上限（如单场超过 30 镜）时不整体生成，改为按场分段输出并在 unspecified 中登记分段说明，由调用方分批请求；不得为压数量而丢台词或丢场次
  refusal: 输入涉及政治敏感、真实人物、违法犯罪方法时，不生成，改由 guard_refuse_v1 处理
