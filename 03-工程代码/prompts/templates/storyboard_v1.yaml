    9. music 字段与 soundscape 字段都必须有值（无配乐写 N/A）；music 不得出现抽象情绪词。
       若本层自行提议了 music 织体，须同步在 unspecified 中登记该项（本层新产生的设计内容）。
    10. forbidden_items 须与剧本 forbidden_items 逐条一致，不得增删改写。
    11. unspecified 只登记"仍未闭合"的缺口：剧本中 fill_stage=storyboard 且已在 {gap_answers} 中答复的
        条目不得再出现；本层新产生的缺口（如"某镜台词待客户确认"）必须登记。每条须含**七项**：
        field / upstream_field / reason / owner / fill_stage / fill_fallback / blocking。其中：
        · `fill_stage` 填**发起闭合动作的阶段**（继承的客户缺口回退 `script`；本层新产生的客户缺口填
          `storyboard`；**任何 `owner=客户` 的条目都不得填 `shot_prompt`**——下游无权补）；
        · 叙事事实类缺口**必须二选一**：blocking=true（该值会被下游产物直接需要时，强制停线追问），
          或 blocking=false **且**在 fill_fallback 写明"不闭合亦可交付"的判定依据。
          **不得既标 false 又指望它被补上。**
    12. props 与 prop_refs：剧本 props 为空数组时，全片 prop_refs 亦须为空数组；prop_refs 只能引用
        剧本已定义的 prop_id，不得新增道具、不得在本层描写道具外观。**某场 `props_present` 非空时，
        该场至少要有一镜把它标进 `prop_refs`**（整场漏标即漏拍）。
    13. 切镜依据（硬性约束 15）的落地自检：逐镜问"这一镜给出了前一镜没有的什么？"——
        答不出来即应合并为一次运镜。

  examples: |
    示例 1（**先拆节点、再切镜** + 单元构成 + 八维齐备）：
    剧本第 1 场：外景 · 居民楼楼道口 · 暴雨夜；present: CHR-01；props_present: ["PRP-01"]；
    action（原文）：挤在楼道口避雨刷手机 → 脚边纸箱传来一声细弱的叫，掀开湿透的纸板看见后腿带血的猫
                    → 先站起要走、鞋已迈下台阶，又停住，蹲回去把纸箱往墙根挪了半尺。
    第一步——**拆节点**（「状态／空间／主体／视角／时间发生变化」处即一个节点）：
      ① 空间：街面 → 楼道口檐下（避雨）
      ② 主体：发现道具（猫进入画面）
      ③ 状态：离开 → 留下
    → **3 个节点 ⇒ 本场至少 3 镜**，每镜对应一个节点；再校验 15 秒的场镜数上限 ⌊15÷4⌋=3 ✓。
