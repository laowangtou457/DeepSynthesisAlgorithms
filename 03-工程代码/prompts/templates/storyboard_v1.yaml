         数字好看但不实，在备案举证时会成为**伪证**，比不写更糟。
    8. `quality_gate` 的数值字段（shot_count／static_shot_count／move_types／move_type_min_required）
       **可选**：填写则**必须等于由 shots 复算的真值**（镜数／static 镜数／去重运镜清单／
