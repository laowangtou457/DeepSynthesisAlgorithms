id: modify_v1
name: 对话式修改与意图识别
version: "1.0.0"
task_type: rewrite
language: zh-CN

# 版本说明（**v1.0.0**，2026-10-14）：业务链路**支撑模板**（SW-002 对话式修改）。
#
#   ★ 本层是什么：**对「当前阶段产物」的定向迭代修改**——客户用自然语言说「把第 3 镜拉长到 6 秒、
#     主角名字改成陆青」，本层负责把这句话变成**一次精确的、可追溯的字段级改动**。
#     一句话边界：**客户说改哪里就只改哪里** ——
#     不是重写产物，不是顺手优化，也不是替客户重新设计。
#
#   ★ 本层**不是链路阶段**（这是最需要先认清的一点，写错会连带污染交付包的溯源链）：
#     链路阶段（synopsis／script／storyboard／shot_prompt／revise）回答的是
#     「产物**怎么产生的**」——它们是交付包 `meta.generation_trace.stage_chain` 的取值域
#     （规范 §3.2 的**封闭 5 值枚举**）。而本层回答的是「**产物产出后怎么被改了一次**」，
#     与「阶段」是**正交**的两件事：一份 shot_prompt 阶段的产物被改了三轮，
#     它仍然**只是** shot_prompt 阶段的产物。
#     故：① 本模板**不填 `stage`**（与 9 个通用模板同口径）；
#         ② 本层**不得**向 `stage_chain` 追加任何新值——`stage_chain` 照实保持原值
#            （枚举是封闭的，且追加会同时构成「契约变更」与「溯源失真」两重问题）；
#         ③ 修改**确实发生过**这件事，由 `meta.generation_trace.templates` **追加一条**
#            `{"id": "modify_v1", "version": "<模板实际版本>"}` 来表达
#            （该字段的 `id` 为自由字符串，见 `CFG-006` schema —— **无须改契约**）。
#
#   ★ 与 `revise_v1`（SW-008）的分工 —— 两条易混，务必分清（`revise` 一词的语义重叠）：
#     · `revise_v1`（SW-008，stage=revise）= **解析重构**：客户带着**素材**来，
#       由本段**一段抵四段**地**首次产出**一份标准交付包。它是链路的**第二个起点**。
#     · `modify_v1`（SW-002，**无 stage**）= **对话式修改**：**已有产物**在手，
#       按客户口述**改动其中的若干字段**。它是**任何产物产出之后的通用迭代入口**。
#     判据一眼可辨：**输入里是「素材」还是「既有产物」**——前者走 `revise_v1`，后者走本层。
#     ⚠️ 客户说「重做一版」属新需求、须走前四段或 `revise_v1`，**不得在本层静默重写**。
#
#   ★ 三条纪律（本层的全部约束可归结为这三条，其余都是它们的落地）
#     **① 定向修改（只改被点名的位置）** —— 这是本层存在的理由，也是**零漂移的实现基础**。
#        未被修改意见点名的字段、节点与顺序，**必须逐字保持**（含标点、术语用词、数组顺序）。
#        ⚠️ 本层最常见的失守不是「改错」，而是「**顺手多改**」——语气更顺了、术语统一了、
#           顺带修掉一个别字。这类改动**没有任何字段会因此报错**，但它是**客户没要求的改动**，
#           在备案举证上等于「系统擅自变更了客户确认过的内容」。
#     **② 零漂移（三类 + 锚）** —— 修改不得波及未被点名的内容，尤其：
#        · **数字**：时长／数量／年代／金额／字数；
#        · **专名**：人名／地名／机构名／角色名／道具名；
#        · **设定**：外观／人物关系／结局走向／风格串；
#        · **锚与编号（最硬的一类）**：`character_id`／`prop_id`／`scene_no`／`shot_id`／
#          `unit_id`／`style_id` **一律不得改**——它们是跨阶段双向引用的**唯一凭据**，
#          一旦改动，下游的引用将**指向不存在的对象**（这正是 SW-002 验收标准里
#          「数字／专名／设定零漂移」的锚点，与 `CFG-008_manifest.yaml` 中 synopsis_v1 条目的
#          表述同源）。**确需改号时，那是「重做」而不是「修改」**，见 ③ 与 `fallback.out_of_scope`。
#        ⚠️ 「客户让他改」**不等于**「可以改锚」——若客户坚持改号，必须**走重做路径**并重新过门禁。
#     **③ 口径不越权（本层不得替客户做决定）** —— 下列请求**不属本层**，一律转
#        `fallback.out_of_scope`，不得「先改了再说」：
#        · 改变故事走向／人物关系／结局；· 增删镜头数量或重排镜序；
#          · 更改全片风格定义或角色外观定义（首定义权在剧本层）；
#          · 改变已确认的上游事实（人名／地名／年代）。
#
#   ★ 修改点与响应点**一一对应**（SW-002 验收标准的后半句，落地为 `change_log`）
#     每条修改意见必须落成 `change_log` 中的**恰好一条**记录；反过来，每一条记录
#     都必须能指回**客户原话中的哪一段**（`basis` 字段）。
#     故：**多改的**（客户没要求）与**漏改的**（客户要求了但没落）**都是缺陷**，
#     且两种缺陷都会在这张表上现形——这张表就是「一一对应」的可核查形态。
#     ⚠️ 修改过程中**顺带发现**的、值得改但客户没提的问题，**只能记入 `unresolved`**，
#        不得顺手改掉（那是 ① 的失守）；也不得静默丢弃（那会让问题消失得无影无踪）。
#
#   ★ 含糊时澄清（SW-002 的异常列，本层**必须留出口**）
#     修改意见无法唯一确定落点时（「把它改得更有张力一点」「节奏太慢了」）：
#     **不猜、不择优、不凭常识补全** —— 转 `fallback.ambiguous_request`，
#     由既有 `guard_clarify_v1`（TPL-004）发起追问（一次最多 3 项、按重要性排序），
#     并在 `clarification` 中如实登记。⚠️ 澄清期间 **`change_log` 必须为空**——
#     「边问边改」会让客户看到的产物与他的预期错位，且事后无法分辨哪一部分是猜的。
#
#   ★ 修改是**多轮累积**的：`change_context`（前序轮次的变更说明）必须被尊重
#     —— 前一轮已按客户要求改过的内容，本轮**不得因为「原始产物里不是这样」而改回去**。
#     这是本层最容易发生且最难察觉的回退（多轮之后客户会发现自己的修改「自己消失了」）。
#
#   ★ 本层**不动交付契约**（刻意的边界，不是遗漏）：
#     本层的产物是「修订后的既有产物 + 变更说明」，**不新增任何交付包字段**，
#     故 `schema_version` **保持 2.1.0**、规范版本**保持 V2.2**、`stage_chain` 枚举**保持 5 值**。
#     唯一的连带契约动作是**向 `generation_trace.templates` 追加一条**——
#     该字段本就是模板流水记录，**追加即其设计用途**，无需改 schema。
#
#   ★ 契约来源（唯一真值来源，不得另立一套）：
#     `01-架构设计/SPEC-007_分镜提示词交付规范-v2.2.md`（**现行版**）
#       —— 当 `target_stage` 为 `pack`（交付包）时，修订后的产物仍须满足该规范全篇
#          （§3.1 结构 · §3.7 取值规则 · §4 镜头语言与质量门 · §5 AIGC 元数据块 · §8.3 门禁）。
#     `03-工程代码/delivery/schemas/CFG-006_shot_prompt_pack.v1.schema.json`（schema_version 2.1.0）
#     `03-工程代码/prompts/CFG-007_SCHEMA.md`（封闭枚举唯一真值来源；本层职责边界见其 ⑧ 段）
#     门禁脚本：`03-工程代码/delivery/validate_pack.py`（`target_stage=pack` 时必跑）
#     用例：`03-工程代码/prompts/examples/CASE-006_modify-case01.md`
#
#   ★ 上游 / 下游
#     上游：**当前阶段的产物本身**（`current_artifact`）；有上游阶段时另注入 `upstream_artifact`
#           作为零漂移的比对基准。⚠️ 本层**不产生新阶段**，故不改变链路拓扑。
#     下游：修订后的产物（完整、可直接替换原产物）+ 变更说明（`change_log`）；
#           需要独立复核时，由 `check_consistency_v1`（TPL-016）出具漂移报告。

variables:
  - name: target_stage
    required: true
    description: 当前产物所属阶段标识（**决定本层须守哪一套字段纪律**）：synopsis｜script｜storyboard｜shot_prompt｜pack（交付包）。⚠️ **本值取自产物自身的阶段属性，不是本模板的运行阶段**——本模板无 `stage`（见版本说明）。当取 `pack` 时，修订后的产物**仍须过交付门禁**（`validate_pack.py`），故须遵守《分镜提示词交付规范》全篇；其余四值分别遵守各阶段模板的既有约束（如 storyboard 的外观不得重述、shot_prompt 的承继守恒）
  - name: current_artifact
    required: true
    description: 必备输入，**当前阶段产物 JSON 原文**（要被修改的对象，完整、未经删节）。⚠️ 必须逐字注入——本层的「未点名即逐字保持」纪律以此为准，**任何对本字段的省略或摘要都会使「是否被改动」无法判定**
  - name: modification_request
    required: true
    description: 客户**自然语言修改意见原文**（可含多条、口语化、可能指代模糊）。⚠️ **逐字注入、不得改写或归纳**——`change_log[].basis` 须能指回本字段中的具体片段；改写成规范化措辞会使「修改点与响应点一一对应」失去可比对的原件
  - name: change_context
    required: false
    default: 无
    description: 可选输入，**前序修改轮次的变更说明**（`change_log` 历史，按轮次倒序注入）。用途是**防止多轮回退**——本轮不得把前轮已按客户要求改过的内容改回原值。⚠️ 首页注入时须标明轮次号，第二轮起必填
  - name: upstream_artifact
    required: false
    default: 无
    description: 可选输入，**上游阶段产物**（若 `target_stage` 有上游）。用途有二：① 零漂移比对的**外部基准**（数字／专名／设定以它为准，而非以当前产物为准）；② 判定某项改动是否**越权改了上游事实**（如改人名）。⚠️ 无上游时（`target_stage` 为 `synopsis`／`pack`）本项留空，零漂移只能以 `current_artifact` 自身为准，须在 `unresolved` 中如实说明该局限
  - name: locked_paths
    required: false
    default: 无
    description: 服务层注入的**不可改字段路径清单**（每行一个 JSON 路径，如 `characters[0].character_id`、`meta.pack_id`、`meta.generation_trace.stage_chain`）。⚠️ 命中即**拒绝改动**并转 `fallback.locked_violation`——不得「改了再报告」。典型锁定项：全部锚与编号（`character_id`／`prop_id`／`shot_id`／`unit_id`／`scene_no`／`style_id`）、备案关联字段（`meta.pack_id`／`statement_id`／`aigc_meta.ProduceID`）

sampling:
  temperature: 0.2
  top_p: 0.85
  top_k: 40
  repetition_penalty: 1.03
  max_tokens: 8192
  # ⚠️ 本层输出为**受约束解码**的 JSON（服务层以 jsonschema 为 FSM 约束采样）。
  #    temperature 取 **0.2**（全库最低档）：本层的风险**不是沉闷**，而是
  #    「顺手多改」——在低温下模型倾向于照抄输入，这正是本层需要的性格。
  #    ⚠️ **不得取 0**：完全贪心会在「同一改法有多种合法表达」时反复抖动，
  #    且无法在 `unresolved` 的自由文本里给出自然措辞。

sections:
  system: |
    你是一名**分镜提示词工程师**，负责按客户的**自然语言修改意见**，
    对**已经存在的产物**做**定向修改**，并给出**逐条对应的变更说明**。
    你的职责是"**客户说改哪里就只改哪里**"——
    不是重写产物，不是顺手优化，也不是替客户重新设计。

    硬性约束：
    1. **定向修改（第一条纪律）**：只改 `{modification_request}` **明确点名**的位置。
       未被点名的字段、节点与数组顺序，**必须逐字保持**——包括标点、术语用词、
       数值写法（`4.0s` 不得写成 `4s`）与空格习惯。
       ⚠️ **不得"顺手多改"**：语气更顺了、术语统一了、顺带修掉一个别字——
         这些**没有任何字段会因此报错**，但它们是**客户没有要求的改动**，
         在备案举证上等于「系统擅自变更了客户已确认的内容」。
       ⚠️ **确实值得改、但客户没提的**问题 → 只能写进 `unresolved`，
         **不得顺手改掉**，也**不得静默丢弃**。
    2. **零漂移（第二条纪律）**：修改不得波及未被点名的内容，尤其三类——
       · **数字**（时长／数量／年代／金额／字数）；
       · **专名**（人名／地名／机构名／角色名／道具名）；
       · **设定**（外观／人物关系／结局走向／风格串）。
       ⚠️ **锚与编号一律不得改**：`character_id`／`prop_id`／`scene_no`／`shot_id`／
         `unit_id`／`style_id`／`meta.pack_id`／`aigc_meta.ProduceID`。
         它们是跨阶段双向引用的**唯一凭据**，改动会使下游引用指向**不存在的对象**。
         **客户要求改号 ≠ 可以改号**——那是「重做」，见第 4 条。
       ⚠️ 命中 `{locked_paths}` 中任一径路的改动，**一律拒绝**并转
         `fallback.locked_violation`；**不得"改了再报告"**。
    3. **修改点与响应点一一对应（第三条纪律）**：
       每条修改意见 → `change_log` 中**至少一条**（**牵连到的每个位置各占一条**，
       共用同一 `basis`——例如"第 3 镜拉到 6 秒"会同时改动该镜时长与整片总时长，两条）。
       反过来，每条 `change_log` → 必须能指回 `{modification_request}` 中**哪一段原话**（写入 `basis`）。
       故**多改的**（客户没要求）与**漏改的**（客户要求了没落）**都是缺陷**。
    4. **口径不越权**：下列请求**不属本层**，一律转 `fallback.out_of_scope`，
       **不得"先改了再说"**——
       · 改变故事走向／人物关系／结局；· 增删镜头数量或重排镜序；
       · 更改全片风格定义或角色外观定义（首定义权在剧本层）；
       · 改变已确认的上游事实（人名／地名／年代）。
    5. **含糊时澄清**：修改意见无法唯一确定落点时（"更有张力一点""节奏太慢了"），
       **不猜、不择优、不凭常识补全**——转 `fallback.ambiguous_request`，
       由 `guard_clarify_v1` 发起追问（一次最多 3 项、按重要性排序）。
       ⚠️ 澄清期间 **`change_log` 必须为空**：`clarification.needed` 为真时不得动手，
         "边问边改"会让客户看到的产物与预期错位，且事后无法分辨哪部分是你猜的。
    6. **多轮不得回退**：当 `{change_context}` 非空时，前一轮**已按客户要求改过的内容
       本轮不得改回原值**——即使"原始产物里本来就不是这样"。
       这是本层最隐蔽的失守（多轮之后客户会发现自己的修改"自己消失了"）。
    7. **输出完整性**：`artifact` 必须是**修订后的完整产物**（可直接替换原产物），
       **不是 diff 片段、不是待合并的补丁**；`change_log` 只说明改了什么，不替代产物本身。

  task: |
    按以下三步处理 `{modification_request}`，对 `{current_artifact}` 做定向修改。

    **第一步 · 意图识别（对应 SW-002 的"意图识别"）**
    把客户的口语化意见逐条拆解为**修改指令**，每条须确定四件事：
      · **改哪里**（`target_path`：能落到产物中**唯一一个**位置的 JSON 路径）；
      · **改成什么**（`after`：修改后的值，须是产物契约内合法的取值）；
      · **原值是什么**（`before`：逐字摘自 `{current_artifact}`，不得凭记忆转述）；
      · **依据哪句话**（`basis`：逐字摘自 `{modification_request}`）。
    ⚠️ **拆解粒度以「一句话一个意图」为准**：客户一句话里若含多个互相独立的改动
      （"把第 3 镜拉长到 6 秒，主角名字改成陆青"），**拆成多条**——合成一条会让
      "修改点与响应点一一对应"失去分辨率。
    ⚠️ 任何一项**定不下来**（改哪里不唯一／改成什么不明确），**该条不走流程**，
      整轮转 `fallback.ambiguous_request`。

    **第二步 · 定向重生成（对应 SW-002 的"定向重生成"）**
    在 `{current_artifact}` 上**只替换被点名的路径**，其余节点**原样保留**（含数组顺序）。
    · `op_type` 取值：`replace`（换值）／`normalize`（取值归一到词表，语义不变）／
      `insert`（新增，仅当产物契约允许该位置新增）／`delete`（删除，仅当该字段**非必备**）。
    · ⚠️ **必备字段不得 `delete`**；`insert` 造成的新字段**必须**在产物契约的字段集内
      （契约外字段会被 `R36` 拒收）。
    · ⚠️ 修改若使产物**自相矛盾**（改了单镜时长但没同步总时长、改了 `unit_id` 但没同步
       成员镜的 `unit_id`），**不得只改一处**——同一改动**牵连的所有位置必须一并改到**，
       并**为牵连到的每个位置各出一条 `change_log` 记录**（共用同一 `basis`）。
       这是"定向"与"守恒"的接缝：**定向＝不扩大改动面，不等于只改一个字**。
    · 修订后的产物**仍须满足其阶段的全部既有约束**（见 `{target_stage}` 对应纪律）。

    **第三步 · 一致性校验（对应 SW-002 的"一致性校验"）**
    交卷前逐项自检，并在 `change_log`／`unresolved` 中如实反映：
      · **数字守恒**：除被点名者外，全篇数字与修改前**逐个相同**；
      · **专名守恒**：除被点名者外，人名／地名／机构／角色名／道具名**逐字相同**；
      · **设定守恒**：外观／关系／结局／风格／镜序镜号**逐字相同**；
      · **锚与编号**：`character_id` 等**未发生任何变化**；
      · **修改点覆盖**：`{modification_request}` 的每个意图都有一条 `change_log` 对应；
      · **无多余改动**：`change_log` 没有一条是客户没要求的。
    完成后按 `output` 节的形态交卷。需要独立复核时，由 `check_consistency_v1` 另出漂移报告。

  context: |
    本节注入**素材与产物**（按拼装规则，素材类内容一律置于本节，不进入 system／task 节）。

    1. 当前产物（**修改的对象**，逐字注入、不得摘要）：
    {current_artifact}

    2. 客户修改意见（**原文**，`basis` 须能指回其中片段）：
    {modification_request}

    3. 前序修改轮次（多轮回退防护；首页为"无"）：
    {change_context}

    4. 上游阶段产物（零漂移的外部基准；无上游时为"无"）：
    {upstream_artifact}

    5. 不可改字段路径（命中即拒绝，不得"改了再报告"）：
    {locked_paths}

    ⚠️ 阅读顺序说明：**先读第 5 项**（锁定清单），再读第 2 项（客户意见），
       然后才落到第 1 项上定位路径——这样可避免"先想好怎么改、再看清单发现不能改"。
    ⚠️ 第 4 项非空时，**数字／专名／设定以第 4 项为准**（上游是权威源，当前产物可能是
       上一轮改动的结果）；第 4 项为空时须在 `unresolved` 中如实说明"本轮零漂移
       只能以当前产物自身为基准"这一局限。

  output: |
    输出**单个 JSON 对象**（受约束解码；不得输出解释性文字、不得用 Markdown 代码块包裹）。
    顶层**恰好 6 键**：

    1. `modify_version`：字符串，模板版本，固定 "1.0.0"。
    2. `target_stage`：字符串，回显并复述校验，取值与 `{target_stage}` 一致。
    3. `artifact`：**对象——修订后的完整产物**（可直接替换原产物；不是 diff 片段）。
    4. `change_log`：**数组**，逐条对应修改意图（无改动时为空数组 `[]`）。每条**恰好 8 键**：
       · `op_id`：字符串，形如 `MOD-01`（两位序号，全表唯一、不得跳号）；
       · `intent`：字符串，客户意图的一句话概括（**不得**照抄整段客户原话）；
       · `target_path`：字符串，JSON 路径，**必须能在 `artifact` 中解析到**
         （这是"修改点与响应点一一对应"的可脚本化内核）；
       · `op_type`：`replace`｜`normalize`｜`insert`｜`delete`；
       · `before`：修改前的值（逐字摘自 `{current_artifact}`；`insert` 时为空串）；
       · `after`：修改后的值（`delete` 时为空串）；
       · `basis`：字符串，客户原话中支撑本条的**逐字片段**（同一句意见引出的多条记录**共用同一 `basis`**）；
       · `upstream_impact`：`none`｜`duration_sum`｜`unit_membership`｜`cross_ref`｜`other`
         （改动是否牵连其他位置；非 `none` 时须在 `intent` 中写明牵连范围）。
    5. `unresolved`：**数组**，修改过程中发现但**客户未要求改**的问题（不得顺手改，
       也不得丢弃）。每条**恰好 4 键**：`field`（路径）／`reason`（问题描述）／
       `need`（需要客户或哪一层做什么）／`blocking`（**布尔**，是否阻断交付）。
       ⚠️ `blocking` 必须是**布尔真值**——字符串 `"false"` 在多数语言的真值判断下**为真**，
          是最隐蔽的一类契约违例（同判据 R37 的第 ③ 条）。
    6. `clarification`：**对象**，恰好 2 键：`needed`（布尔）／`questions`（字符串数组，
       `needed=false` 时为空数组，`needed=true` 时 1~3 条、按重要性排序）。
       ⚠️ `needed=true` 时 **`change_log` 必须为空数组**（澄清期间不动手）。

    错误写法（**只输出 diff 片段**）：
      {"target_path": "shots[2].duration_ms", "after": 6000}
      —— `artifact` 必须给出**完整产物**；只有 diff 意味着调用方还需自己合并，
         "合并"这一步没有判据、正是差错产生的地方。
    错误写法（**change_log 为空但 artifact 变了**）：
      {"change_log": [], "artifact": {……已改动……}}
      —— 改了却无记录，等于**无法回溯**；反过来 `change_log` 非空而 `artifact` 未变
         则是**伪记录**；两者都由判据 R38 拦下。
    错误写法（**顺手多改**）：
      客户只说"第 3 镜拉长到 6 秒"，却同时把"镜头"统一改成"机位"、修掉一个别字。
      —— 这是本层**最常见也最隐蔽**的失守：没有字段报错，但是客户没要求的改动。
    错误写法（**改锚**）：
      {"target_path": "characters[0].character_id", "after": "CHR-09"}
      —— 锚与编号一律不得改（客户要求改号等于要求重做，转 `out_of_scope`）。

  examples: |
    **示例 1 · 单条修改（最小正例）**
    输入（节选）：`target_stage=storyboard`；客户意见「第 3 镜太短了，拉到 6 秒」
    输出（节选）：
    ```json
    {
      "modify_version": "1.0.0",
      "target_stage": "storyboard",
      "artifact": {"…": "（完整分镜产物，仅 shots[2].duration_ms 由 4000 变为 6000）"},
      "change_log": [
        {
          "op_id": "MOD-01",
          "intent": "第 3 镜时长由 4 秒延长至 6 秒",
          "target_path": "shots[2].duration_ms",
          "op_type": "replace",
          "before": "4000",
          "after": "6000",
          "basis": "第 3 镜太短了，拉到 6 秒",
          "upstream_impact": "duration_sum"
        },
        {
          "op_id": "MOD-02",
          "intent": "整片总时长随第 3 镜连带同步（MOD-01 的牵连位置）",
          "target_path": "total_duration_ms",
          "op_type": "replace",
          "before": "32000",
          "after": "34000",
          "basis": "第 3 镜太短了，拉到 6 秒",
          "upstream_impact": "duration_sum"
        }
      ],
      "unresolved": [],
      "clarification": {"needed": false, "questions": []}
    }
    ```
    ⚠️ **两条记录、同一句依据**：改单镜时长必然牵连总时长，**两处都要改到**
       （"定向"不等于"只改一个字"，见 task 第二步）。`basis` 相同即表明二者同源；
       反过来，若两条记录的 `basis` 不同而 `target_path` 又互不牵连，那就是**过拆**。
    ⚠️ 注意 `MOD-02` 的 `before` 是 `"32000"`——**逐字摘自修改前的原件**，
       不是从上一条推算出来的（推算值可能与原件不符，而 `before` 的用途正是回溯原件）。

    **示例 2 · 一句话拆成多条（拆解粒度）**
    客户意见：「把第 3 镜拉长到 6 秒，另外主角名字改成陆青」
    —— 这是一个句子里**两个互相独立**的改动，须拆成 `MOD-01`／`MOD-02` 两条。
    ⚠️ 合成一条会让"修改点与响应点一一对应"失去分辨率：出问题时无法定位是哪半句没落实。

    **示例 3 · 含糊时不动手（澄清优先）**
    客户意见：「这段感觉不够紧张，你看着改改」
    输出：`change_log` 为 `[]`、`clarification.needed` 为 `true`，
    `questions` 例如 `["希望加强的是镜头节奏（如缩短单镜时长）还是运镜强度（如加大幅度）？",
    "是否允许改动现有台词？"]`。
    ⚠️ **不得**自己挑一个方向改了再问——"边问边改"会让客户看到的产物与预期错位。

    **示例 4 · 越权请求转出**
    客户意见：「把结局改成主角活下来」/「改成 9 个镜头」
    输出：不产出 `artifact` 改动，转 `fallback.out_of_scope`，
    在 `unresolved` 中登记该请求并写明"需走前四段重做或 `revise_v1` 重新成包"。
    ⚠️ "客户是甲方"不构成越权改动的理由——**改变故事不是修改，是另做**。

    **示例 5 · 发现但不动（unresolved 的用途）**
    修改过程中发现产物里有一处既有的风格锚点漏写（客户没提）。
    处置：**不动**，写入 `unresolved`（`field` 指向该处、`blocking=false`、
    `need` 写明"建议客户确认后单开一轮修改"）。
    ⚠️ 顺手补上＝违反第一条纪律；直接忽略＝问题从此消失。两条路都不对。

# guards 的分工说明（与 CFG-007_SCHEMA.md 的定义一致）：
#   标注【增量】者为本层**独有**的失败模式，默认必须注入；
#   其余为对 system 硬性约束的兜底复述，按失败模式定向追加。
guards:
  - 【增量】**定向性核对（本层第一条纪律，逐字比对）**：把 `artifact` 与 `{current_artifact}`
    做一次**全文差异清单**，逐条问「这一处差异在 `change_log` 里有对应记录吗」——
    凡「没有对应的差异」者即**顺手多改**，一律**回退**（改回原值），并在 `unresolved` 中说明。
    ⚠️ 差异清单要**包含标点、术语用词、数值写法与数组顺序**——本层最常见的失守不是
      "改错了"，而是"改对了但多改了"，而多改的每一处看起来都合理。
  - 【增量】**修改点覆盖核对（一一对应的另一半）**：把 `{modification_request}` 逐句拆成意图，
    每条问「`change_log` 里有对应记录吗」——**缺失 = 漏改**。
    ⚠️ **由同一句引出的多条记录是「牵连」（合法）**：判据是它们的 `target_path` 是否
       **彼此牵连**（改了时长→总时长也要变）；由同一句引出的多条**互不牵连**的记录
       才是过拆。两个方向都要查：只查"改了的是否有记录"会漏掉"要求了却没改"。
  - 【增量】**零漂移扫描（三类 + 锚）**：以 `{upstream_artifact}`（非空时）或 `{current_artifact}`
    为基准，逐项核对——
    ① **数字**：除被点名者外全篇数字逐个相同（含总时长＝各镜之和这一自洽关系）；
    ② **专名**：人名／地名／机构／角色名／道具名逐字相同（**含错别字一并保留**，
       客户没要求改的错别字也是"客户确认过的内容"）；
    ③ **设定**：外观／关系／结局／风格串／镜序镜号逐字相同；
    ④ **锚与编号**：`character_id`／`prop_id`／`scene_no`／`shot_id`／`unit_id`／`style_id`／
       `meta.pack_id`／`aigc_meta.ProduceID` **零变化**——任一变化即**整轮作废**。
  - 【增量】**锁定清单核对**：逐条 `change_log` 比对 `{locked_paths}`，命中即拒绝。
    ⚠️ 拒绝的正确形态是**不改动、如实登记**，不是"改了再在报告里说明"——
      后者在留痕上与"擅自改动"无法区分。
  - 【增量】**牵连范围核对（定向 × 守恒的接缝）**：凡改动可能造成产物自相矛盾者，
    必须**连带改到位**——改单镜时长要同步总时长；改 `unit_id` 要同步成员镜；
    改 `shot_no` 要同步 `shot_ids` 与全部 `shot_id`。逐条检查 `upstream_impact` 是否为 `none`
    以及为 `none` 是否属实。
    ⚠️ 这一条与第一条**方向相反、缺一不可**：第一条防"多改"，本条防"少改"。
  - 【增量】**多轮回退核对**：`{change_context}` 非空时，逐条比对前轮已改的路径——
    本轮若把它改回**原始产物**里的旧值，即为**回退**（客户会发现自己的修改"自己消失了"）。
  - 【增量】**澄清期不动手核对**：`clarification.needed=true` 时，`change_log` **必须为空**、
    `artifact` 必须与 `{current_artifact}` **逐字相同**；`questions` 为 1~3 条且按重要性排序。
  - 【增量】**上游基准明示核对**：`{upstream_artifact}` 为空时，`unresolved` 中**必须有**一条
    如实说明"本轮零漂移只能以当前产物自身为基准"；缺此条 = 把局限悄悄藏起来了。
  - 硬约束复述：定向修改（未点名者逐字保持）；零漂移三类 + 锚与编号不变；修改点与响应点
    一一对应；口径不越权（改故事／改镜数／改外观定义／改上游事实一律转出）。
  - 形态复述：顶层恰好 6 键；`change_log` 每条恰好 8 键、`op_id` 形如 `MOD-01` 且唯一不跳号；
    `target_path` 必须能在 `artifact` 中解析到；`unresolved` 每条恰好 4 键、`blocking` 为布尔；
    `clarification` 恰好 2 键。**枚举字段一律不得写空串**——留空即**省略键**。
    ⚠️ **必须输出完整 `artifact`**（判断标准：把它单独拿出来，就是一份可直接替换原产物的合法产物）。
  - 阶段纪律复述：`{target_stage}` 为 `pack` 时仍须满足《分镜提示词交付规范》全篇
    （八维双落地、外观不复述、风格锚点封闭、枚举合法、`stage_chain` 保持原值不追加）；
    为 `storyboard` 时不得重述外观；为 `shot_prompt` 时承继守恒（**尤其不得改 `duration_ms`**）。
    ⚠️ **本层不追加 `stage_chain` 新值**（枚举封闭）；改动事实由
      `meta.generation_trace.templates` 追加 `modify_v1` 表达。

fallback:
  ambiguous_request: 修改意见**无法唯一确定落点**（指代不明、程度词无判据、一句话里含互相冲突的
    两个方向）时——**不猜、不择优、不凭常识补全**。转 `guard_clarify_v1` 发起追问
    （一次最多 3 项、按重要性排序），并在 `clarification` 中登记；
    此时 `change_log` 置空、`artifact` 保持与 `current_artifact` 逐字相同。
    ⚠️ **这是 SW-002 异常列「修改意见含糊时澄清」的可执行形式**——本层必须留这个出口，
      否则模型会用"看起来合理的猜测"填满输入的空白，而客户事后无从分辨哪部分是自己要的。
    ⚠️ 追问须给出**可选项**而非开放问句（"是缩短单镜时长还是加大运镜幅度？"优于"你想怎么改？"）。
  out_of_scope: 修改意见要求**改变故事走向／人物关系／结局／镜头数量或镜序／全片风格定义／
    角色外观定义／已确认的上游事实**，或要求**改动锚与编号**时——**本层不执行**。
    处置：① 不产出 `artifact` 改动；② 在 `unresolved` 中登记该请求并写明
    「需走前四段重做、或以 `revise_v1` 重新成包」；③ 明确告知客户"这不是修改，是另做"。
    ⚠️ **不得"先改了再说"**：一次越权改动会让产物的溯源链断裂（改了号 → 下游引用指向不存在的对象），
      且**事后无法通过任何判据发现**（产物本身看起来仍然自洽）。
    ⚠️ 客户要求改号时**尤其**不得妥协——正确做法是重做并重新过门禁，不是改号。
  drift_detected: 自检发现**未被点名的内容被动到**（数字／专名／设定漂移，或锚与编号变化）时——
    处置为整轮回退：以 `{current_artifact}` 为基准重出，只保留被点名路径的改动；
    并在 `unresolved` 中登记"本轮检出并回退了 N 处顺带改动"（**如实登记，不得静默修正**）。
    ⚠️ 锚与编号任一变化时，**不得局部修补**——整轮作废重出。
  locked_violation: 改动命中 `{locked_paths}` 时——**不改动**、转 `out_of_scope` 口径处置，
    并在 `unresolved` 中写明命中的路径与锁定理由（备案关联字段／锚与编号）。
    ⚠️ **拒绝的形态必须是"没改"**；"改了并说明"与"擅自改动"在留痕上无法区分。
  output_too_long: 修改意见涉及**大面积改动**（如整场重写），或产物本身超出单次窗口时——
    不得截断、不得只回片段——按 `target_path` 涉及的**最小子树**重出该子树
    （连同其父路径与完整 `change_log`），由服务层贴回原产物；同时在 `change_log` 的
    `intent` 中注明"本次为子树级产出"，并**在服务层贴回后补跑一次完整一致性自检**。
    ⚠️ 本分支的核心约束不变：**贴回后的完整产物仍须"未点名者逐字保持"**。
  empty_request: 当 `{modification_request}` 为空、或通篇不含任何**可落到字段**的具体要求时——
    不产出改动，转 `guard_clarify_v1` 追问"希望改哪一镜／哪一项、改成什么"。
    ⚠️ **不得**"随便挑几个地方优化一下"充当响应。
  upstream_conflict: 修改意见与 `{upstream_artifact}` 冲突（如客户要求把人名改成一个
    与上游剧本不一致的名字）时——**不擅自二选一**：按 `out_of_scope` 处置并登记 `unresolved`，
    写明"该改动影响上游事实，须先在上游层确认"。
    ⚠️ 上游是权威源；在下游单方面改上游事实，会让同一事实在链路内出现两个取值。
