          "PropagateID": "首次写入时与 ProduceID 同值",
          "ReservedCode2": ""
        }
      }
    }

    数量与口径要求：
    1. **素材守恒**：客户素材已明确的事实类信息（尤其**台词原文**）与镜头意图，必须原样保留；
       凡你做了改写，都须落在**五类必改**之内，并在 `meta.notes` 留痕（至少映射依据与补切镜说明）。
    2. **粒度守恒**：`source_kind` 为 `prompt_list` / `pack` 时，镜头数量与时序必须与素材一致；
       仅 `script` 允许补切镜。补切镜后每场镜数须满足下游约束（单场镜数 ≤ ⌊场秒数 ÷ 4s⌋）。
    3. 每个镜头必须属于且仅属于一个单元（单元 2–3 镜、同场、**单元内运镜类型不得重复**）；
       `style_ref` 必须命中 `style_bible.style_id`；`character_refs` 必须命中 `characters[].character_id`；
       `prop_refs` 必须逐项命中 `props[].prop_id`——**引用完整性是阻断项**（§3.8）。
    4. **每镜必有**：shot_size／camera.move／style_ref／prompt_zh／prompt_en／
       action{start,change,end}／shot_language{composition,axis,result}／character_refs／prop_refs
       （与交付 schema `shot.required` 的 **14 项**逐字一致）。
    5. **prompt_zh / prompt_en 的可读性下界**（本层最易失败处）：每一镜的正文必须让读者
       **只看正文就能复现这一镜**——景别、运镜（含起止）、角度、光学落点、构图、轴线、
       光线、画面结果都要能读出来。读完仍不知道镜头怎么动 = 该镜不合格。
    6. 英文侧运镜句**必须以 `The camera` 起句且独立成句**；`static`／`pov` **不带幅度速度**。
    7. 正文**不得**复述角色外观与道具外观；**不得**出现 style_anchors 之外的风格词；
       **不得**出现模型参数指令；**不得**出现负向残留写法。
    8. 单角色镜**必须**有稳定指称，不得用「他／她」或省略主语；同一角色的指称**全片一致**；
       `name` 为「未指定」时不得自拟姓名。**把「character_id ↔ 指称词组」的映射写进 `meta.notes`**。
    9. `aigc_meta` **仅一份**，`ProduceID` 与 `meta.pack_id` 同值；不得出现第二个 AIGC 块。
    10. **台账不在交付包内**：`unspecified` **不得**出现在交付包的任何层级；
        台账由 `segment=gap_ledger` 单独产出，并在 `meta.notes` 写下文件名指引
        （格式：`[LEDGER] <pack_id>.unspecified.json | 条目数=<n> | blocking=<n>`）。
    11. **分段拼装规则**：`package_head` 与各 `unit:<id>` 的产物拼装后，必须是一个能过
        validate_pack.py 的完整包——调用方按 package_head → unit:U01 → unit:U02 … 顺序合并，
        `units` 按 unit_id 顺序、`shots` 按（unit 顺序 + unit 内 shot_ids 顺序）排列。
        **分段不改变任何字段取值**，只改变一次输出的范围。

  examples: |
    示例 1（**从素材到字段**：看五类必改如何落地，而不是如何改写）：

    客户素材（{source_material}，`source_kind=script`，摘录）：
      「第三场 便利店门口，夜。
        阿岚把便利袋放在长椅上，蹲下来系鞋带。她听见背后有人喊她名字，没回头。
        （备注：这场交给美术，灯先不急定；输出按 16:9 出）
        镜头从她背后慢慢推上去，停在她后颈。」

    解析要点（**动笔前必须产出的三件事**）：
      ① `source_kind = script`——素材**未切镜**（只写了一个「镜头」，更多是叙述）→ 本层**须补切镜**；
      ② 叙事骨架：场次＝第 3 场（夜／便利店门口）／台词＝无（有人喊名字，未给内容）／
         动作＝放袋、蹲下系鞋带、听见呼喊未回头；
      ③ 缺口：**事实类**——「喊她名字」的内容素材未给 → 标「未指定」+ 登记台账；
         **设计类**——阿岚外观素材未描述 → 由本层提议候选、`design_source=系统提议待确认`。

    落地为字段（**逐项标注属哪类必改**）：
      "scene_no": 3, "shot_id": "S03-SH001",
      "camera": {"move": "push_in", "speed": "slow",
                 "from": "阿岚背后约一米、齐腰高度", "to": "停在阿岚后颈，便利店的冷白灯箱在画面上缘",
                 "height": "eye_level", "roll": "level", "optics": "shallow_focus"},
                    ← ② 规范化：素材「慢慢推上去」→ `push_in` + `speed=slow`（「慢慢」是速度语义的
                       自然语言表达，映射到词表值；**幅度不强调 → 省略 amplitude 键**）
      "aspect_ratio": "16:9",     ← ④ 删冗余：素材的「按 16:9 出」进字段，**不进正文**
      （素材的「这场交给美术，灯先不急定」**整个丢弃**——制作备注不是给模型看的，属④）
      "lighting": "practical_light",   ← ② + ③：素材把灯留给美术，故由本层按场景（便利店冷白灯箱）
                                       选定词表值；**说明「冷白灯箱在画面上缘」已移入 prompt 正文**
      "duration_ms": 5000,        ← ⑤ 补缺口：素材未给时长，本层按动作量（放袋→蹲下→听见）定 5s
      "dialogue": "省略该键",      ← 素材里「有人喊她名字」**没有给出具体内容** → 不编造，
                                    登记台账（reason：「呼喊内容未指定，不影响画面可拍性」）

    示例 2（**锚的二分落地，以及它落在哪个产物上**）：
      素材写了「阿岚穿着米白色针织开衫，短发」→ `appearance_lock_zh` **原样承继**，
        来源＝「客户提供」（素材即客户提供）→ **不进台账**；
      素材**没写**便利袋的样子 → `props[0].appearance_lock_zh` 由本层提议
        （如「半透明塑料便利袋，袋口拧成一束，印着褪色的蓝色店招字样」），
        来源＝「系统提议待确认」→ **登记台账一条**（`owner=客户`、`fill_stage=revise`）。
      ⚠️ **二分不落在交付包字段上**——交付包契约里**没有** `design_source` 那个键
        （`characters[]`／`props[]` 均 `additionalProperties: false`，写入即被 `R36` 拒收）。
        本层的落点是**台账**与 `meta.notes`：**入台账的才是系统提议的**，未入台账的就是客户给出的。
      ⚠️ 两者的**区分必须留下**——混为一谈会让备案举证无法回答
        「哪些内容来自客户、哪些是系统生成的」（同链路口径）。

    示例 3（**台账单独产出**，`segment=gap_ledger`）：
      {"unspecified": [
        {"field": "characters[0].name", "upstream_field": "",
         "reason": "素材给出称呼『阿岚』但未说明是姓名还是昵称",
         "owner": "客户", "fill_stage": "revise",
         "fill_fallback": "以素材称呼先行拍摄，客户确认全名后如需变更须重出受影响的镜",
         "blocking": false},
        {"field": "shots[1].dialogue", "upstream_field": "",
         "reason": "素材未给出呼喊的具体内容",
         "owner": "客户", "fill_stage": "revise",
         "fill_fallback": "以无台词版本先行拍摄（呼喊处理为画外、不落字幕），不闭合亦可交付",
         "blocking": false}
      ]}
      —— 本产物**独立于交付包**落盘（`<pack_id>.unspecified.json`），
         `meta.notes` 中写入 `[LEDGER] <pack_id>.unspecified.json | 条目数=2 | blocking=0`。

    错误写法（**改写客户台词**）：
      "dialogue": "阿岚！等一下！"（素材只写「有人喊她名字」，本层自行补了台词）
      —— 事实类不得编造。素材没给的内容只能登记台账，不能填一个「读起来很顺」的值。
    错误写法（**改了客户的镜头时序**）：
      素材是一场戏一个长镜；本层为「丰富镜头语言」把它切成 4 个镜
      —— 粒度守恒：素材已定镜头数与时序时不得改动（`source_kind=prompt_list` / `pack`）。
    错误写法（**把制作备注写进正文**）：
      "prompt_zh": "……（此镜后期补音效，注意不要上字幕）"
      —— 内部批注属④删冗余，一律不得进正文（也不得进 `notes`）。
    错误写法（**stage_chain 填了不存在的阶段**）：
      "stage_chain": ["synopsis", "script", "storyboard", "shot_prompt"]
      —— 本层**没有跑过**那四段模板（`templates` 里只有 `revise_v1`），填它们＝伪造溯源。
        **照实填 `["revise"]`**，即使当前契约枚举会因此报 1 条 BLOCK（见版本说明 `ISSUE-017`）。
    错误写法（**台账塞进交付包**）：
      {"schema_version": "2.1.0", …, "unspecified": [ … ]}
      —— 交付包无该段（规范 §3.1 顶层八段）；会被 R36 与 schema 的
        `additionalProperties:false` 拒收。台账**单独产出**。

# guards 的分工说明（与 CFG-007_SCHEMA.md 的定义一致）：
#   标注【增量】者为本层**独有**的失败模式，默认必须注入；
#   其余为对 system 硬性约束的兜底复述，按失败模式定向追加。
guards:
  - 【增量】**素材守恒扫描**：把 {source_material} 中的**事实类字符串**（人名／地名／年代／数值）
    与**台词原文**逐条取出，在交付包里逐条找回去——**找不到即漏**（说明被改写了），
    找到但**不是逐字相同**即**改了客户原文**。这两类是本层最隐蔽的失守：
    改写读起来更顺，且没有任何字段会因此报错。
  - 【增量】**五类必改白名单核对**：把交付包与素材做一次差异清单，逐条标注属五类中的哪一类
    （① 形态改写／② 规范化／③ 拆分／④ 删冗余／⑤ 补缺口）。
    **凡标不出类别的差异，一律回退素材原文**——「顺手润色」正是这样进来的。
  - 【增量】**粒度守恒核对**：`source_kind` 为 `prompt_list` / `pack` 时，
    逐项核对**镜头数量与时序**与素材一致；不一致即违规（唯一例外是 `script` 且已留痕补切镜）。
  - 【增量】**锚的二分核对**：逐个设计类字段问一句「这个值**素材里有吗**」——
    有 → `design_source=客户提供`；没有 → `系统提议待确认` **且台账里有对应条目**。
    两者缺一即不合格（混标会让备案举证无法区分客户内容与系统生成内容）。
  - 【增量】**台账完整性**：`meta.notes` 必有 `[LEDGER]` 行；
    台账条目须与实际缺口一一对应（**不多不少**）；`owner=客户` 者 `fill_stage` 必须为 `revise`；
    **`blocking=false` 的条目必须写明「不闭合亦可交付」的判定依据**。
  - 【增量】**正文密度下界**：逐镜自检「只看 prompt_zh／prompt_en，能不能复现这一镜」——
    景别、运镜（含起止）、角度、光学、构图、轴线、光线、画面结果逐项找对应句。
    读完仍不知道镜头怎么动 = 该镜不合格。
  - 【增量】**外观词扫描**：把 `characters[].appearance_lock_zh` 与 `props[].appearance_lock_zh`
    按标点切段，逐段在 prompt 正文里搜——命中即删（改写为瞬时状态或去掉）；
    同一条扫描也用于 `style_anchors`（清单之外的风格词命中即删）。
  - 【增量】**指称一致性扫描**：同一角色在全片正文中**只能有一个词组**；
    单角色镜不得出现「他／她」或省略主语；`name` 为「未指定」时不得自拟姓名。
    对照 `meta.notes` 的 `CHR-xx → 词组` 映射声明核验。
  - 硬约束复述：素材守恒；粒度守恒；锚的二分；五类必改；外观只定义一次；八维双落地；
    运镜独立成句以 The camera 起句；要素顺序 主体→动作→环境→光线→镜头语言→风格；
    长度中文 **90–280 字** / 英文 **450–1200 字符**（建议值）。
  - 枚举复述：shot_size 六值；camera.move 20 类；amplitude 只填 small／large、
    speed 只填 slow／fast（medium／normal **省略该键**）；transition 5 值；lighting 取 15 值词表；
    character_id 形如 CHR-01；prop_id 形如 PRP-01；shot_id 形如 S03-SH001。
    ⚠️ **枚举字段一律不得写空串**——留空即**省略键**（判据 R33）。
  - 引用完整性：style_ref 命中 style_bible.style_id；character_refs 命中 characters[].character_id；
    prop_refs 命中 props[].prop_id（§3.8 阻断项）。
  - 单位与格式：duration_ms 为整秒且落在 4–15s；created_at／checked_at 为 ISO 8601 带时区；
    total_duration_ms ＝ 各镜之和；aigc_meta 仅一份且 ProduceID 与 pack_id 同值。
  - 合规复述：不使用绝对化与宣传性表述；不写暴力、色情、恐怖的具体细节；
    避免真实人物姓名与肖像描述；客户素材中的真实姓名须按本工程脱敏要求处理后再入包。

fallback:
  insufficient_input: 当 `{source_material}` 缺失或**无法解析出任何叙事骨架**（既无场次、也无镜头、
    也无台词／动作）时**不生成**，改由 guard_clarify_v1 发起追问（一次最多 3 项，按重要性排序），
    并明确告知客户「需要提供什么形态的素材」（提示词清单／剧本／旧交付包，任一即可）。
    ⚠️ **不得凭素材的只言片语硬编一份完整包**——那会把「客户没说过的话」写成交付物。
  parse_failed: 素材可读但**结构冲突**（如同一场次出现两个矛盾的时间设定、镜头编号重复或倒序）时，
    **不猜测、不择优**——按 `source_kind` 回退：把冲突点逐条写进缺口台账并标 `owner=客户`，
    **对可拍的部分照常产出**（不阻断整条链），并在 `meta.notes` 写明「本次为部分解析产出，
    冲突点见台账第 N 条」。这是 SW-008 异常列「解析失败回退原输入」的可执行形式。
  anchor_missing: 素材既未描述角色外观、`client_visual_input` 亦为空时，
    **不得据素材正文里的动作反推外观**（这是锚定的典型错误）——由本层**提议候选**、
    标 `design_source=系统提议待确认`、登记台账，并说明「客户确认后如需变更须重出受影响的镜」。
  ledger_missing: 台账产物未随包产出时，**视为交付不完整**——
    在 `meta.notes` 的 `[LEDGER]` 行写 `缺失`，并按 `pack_meta` 的注入情况作占位预演；
    **不得改为把台账塞进交付包**。
  output_too_long: 单次输出的分段产物仍超过模型单次窗口（`auto` 下本不应发生；显式指定 `all`
    且镜数过多时可能出现）时，**不得截断、不得压缩维度**——自动降级为
    `package_head` + 逐 `unit:<id>` + `gap_ledger` 分段产出并逐段自检，拼装后再过门禁；
    同时在 `meta.notes` 登记「本次为降级分段产出」及镜数。
  metadata_missing: 注入的 pack_meta 缺 pack_id／statement_id／provider_code 等备案关联字段时，
    **照常产出产物**，但：① 该字段写占位符（`{{PROVIDER_CODE}}` 等）；
    ② 在 `meta.notes` 写明「本包为占位预演，未取得编号，不得用于正式交付」。
    **不得停止生成**，也**不得自拟值**。
  refusal: 素材涉及政治敏感、真实人物、违法犯罪方法时，不生成，改由 guard_refuse_v1 处理；
    并在返回信息中说明「素材本身不可用」而非「能力不足」。
