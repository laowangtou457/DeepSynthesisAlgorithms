  active: 12
  deprecated: 0
  by_task_type:
    generate: 5
    summarize: 2
    rewrite: 2
    extract: 1
    guard: 2
  by_stage:
    synopsis: 1
    script: 1
    storyboard: 1
    shot_prompt: 0
    revise: 0
  business_chain_note: "AI 漫剧业务链路 5 个模板建设中（与 SCHEMA.md 的 stage 枚举 5 值一一对应）：已建 3（synopsis_v1 / script_v1 / storyboard_v1），待建 2（shot_prompt / revise）"
