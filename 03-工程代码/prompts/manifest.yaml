# 提示词资产库 · 主清单
#
# 本文件是提示词资产的登记索引，是备案材料「二次开发说明」的直接佐证。
# 每个模板独立存放于 templates/ 目录，本清单记录其元信息与版本。
#
# 修改规范：
#   1. 新增模板 → 在 templates/ 建文件，然后在本清单登记
#   2. 修改模板 → 必须提升 version，禁止原地覆盖历史版本
#   3. 下线模板 → status 改为 deprecated，不删除（保证历史可追溯）

meta:
  project: 生成合成类（文本合成）算法
  asset_type: 提示词模板资产
  schema_version: "1.0.0"
  updated_at: "2026-10-13"

# 版本规范：主版本.次版本.修订号
#   主版本：模板结构变更（变量增删、职责调整）
#   次版本：约束/示例调整（影响输出风格）
#   修订号：文案微调（不影响语义）

templates:

  # ========== 内容生成类 ==========
  - id: synopsis_v1
    name: 故事梗概生成
    task_type: generate
    stage: synopsis
    file: templates/synopsis_v1.yaml
    version: "2.0.0"
    status: active
    variables: [source_input, genre, target_duration, audience, must_include, must_avoid]
    scenes:
      - AI 漫剧链路第 1 段：一句话创意 → 结构化梗概
      - 短剧项目立项前的故事结构梳理
    constraints:
      - 只依据给定要点扩写；人名／地名／机构名／年代不得自行编造，缺失一律写「未指定」
      - 覆盖全部输入要点，覆盖情况写入 covered_points 字段供机器核查
      - 不得改变客户已给定的角色关系、事件因果与结局走向
      - 每个角色必须带 character_id（CHR-01 起顺序编号），跨阶段不得改号、不得为「未指定」——这是 SW-002「零漂移」校验的唯一锚点
      - 角色外观与全片风格串的首次定义责任在剧本阶段（SW-005）；本层只做占位与缺口登记，不得越权定义、不得编造
      - 缺口交接：凡字段值为「未指定」，必须在 unspecified 中存在对应条目（含 field／reason／fill_stage／fill_fallback／blocking），二者互为校验
      - 禁止项承接：must_avoid 须逐条原样写入 forbidden_items，供下游各阶段累计传递
    notes: 链路源头模板（v2.0.0 依导演视角两轮评审修订），输出 JSON 供 SW-005 剧本生成消费；用例见 examples/synopsis-case01.md

  - id: script_v1
    name: 剧本生成
    task_type: generate
    stage: script
    file: templates/script_v1.yaml
    version: "2.0.0"
    status: active
    variables: [synopsis_json, gap_answers, client_visual_input]
    scenes:
      - AI 漫剧链路第 2 段：已确认梗概 → 三幕剧本（场次／对白／旁白／角色表／道具表）
      - 短剧项目的剧本化编排
    constraints:
      - 事实类信息（人名／地名／机构名／年代／数值）不得编造；梗概标「未指定」且客户未答复者继续保持「未指定」（**此限定只管事实类**，设计类按下条处理）
      - 设计类的判定是**规则式**（不用枚举清单）：凡 output 中带 design_source 的值即为设计类（角色外观／全片风格／配色／道具外观／声线）——不得留「未指定」；客户未提供者由本层提出具体候选，design_source 标「系统提议待确认」并登记进 unspecified
      - 来源标注**分两层、不得合并**：source 记承继类（name／role／identity，客户提供｜承继上游）；design_source 记本层首定义的设计类（客户提供｜系统提议待确认）
      - 外观锁定串与风格锚的取值**必须与场景／时相／天气无关**：只写固有特征，不得混入瞬时状态（湿发／雨渍／泥点／汗）、情绪与神情、随剧情可变的状态、时相依存元素；分时相光照差异归 lighting_default 与下游逐镜 lighting
      - props[] 承载道具／关键物件外观（prop_id 自 PRP-01 起、本层分配、全链路不得改号）；无道具时为空数组；scenes[].props_present 只能引用已定义的 prop_id
      - 角色 character_id 必须与梗概一一对应，不得改号、增删（SW-002 零漂移校验的锚点）；time_of_day 属事实类，不得更改时相
      - 场号 no 沿用梗概 scenes_outline 的 no，不得重新编号、合并或拆分场次
      - 三幕齐备（建置／对抗／结局），每个场景必须归属其中一幕；purpose 仅限「建立／升级／转折／反转／收束」且与梗概对应场一致
      - 每场 action 至少含 3 个「状态／空间／主体发生变化」的节点——下游切镜的依据是新信息，不是字数
      - 场时长两个方向：纵向 total_est_seconds = Σ各场值且与梗概偏差 ≤10%；横向**每场 est_seconds ≥ 8 秒**（＝下游单镜下限 4s × 单元最少 2 镜，场时长即该场的镜数预算）
      - scenes[].sfx_hint 承载本场环境音／音效线索（可为空数组），供下游分镜层 sfx 与单元 soundscape 取材；本层不承担最终音效设计
      - 对白用 speaker_id 指向 characters 中的 character_id（旁白记空串）；dialogue.type 仅限「对白／旁白／画外音」
      - 语速口径与规范 §4.5 统一：设计口径按 4–6 字/秒保守估算（**非硬阈值**），交付门禁判据为「字数 ÷ 秒数 ≤ 9」
      - 缺口台账七项（field／upstream_field／reason／owner／fill_stage／fill_fallback／blocking）；**owner=客户 者 fill_stage 必须为 script（本层）**——不得把「待客户确认」推给下游阶段；upstream_field 记梗概原始路径，使跨层路径映射可机器比对
      - 叙事事实类缺口必须二选一：blocking=true 强制停线追问，或 blocking=false 且 fill_fallback 写明「不闭合亦可交付」的判定依据——不得既标 false 又指望它被补上
      - 禁止项承接：梗概 forbidden_items 须逐条原样写入本层 forbidden_items
      - 本层只做剧本化编排，**不做镜头切分**（切镜属 SW-006 分镜脚本职责）
    notes: 链路第 2 段模板（**v2.0.0** 依导演视角独立评审 `SR-01`~`SR-11` 修订，逐条处置见 `10-评审记录/script_v1-…-复查记录.md`），输入 synopsis_v1（SW-004）的已确认梗概 JSON，输出 JSON 供 SW-006 分镜脚本消费；用例见 examples/script-case01.md

  - id: storyboard_v1
    name: 分镜脚本生成
    task_type: generate
    stage: storyboard
    file: templates/storyboard_v1.yaml
    version: "2.1.0"
    status: active
    variables: [script_json, duration_bounds, gap_answers, shot_density]
    scenes:
      - AI 漫剧链路第 3 段：已确认剧本 → 分镜脚本（逐场切镜 + 逐镜镜头语言标注）
      - 短剧项目的镜头切分与镜头语言设计
    constraints:
      - 双守恒（v2.1.0 新增动作守恒）：剧本每一句台词必须分配到某一镜的 dialogue；且每一场 action 的每个节点都要落到某一镜的 action.change／shot_language.result 上——只保住台词而丢了动作，是本层最隐蔽的失败；节点拍不到时必须在 unspecified 写明理由
      - 切镜依据（v2.1.0 依 BR-01 新增，规范 §4.1「必须」）：每个切点必须踩在一个新信息节点（新主体／空间／状态／视角／时间）上；相邻两镜只差距离或轻微角度时应合并为一次运镜而不是切镜；同步 §4.6 跨单元重复动作排查
      - character_id 沿用剧本、不得改号；scene_no 沿用剧本 scenes 的 no、切镜只在场内部进行；style_ref 引用剧本 style_bible.style_id
      - props 承接（**v2.0.0 随上游 props[] 新增**；**v2.1.0 依 BR-03 补覆盖要求**）：shots[].prop_refs 只能引用剧本 props[].prop_id；不得新增道具；剧本 props 为空时全片 prop_refs 均为空数组；**某场 props_present 非空时该场至少有一镜须标进 prop_refs**（整场漏标即漏拍）
      - 本层**不定义外观与风格、不重述外观（角色与道具均含）**（首定义责任在剧本层 SW-005）；**不写 prompt_zh／prompt_en 正文、不做模型适配、不写 AIGC 元数据块**（属 SW-007）
      - 外观重述的边界（v2.1.0 依 BR-02 写明）：承接 action 里的**动作对象**可以；把外观**特征词**（颜色／材质／饰件／磨损／款式）写进 action.*／shot_language.*／camera.from|to／notes 不可以；逐镜语义字段只写瞬时状态
      - 八维镜头语言（规范 §4.1）两层口径：景别／运镜**每镜必有**（覆盖 100%）；角度／光学／构图／轴线／光线／画面结果六维按 §4.2 覆盖率阈值在单元与整片层面达标（≥40%／≥30%／≥50%／≥30%／≥40%／≥60%），**不要求每镜全开**；「画面结果」最易漏，防「空气挥拳」
      - 运镜三要素（v2.1.0 依 BR-08 补省略规则）：camera.amplitude 只填 small／large、camera.speed 只填 slow／fast——medium／normal 是默认值、通常省略，不需要强调时留空串，不得当必填值填满；static 与 pov 一律不得携带幅度速度
      - 生成单元含 2–3 镜（禁 1 镜与 ≥4 镜），同一单元内运镜类型不得重复；一个镜头只属于一个单元；单元不得跨场，shot_ids 须按镜序连续递增（v2.1.0 依 BR-11 补）
      - 质量门 11 项（规范 §4.2）**二分处理**（v2.1.0 依 BR-12）：结构性约束（单元镜数 ∈[2,3]、单元内运镜不重复、static/pov 不带幅度速度、景别／运镜每镜必有、单场镜数 ≤⌊场秒数÷4s⌋）写进生成约束、必须满足；统计性阈值（覆盖率／占比／类型数）标注为「交付前脚本复算」，不由模型承诺
      - 单镜 duration_ms 必须整秒且落在 duration_bounds 秒区间内（默认 4-15＝MiniMax H3 口径）；台词语速 ≤9 字/秒，超出只延长时长、不改画面
      - 转场单侧表达：单元内部相邻衔接由后一镜 transition_in，transition_out 仅单元末镜；**单元边界＝前单元末镜出点 + 后单元首镜入点，两个半段，不算「两头都写」**（v2.1.0 依 BR-07 明确口径）；music 无则填 N/A 且禁抽象情绪词
      - 单人镜必须遵守单人替身法则（具名锚点、禁省略主语）；**§4.4 两条禁律（禁「无光的镜头」、禁「无结果的静止」）对「所有静止／无人戏镜头」均适用，不限单人戏**（v2.1.0 依 BR-13 与规范原文对齐）
      - 禁止项承接：剧本 forbidden_items 须逐条原样转入本层 forbidden_items
      - 缺口续接：剧本 unspecified 中 fill_stage=storyboard 且已答复者视为闭合、不再输出；本层新产生缺口须登记为七项（field／upstream_field／reason／owner／fill_stage／fill_fallback／blocking），**owner=客户 者 fill_stage 必须回退为 script**（本层与下游均无权补），不得把客户侧缺口继续前移至 shot_prompt；**本层新产生的客户侧缺口须由 client_confirm 兜底发出追问**（v2.1.0 依 BR-05 补齐出口），不得静默停在本层
      - 本层产出不属 SCHEMA.md 意义上的「设计类内容」（属导演技艺表达）——SCHEMA 的设计类指角色外观／风格串／道具外观等**内容性设计**，其首定义在剧本层；本层唯一例外是自主提议的 music 织体，按既有 unspecified 机制登记来源（v2.1.0 依 BR-04 写明口径）
      - quality_gate 的数值字段（shot_count／static_shot_count／move_types／move_type_min_required）为**可选参考**；填写即须等于由 shots 复算的真值（v2.1.0 依 BR-10）
    notes: 链路第 3 段模板（**导演决策层**）；**v2.1.0** 依导演视角独立评审 `BR-01`~`BR-13` 修订（补切镜依据、动作守恒、外观边界、幅度速度省略规则、追问出口、质量门二分，措辞改正为「规范字段集的真子集」并列 SW-007 需补字段清单；output 字段未增删故属次版本）；v2.0.0 系依 SW-005 `script_v1` v2.0.0 的输出契约变更机械承接（新增 shots[].prop_refs 与 unspecified 的 owner／upstream_field）；字段名与《分镜提示词交付规范 v1.2》§3.5／§3.6 逐字对齐，使下游 SW-007 的适配从「重新设计」降级为「格式投影」（**但本层产出是该字段集的真子集，镜头级 style_ref／prompt_zh／prompt_en／aspect_ratio 须由 SW-007 补齐**）；输入 script_v1（SW-005）的剧本 JSON，输出 JSON 供 SW-007 消费；用例见 examples/storyboard-case01.md

  - id: gen_article_v1
    name: 长文内容生成
    task_type: generate
    file: templates/gen_article_v1.yaml
    version: "1.0.0"
    status: active
    variables: [topic, audience, tone, length, key_points, must_avoid]
    scenes:
      - 行业资讯稿撰写
      - 产品介绍文案
      - 公众号推文初稿
    constraints:
      - 仅依据给定要点展开，不编造事实与数据
      - 不使用绝对化表述
      - 术语按给定词表
    notes: 默认输出 Markdown 结构；需配合输出护栏使用

  - id: gen_reply_v1
    name: 客服对话回复生成
    task_type: generate
    file: templates/gen_reply_v1.yaml
    version: "1.0.0"
    status: active
    variables: [question, context, policy, tone]
    scenes:
      - 在线客服自动回复
      - 工单首次响应
    constraints:
      - 不承诺无法履行的条件
      - 涉及金额/时效必须引用给定政策条款
      - 信息不足时主动追问而非猜测

  # ========== 摘要归纳类 ==========
  - id: sum_digest_v1
    name: 长文本摘要归纳
    task_type: summarize
    file: templates/sum_digest_v1.yaml
    version: "1.0.0"
    status: active
    variables: [text, max_points, max_chars_per_point, audience, focus]
    scenes:
      - 会议纪要提炼
      - 长文要点提取
      - 报告摘要生成
    constraints:
      - 要点必须可回溯到原文
      - 按重要性降序
      - 不添加原文没有的结论
    notes: 配合 temperature≤0.3 使用

  - id: sum_meeting_v1
    name: 会议纪要结构化归纳
    task_type: summarize
    file: templates/sum_meeting_v1.yaml
    version: "1.0.0"
    status: active
    variables: [transcript, attendees, meeting_date]
    scenes:
      - 会议录音转写稿整理
    constraints:
      - 严格区分「决议」「待办」「讨论」
      - 待办必须含责任人与时限，缺失则标注待确认
      - 不推断未明确表态的内容

  # ========== 改写润色类 ==========
  - id: rw_polish_v1
    name: 文本润色改写
    task_type: rewrite
    file: templates/rw_polish_v1.yaml
    version: "1.0.0"
    status: active
    variables: [source_text, target_style, length_ratio, forbidden_words]
    scenes:
      - 口语稿转书面稿
      - 风格统一化处理
      - 表达优化
    constraints:
      - 保留原文事实与数据，不得修改数字
      - 不改变原文立场
      - 输出仅含改写结果与变更说明

  - id: rw_compress_v1
    name: 文本精简压缩
    task_type: rewrite
    file: templates/rw_compress_v1.yaml
    version: "1.0.0"
    status: active
    variables: [source_text, target_chars, preserve]
    scenes:
      - 摘要式精简
      - 版面限字改编
    constraints:
      - 优先保留 preserve 指定的内容
      - 不损失关键限定语（如时间、范围、条件）

  # ========== 结构化抽取类 ==========
  - id: ext_json_v1
    name: 结构化信息抽取
    task_type: extract
    file: templates/ext_json_v1.yaml
    version: "1.0.0"
    status: active
    variables: [text, schema, strict]
    scenes:
      - 合同要素抽取
      - 工单信息归类
      - 文本转结构化数据
    constraints:
      - 严格按给定 Schema 输出，禁止增删字段
      - 字段缺失填 null，禁止编造
      - 仅输出 JSON，不含任何解释文字
    notes: 必须配合约束解码（FSM）使用，temperature=0

  # ========== 安全与兜底类 ==========
  - id: guard_refuse_v1
    name: 安全拒答与兜底
    task_type: guard
    file: templates/guard_refuse_v1.yaml
    version: "1.0.0"
    status: active
    variables: [refuse_reason, fallback_suggestion]
    scenes:
      - 敏感请求拒答
      - 能力边界外请求的引导
    constraints:
      - 不解释具体拒答规则（防绕过）
      - 不使用说教口吻
      - 提供可行的替代方向
    notes: 输出护栏命中后由此模板生成用户可见话术

  - id: guard_clarify_v1
    name: 信息不足澄清追问
    task_type: guard
    file: templates/guard_clarify_v1.yaml
    version: "1.0.0"
    status: active
    variables: [missing_items, known_items]
    scenes:
      - 需求模糊时的追问
      - 关键信息缺失时的引导
    constraints:
      - 一次最多追问 3 项
      - 按重要性排序
      - 不重复追问已提供的信息

# ========== 统计 ==========
summary:
