# 提示词资产库 · 主清单
#
# 本文件是提示词资产的登记索引，是备案材料「二次开发说明」的直接佐证。
# 每个模板独立存放于 templates/ 目录，本清单记录其元信息与版本。
#
# 修改规范：
#   1. 新增模板 → 在 templates/ 建文件，然后在本清单登记
#   2. 修改模板 → 必须提升 version，禁止原地覆盖历史版本
#   3. 下线模板 → status 改为 deprecated，不删除（保证历史可追溯）

meta:
  project: 生成合成类（文本合成）算法
  asset_type: 提示词模板资产
  schema_version: "1.0.0"
  updated_at: "2026-10-13"

# 版本规范：主版本.次版本.修订号
#   主版本：模板结构变更（变量增删、职责调整）
#   次版本：约束/示例调整（影响输出风格）
#   修订号：文案微调（不影响语义）

templates:

  # ========== 内容生成类 ==========
  - id: synopsis_v1
    name: 故事梗概生成
    task_type: generate
    stage: synopsis
    file: templates/synopsis_v1.yaml
    version: "2.0.0"
    status: active
    variables: [source_input, genre, target_duration, audience, must_include, must_avoid]
    scenes:
      - AI 漫剧链路第 1 段：一句话创意 → 结构化梗概
      - 短剧项目立项前的故事结构梳理
    constraints:
      - 只依据给定要点扩写；人名／地名／机构名／年代不得自行编造，缺失一律写「未指定」
      - 覆盖全部输入要点，覆盖情况写入 covered_points 字段供机器核查
      - 不得改变客户已给定的角色关系、事件因果与结局走向
      - 每个角色必须带 character_id（CHR-01 起顺序编号），跨阶段不得改号、不得为「未指定」——这是 SW-002「零漂移」校验的唯一锚点
      - 角色外观与全片风格串的首次定义责任在剧本阶段（SW-005）；本层只做占位与缺口登记，不得越权定义、不得编造
      - 缺口交接：凡字段值为「未指定」，必须在 unspecified 中存在对应条目（含 field／reason／fill_stage／fill_fallback／blocking），二者互为校验
      - 禁止项承接：must_avoid 须逐条原样写入 forbidden_items，供下游各阶段累计传递
    notes: 链路源头模板（v2.0.0 依导演视角两轮评审修订），输出 JSON 供 SW-005 剧本生成消费；用例见 examples/synopsis-case01.md

  - id: script_v1
    name: 剧本生成
    task_type: generate
    stage: script
    file: templates/script_v1.yaml
    version: "1.0.0"
    status: active
    variables: [synopsis_json, gap_answers, client_visual_input]
    scenes:
      - AI 漫剧链路第 2 段：已确认梗概 → 三幕剧本（场次／对白／旁白／角色表）
      - 短剧项目的剧本化编排
    constraints:
      - 事实类信息（人名／地名／机构名／年代／数值）不得编造；梗概标「未指定」且客户未答复者继续保持「未指定」
      - 设计类信息（角色外观／全片风格串／配色）的**首次定义责任在本层**——不得留「未指定」；客户未提供者由本层提出具体候选，source 标「系统提议待确认」并登记进 unspecified
      - 角色 character_id 必须与梗概一一对应，不得改号、增删（SW-002 零漂移校验的锚点）
      - 场号 no 沿用梗概 scenes_outline 的 no，不得重新编号、合并或拆分场次
      - 三幕齐备（建置／对抗／结局），每个场景必须归属其中一幕；purpose 仅限「建立／升级／转折／反转／收束」且与梗概对应场一致
      - 对白一律用 speaker_id 指向 characters 中的 character_id；不得出现 characters 之外的说话人（旁白记空串）
      - 禁止项承接：梗概 forbidden_items 须逐条原样写入本层 forbidden_items
      - 缺口续接：梗概 unspecified 中 fill_stage=script 且已答复者视为闭合、不再输出；本层新产生缺口须登记
      - 本层只做剧本化编排，**不做镜头切分**（切镜属 SW-006 分镜脚本职责）
    notes: 链路第 2 段模板，输入 synopsis_v1（SW-004）的已确认梗概 JSON，输出 JSON 供 SW-006 分镜脚本消费；用例见 examples/script-case01.md

  - id: gen_article_v1
    name: 长文内容生成
    task_type: generate
    file: templates/gen_article_v1.yaml
    version: "1.0.0"
    status: active
    variables: [topic, audience, tone, length, key_points, must_avoid]
    scenes:
      - 行业资讯稿撰写
      - 产品介绍文案
      - 公众号推文初稿
    constraints:
      - 仅依据给定要点展开，不编造事实与数据
      - 不使用绝对化表述
      - 术语按给定词表
    notes: 默认输出 Markdown 结构；需配合输出护栏使用

  - id: gen_reply_v1
    name: 客服对话回复生成
    task_type: generate
    file: templates/gen_reply_v1.yaml
    version: "1.0.0"
    status: active
    variables: [question, context, policy, tone]
    scenes:
      - 在线客服自动回复
      - 工单首次响应
    constraints:
      - 不承诺无法履行的条件
      - 涉及金额/时效必须引用给定政策条款
      - 信息不足时主动追问而非猜测

  # ========== 摘要归纳类 ==========
  - id: sum_digest_v1
    name: 长文本摘要归纳
    task_type: summarize
    file: templates/sum_digest_v1.yaml
    version: "1.0.0"
    status: active
    variables: [text, max_points, max_chars_per_point, audience, focus]
    scenes:
      - 会议纪要提炼
      - 长文要点提取
      - 报告摘要生成
    constraints:
      - 要点必须可回溯到原文
      - 按重要性降序
      - 不添加原文没有的结论
    notes: 配合 temperature≤0.3 使用

  - id: sum_meeting_v1
    name: 会议纪要结构化归纳
    task_type: summarize
    file: templates/sum_meeting_v1.yaml
    version: "1.0.0"
    status: active
    variables: [transcript, attendees, meeting_date]
    scenes:
      - 会议录音转写稿整理
    constraints:
      - 严格区分「决议」「待办」「讨论」
      - 待办必须含责任人与时限，缺失则标注待确认
      - 不推断未明确表态的内容

  # ========== 改写润色类 ==========
  - id: rw_polish_v1
    name: 文本润色改写
    task_type: rewrite
    file: templates/rw_polish_v1.yaml
    version: "1.0.0"
    status: active
    variables: [source_text, target_style, length_ratio, forbidden_words]
    scenes:
      - 口语稿转书面稿
      - 风格统一化处理
      - 表达优化
    constraints:
      - 保留原文事实与数据，不得修改数字
      - 不改变原文立场
      - 输出仅含改写结果与变更说明

  - id: rw_compress_v1
    name: 文本精简压缩
    task_type: rewrite
    file: templates/rw_compress_v1.yaml
    version: "1.0.0"
    status: active
    variables: [source_text, target_chars, preserve]
    scenes:
      - 摘要式精简
      - 版面限字改编
    constraints:
      - 优先保留 preserve 指定的内容
      - 不损失关键限定语（如时间、范围、条件）

  # ========== 结构化抽取类 ==========
  - id: ext_json_v1
    name: 结构化信息抽取
    task_type: extract
    file: templates/ext_json_v1.yaml
    version: "1.0.0"
    status: active
    variables: [text, schema, strict]
    scenes:
      - 合同要素抽取
      - 工单信息归类
      - 文本转结构化数据
    constraints:
      - 严格按给定 Schema 输出，禁止增删字段
      - 字段缺失填 null，禁止编造
      - 仅输出 JSON，不含任何解释文字
    notes: 必须配合约束解码（FSM）使用，temperature=0

  # ========== 安全与兜底类 ==========
  - id: guard_refuse_v1
    name: 安全拒答与兜底
    task_type: guard
    file: templates/guard_refuse_v1.yaml
    version: "1.0.0"
    status: active
    variables: [refuse_reason, fallback_suggestion]
    scenes:
      - 敏感请求拒答
      - 能力边界外请求的引导
    constraints:
      - 不解释具体拒答规则（防绕过）
      - 不使用说教口吻
      - 提供可行的替代方向
    notes: 输出护栏命中后由此模板生成用户可见话术

  - id: guard_clarify_v1
    name: 信息不足澄清追问
    task_type: guard
    file: templates/guard_clarify_v1.yaml
    version: "1.0.0"
    status: active
    variables: [missing_items, known_items]
    scenes:
      - 需求模糊时的追问
      - 关键信息缺失时的引导
    constraints:
      - 一次最多追问 3 项
      - 按重要性排序
      - 不重复追问已提供的信息

# ========== 统计 ==========
summary:
  total: 11
  active: 11
  deprecated: 0
  by_task_type:
    generate: 4
    summarize: 2
    rewrite: 2
    extract: 1
    guard: 2
  by_stage:
    synopsis: 1
    script: 1
    storyboard: 0
    shot_prompt: 0
    revise: 0
  business_chain_note: "AI 漫剧业务链路 5 个模板建设中（与 SCHEMA.md 的 stage 枚举 5 值一一对应）：已建 2（synopsis_v1 / script_v1），待建 3（storyboard / shot_prompt / revise）"
