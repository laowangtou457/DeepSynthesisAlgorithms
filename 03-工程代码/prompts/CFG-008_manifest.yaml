# 提示词资产库 · 主清单
#
# 本文件是提示词资产的登记索引，是备案材料「二次开发说明」的直接佐证。
# 每个模板独立存放于 templates/ 目录，本清单记录其元信息与版本。
#
# 修改规范：
#   1. 新增模板 → 在 templates/ 建文件，然后在本清单登记
#   2. 修改模板 → 必须提升 version，禁止原地覆盖历史版本
#   3. 下线模板 → status 改为 deprecated，不删除（保证历史可追溯）

meta:
  project: 生成合成类（文本合成）算法
  asset_type: 提示词模板资产
  schema_version: "1.0.0"
  updated_at: "2026-10-14"

# 版本规范：主版本.次版本.修订号
#   主版本：模板结构变更（变量增删、职责调整）
#   次版本：约束/示例调整（影响输出风格）
#   修订号：文案微调（不影响语义）

templates:

  # ========== 内容生成类 ==========
  - id: synopsis_v1
    name: 故事梗概生成
    task_type: generate
    stage: synopsis
    file: templates/TPL-013_synopsis_v1.yaml
    version: "2.0.0"
    status: active
    variables: [source_input, genre, target_duration, audience, must_include, must_avoid]
    scenes:
      - AI 漫剧链路第 1 段：一句话创意 → 结构化梗概
      - 短剧项目立项前的故事结构梳理
    constraints:
      - 只依据给定要点扩写；人名／地名／机构名／年代不得自行编造，缺失一律写「未指定」
      - 覆盖全部输入要点，覆盖情况写入 covered_points 字段供机器核查
      - 不得改变客户已给定的角色关系、事件因果与结局走向
      - 每个角色必须带 character_id（CHR-01 起顺序编号），跨阶段不得改号、不得为「未指定」——这是 SW-002「零漂移」校验的唯一锚点
      - 角色外观与全片风格串的首次定义责任在剧本阶段（SW-005）；本层只做占位与缺口登记，不得越权定义、不得编造
      - 缺口交接：凡字段值为「未指定」，必须在 unspecified 中存在对应条目（含 field／reason／fill_stage／fill_fallback／blocking），二者互为校验
      - 禁止项承接：must_avoid 须逐条原样写入 forbidden_items，供下游各阶段累计传递
    notes: 链路源头模板（v2.0.0 依导演视角两轮评审修订），输出 JSON 供 SW-005 剧本生成消费；用例见 examples/CASE-004_synopsis-case01.md

  - id: script_v1
    name: 剧本生成
    task_type: generate
    stage: script
    file: templates/TPL-008_script_v1.yaml
    version: "2.0.0"
    status: active
    variables: [synopsis_json, gap_answers, client_visual_input]
    scenes:
      - AI 漫剧链路第 2 段：已确认梗概 → 三幕剧本（场次／对白／旁白／角色表／道具表）
      - 短剧项目的剧本化编排
    constraints:
      - 事实类信息（人名／地名／机构名／年代／数值）不得编造；梗概标「未指定」且客户未答复者继续保持「未指定」（**此限定只管事实类**，设计类按下条处理）
      - 设计类的判定是**规则式**（不用枚举清单）：凡 output 中带 design_source 的值即为设计类（角色外观／全片风格／配色／道具外观／声线）——不得留「未指定」；客户未提供者由本层提出具体候选，design_source 标「系统提议待确认」并登记进 unspecified
      - 来源标注**分两层、不得合并**：source 记承继类（name／role／identity，客户提供｜承继上游）；design_source 记本层首定义的设计类（客户提供｜系统提议待确认）
      - 外观锁定串与风格锚的取值**必须与场景／时相／天气无关**：只写固有特征，不得混入瞬时状态（湿发／雨渍／泥点／汗）、情绪与神情、随剧情可变的状态、时相依存元素；分时相光照差异归 lighting_default 与下游逐镜 lighting
      - props[] 承载道具／关键物件外观（prop_id 自 PRP-01 起、本层分配、全链路不得改号）；无道具时为空数组；scenes[].props_present 只能引用已定义的 prop_id
      - 角色 character_id 必须与梗概一一对应，不得改号、增删（SW-002 零漂移校验的锚点）；time_of_day 属事实类，不得更改时相
      - 场号 no 沿用梗概 scenes_outline 的 no，不得重新编号、合并或拆分场次
      - 三幕齐备（建置／对抗／结局），每个场景必须归属其中一幕；purpose 仅限「建立／升级／转折／反转／收束」且与梗概对应场一致
      - 每场 action 至少含 3 个「状态／空间／主体发生变化」的节点——下游切镜的依据是新信息，不是字数
      - 场时长两个方向：纵向 total_est_seconds = Σ各场值且与梗概偏差 ≤10%；横向**每场 est_seconds ≥ 8 秒**（＝下游单镜下限 4s × 单元最少 2 镜，场时长即该场的镜数预算）
      - scenes[].sfx_hint 承载本场环境音／音效线索（可为空数组），供下游分镜层 sfx 与单元 soundscape 取材；本层不承担最终音效设计
      - 对白用 speaker_id 指向 characters 中的 character_id（旁白记空串）；dialogue.type 仅限「对白／旁白／画外音」
      - 语速口径与规范 §4.5 统一：设计口径按 4–6 字/秒保守估算（**非硬阈值**），交付门禁判据为「字数 ÷ 秒数 ≤ 9」
      - 缺口台账七项（field／upstream_field／reason／owner／fill_stage／fill_fallback／blocking）；**owner=客户 者 fill_stage 必须为 script（本层）**——不得把「待客户确认」推给下游阶段；upstream_field 记梗概原始路径，使跨层路径映射可机器比对
      - 叙事事实类缺口必须二选一：blocking=true 强制停线追问，或 blocking=false 且 fill_fallback 写明「不闭合亦可交付」的判定依据——不得既标 false 又指望它被补上
      - 禁止项承接：梗概 forbidden_items 须逐条原样写入本层 forbidden_items
      - 本层只做剧本化编排，**不做镜头切分**（切镜属 SW-006 分镜脚本职责）
    notes: 链路第 2 段模板（**v2.0.0** 依导演视角独立评审 `SR-01`~`SR-11` 修订，逐条处置见 `10-评审记录/script_v1-…-复查记录.md`），输入 synopsis_v1（SW-004）的已确认梗概 JSON，输出 JSON 供 SW-006 分镜脚本消费；用例见 examples/CASE-001_script-case01.md

  - id: storyboard_v1
    name: 分镜脚本生成
    task_type: generate
    stage: storyboard
    file: templates/TPL-010_storyboard_v1.yaml
    version: "2.1.0"
    status: active
    variables: [script_json, duration_bounds, gap_answers, shot_density]
    scenes:
      - AI 漫剧链路第 3 段：已确认剧本 → 分镜脚本（逐场切镜 + 逐镜镜头语言标注）
      - 短剧项目的镜头切分与镜头语言设计
    constraints:
      - 双守恒（v2.1.0 新增动作守恒）：剧本每一句台词必须分配到某一镜的 dialogue；且每一场 action 的每个节点都要落到某一镜的 action.change／shot_language.result 上——只保住台词而丢了动作，是本层最隐蔽的失败；节点拍不到时必须在 unspecified 写明理由
      - 切镜依据（v2.1.0 依 BR-01 新增，规范 §4.1「必须」）：每个切点必须踩在一个新信息节点（新主体／空间／状态／视角／时间）上；相邻两镜只差距离或轻微角度时应合并为一次运镜而不是切镜；同步 §4.6 跨单元重复动作排查
      - character_id 沿用剧本、不得改号；scene_no 沿用剧本 scenes 的 no、切镜只在场内部进行；style_ref 引用剧本 style_bible.style_id
      - props 承接（**v2.0.0 随上游 props[] 新增**；**v2.1.0 依 BR-03 补覆盖要求**）：shots[].prop_refs 只能引用剧本 props[].prop_id；不得新增道具；剧本 props 为空时全片 prop_refs 均为空数组；**某场 props_present 非空时该场至少有一镜须标进 prop_refs**（整场漏标即漏拍）
      - 本层**不定义外观与风格、不重述外观（角色与道具均含）**（首定义责任在剧本层 SW-005）；**不写 prompt_zh／prompt_en 正文、不做模型适配、不写 AIGC 元数据块**（属 SW-007）
      - 外观重述的边界（v2.1.0 依 BR-02 写明）：承接 action 里的**动作对象**可以；把外观**特征词**（颜色／材质／饰件／磨损／款式）写进 action.*／shot_language.*／camera.from|to／notes 不可以；逐镜语义字段只写瞬时状态
      - 八维镜头语言（规范 §4.1）两层口径：景别／运镜**每镜必有**（覆盖 100%）；角度／光学／构图／轴线／光线／画面结果六维按 §4.2 覆盖率阈值在单元与整片层面达标（≥40%／≥30%／≥50%／≥30%／≥40%／≥60%），**不要求每镜全开**；「画面结果」最易漏，防「空气挥拳」
      - 运镜三要素（v2.1.0 依 BR-08 补省略规则）：camera.amplitude 只填 small／large、camera.speed 只填 slow／fast——medium／normal 是默认值、通常省略，不需要强调时留空串，不得当必填值填满；static 与 pov 一律不得携带幅度速度
      - 生成单元含 2–3 镜（禁 1 镜与 ≥4 镜），同一单元内运镜类型不得重复；一个镜头只属于一个单元；单元不得跨场，shot_ids 须按镜序连续递增（v2.1.0 依 BR-11 补）
      - 质量门 11 项（规范 §4.2）**二分处理**（v2.1.0 依 BR-12）：结构性约束（单元镜数 ∈[2,3]、单元内运镜不重复、static/pov 不带幅度速度、景别／运镜每镜必有、单场镜数 ≤⌊场秒数÷4s⌋）写进生成约束、必须满足；统计性阈值（覆盖率／占比／类型数）标注为「交付前脚本复算」，不由模型承诺
      - 单镜 duration_ms 必须整秒且落在 duration_bounds 秒区间内（默认 4-15＝MiniMax H3 口径）；台词语速 ≤9 字/秒，超出只延长时长、不改画面
      - 转场单侧表达：单元内部相邻衔接由后一镜 transition_in，transition_out 仅单元末镜；**单元边界＝前单元末镜出点 + 后单元首镜入点，两个半段，不算「两头都写」**（v2.1.0 依 BR-07 明确口径）；music 无则填 N/A 且禁抽象情绪词
      - 单人镜必须遵守单人替身法则（具名锚点、禁省略主语）；**§4.4 两条禁律（禁「无光的镜头」、禁「无结果的静止」）对「所有静止／无人戏镜头」均适用，不限单人戏**（v2.1.0 依 BR-13 与规范原文对齐）
      - 禁止项承接：剧本 forbidden_items 须逐条原样转入本层 forbidden_items
      - 缺口续接：剧本 unspecified 中 fill_stage=storyboard 且已答复者视为闭合、不再输出；本层新产生缺口须登记为七项（field／upstream_field／reason／owner／fill_stage／fill_fallback／blocking），**owner=客户 者 fill_stage 必须回退为 script**（本层与下游均无权补），不得把客户侧缺口继续前移至 shot_prompt；**本层新产生的客户侧缺口须由 client_confirm 兜底发出追问**（v2.1.0 依 BR-05 补齐出口），不得静默停在本层
      - 本层产出不属 CFG-007_SCHEMA.md 意义上的「设计类内容」（属导演技艺表达）——SCHEMA 的设计类指角色外观／风格串／道具外观等**内容性设计**，其首定义在剧本层；本层唯一例外是自主提议的 music 织体，按既有 unspecified 机制登记来源（v2.1.0 依 BR-04 写明口径）
      - quality_gate 的数值字段（shot_count／static_shot_count／move_types／move_type_min_required）为**可选参考**；填写即须等于由 shots 复算的真值（v2.1.0 依 BR-10）
    notes: 链路第 3 段模板（**导演决策层**）；**v2.1.0** 依导演视角独立评审 `BR-01`~`BR-13` 修订（补切镜依据、动作守恒、外观边界、幅度速度省略规则、追问出口、质量门二分，措辞改正为「规范字段集的真子集」并列 SW-007 需补字段清单；output 字段未增删故属次版本）；v2.0.0 系依 SW-005 `script_v1` v2.0.0 的输出契约变更机械承接（新增 shots[].prop_refs 与 unspecified 的 owner／upstream_field）；字段名与《分镜提示词交付规范 **v2.0**》§3.5／§3.6 逐字对齐（§3.6 自 V2.0 起含 `prop_refs`；V2.0 未重编号，故 §3.5／§3.6 编号继续有效），使下游 SW-007 的适配从「重新设计」降级为「格式投影」（**但本层产出是该字段集的真子集，镜头级 style_ref／prompt_zh／prompt_en／aspect_ratio 须由 SW-007 补齐**）；输入 script_v1（SW-005）的剧本 JSON，输出 JSON 供 SW-007 消费；用例见 examples/CASE-003_storyboard-case01.md

  - id: shot_prompt_v1
    name: 分镜提示词生成
    task_type: generate
    stage: shot_prompt
    file: templates/TPL-009_shot_prompt_v1.yaml
    version: "2.1.0"
    status: active
    variables: [storyboard_json, script_json, pack_meta, segment, gap_answers]
    scenes:
      - AI 漫剧链路第 4 段：已确认分镜脚本 → 分镜提示词交付包（逐镜 prompt_zh／prompt_en + 八维落地）
      - 短剧分镜的分镜提示词编译与交付包装配
    constraints:
      - 编译表达层定位：SW-006 决定「切几刀、切在哪、每镜怎么拍」，本层决定「怎么把这些决策写成目标模型读得懂的话」——本层**不改变任何导演决策**，只把决策翻译成表达并补全结构
      - 承继守恒**（本层的第一条纪律）**：shot_id／unit_id／scene_no／shot_no／units[].shot_ids／duration_ms／shot_size／camera.*／action.*／shot_language.*／dialogue／sfx／transition_in／transition_out／character_refs／**prop_refs**／soundscape／music／notes 一律原样承继，一字不得改；尤其**不得改 duration_ms**（它是导演决策，也是与 total_duration_ms 一致性的凭据）。⚠️ **v2.0.0 起上游 shots[].prop_refs 回到承继列**——v1.1 把它移出的两条理由（「交付规范 §3.6 无该字段」「交付 schema `shot.properties` 无该键且 `additionalProperties:false`」）**随 V2.0 契约补齐而全部消失**（§3.6 已增 `prop_refs`、顶层已增 `props[]`）；v1.1 的「不输出该结构键」处置**已撤销**，判据 **R35** 由「禁入」**反转为正向「道具锚一致性」**（`ISSUE-011` 闭环）
      - 双上游，缺一不可**（本层是链路里唯一需要两份上游的一段）**：锚的内容取自剧本层 script_v1（style_bible／characters／props／forbidden_items），镜头决策取自分镜层 storyboard_v1（units／shots／total_duration_ms）。只喂一份必然缺字段——这是「分镜层产出是规范字段集真子集」的必然结果
      - 补出必填字段**（本层存在的理由）**：每镜 style_ref／prompt_zh／prompt_en／aspect_ratio，以及顶层 schema_version／meta／style_bible／characters／**props**／**forbidden_items**／aigc_meta
      - 八维双落地（规范 §4.1）：每个维度须同时 ① 有字段承载 ② 写进 prompt_zh 与 prompt_en 正文——只填字段不写正文等于该维不存在
      - 外观只定义一次（规范 §3.4）：prompt_zh／prompt_en 内不得复述角色的发型／发色／瞳色／服装／体态与道具的材质／饰件／磨损；正文只写瞬时状态与稳定指称
      - 单人替身法则的可执行形式（规范 §4.4）：单角色镜不得用「他／她」或省略主语；若 name 为「未指定」**不得自拟姓名**，改用剧本层已定义的 identity 作**稳定指称**且全片一致——锚点的本质是「唯一且不变」，不是「必须是人名」
      - 运镜写法（规范 §3.7.2）：类型 + 幅度 + 速度；英文侧必须独立成句、以 `The camera` 起句；static／pov 不得携带幅度速度
      - 要素顺序（规范 §3.7.6）：主体 → 动作 → 环境 → 光线 → 镜头语言 → 风格；起句用「景别 + 主体／环境」名词短语；长度中文 **90–280 字**／英文 **450–1200 字符**（**v2.0.0 上修**；原「40–120 字／30–90 词」与 §4.1 八维双落地在长镜冲突，实测长镜 150–260 字，属规范自身的缺陷）
      - 风格锚点封闭（规范 §3.3）：prompt_* 中不得出现 style_anchors 清单之外的风格词
      - 负向词不进正文（规范 §6.4）：negative_global／negative_prompt 是负向意图容器，正文中不得出现「（负向：…）」类残留；须转写为正向约束句
      - 元数据不得编造**（备案举证的最后一道口）**：pack_id／created_at／session_id／task_id／statement_id／provider_code／compliance.* 一律取自服务层注入的 pack_meta；缺失时写占位符并登记，不得自拟——自拟编号会使「编号 → 生成记录」反查断链（§5.2）
      - aigc_meta 是规则区不是生成区：字段由 pack_meta 拼接，ProduceID 必须等于 meta.pack_id，ContentPropagator 首次写入与 ContentProducer 同值，文件中仅一份
      - 字段投影「**三类必改 + 一类条件改写**」（全链路唯一允许「不逐字承继」处）：① 上游 lighting／lighting_default 的「词表值 + 中文光位说明」须拆分——字段取纯词表 code、说明移入 prompt 正文（上游取值为词表外描述性说法时按语义映射并在 meta.notes 写明，不得自造 code）；② notes 须删除内部标注（如「本节点①」）；③ camera.amplitude／speed 若为 medium／normal 则**省略该键**（**v1.1 更正**：原为「规范化为空串」，但交付 schema 的枚举不含空串、写空串会被门禁阻断——**全包留空一律「省略键」**，见判据 R33）；④ **条件改写**：上游因分镜层留空而交付 schema 要求非空的字段（如 shot_language.*），**仅可从未改动的本镜已有字段派生**、不得引入本镜之外内容，并须在 meta.notes 逐处留痕。四类均由 validate_output.py 判据兜底（R26／R33／R34）
      - 缺口台账不在本层输出：交付包无 unspecified 字段（§3.1 顶层**八段**中无此项）；本层不产生新的叙事事实类缺口，上游未闭合条目保持原状留在上游产物中，不改写、不搬运、不重编号；映射与回退说明一律写进 meta.notes
      - 不改时长：语速（§4.5）复核发现超标属上游缺陷，须回退上游重出，不得在本层悄悄改秒数
      - 本层只产出**通用规范包（基准）**，不做模型适配：适配是第 2 层的「单向投影」，由 delivery/config/CFG-001_model_adapters.yaml 配置驱动（规范 §6.1「基准唯一 + 配置化」）——把适配写进模板等于每接一个模型就要改一次提示词
      - 分段策略：segment 默认 **auto**（按上游镜数自动决定：≤6 镜 all、>6 镜 package_head + 逐单元），因为规范 §3.5 明写「生成单元 = 一次生成调用所提交的完整分镜块」，分段粒度与业务语义粒度一致；输出超单次窗口时进入 fallback.output_too_long；拼装后须能过 validate_pack.py（⚠️ **分段产物本身不可能单独过交付包 schema**——required 六项不齐，只做段级结构自检）
      - 禁止项承接（**v2.0.0 起改为「原样承继」**）：剧本层与分镜层的**顶层** `forbidden_items`（客户侧「禁止出现的元素」，上游输入变量名 `must_avoid`）**须逐条原样写入交付包顶层 `forbidden_items`**——规范 §3.1 自 V2.0 起已增设该独立容器，v1.1 的「不搬运」处置**已撤销**（`ISSUE-012` 闭环）。⚠️ **边界写死**（规范 §3.1.1 三层）：本容器**只承接客户业务层禁忌**，**不得**写入 `A1-0x` 受控词库的分类码或词条（后者属**法定合规层**，由 SW-009/010 双闸承载、结果落 `meta.compliance`，**绝不进包**）。⚠️ 与之区分：`characters[].forbidden`（规范 §3.4）是**角色级**禁忌（本层从 `appearance_lock_zh` 提炼），属交付包字段集的**内建**字段，须照常产出——两者**语义不同、不得合并**。判据 **R36** 从交付 schema 读字段集，机器化「契约外字段禁入」（v2.0 起检查**九处**）
    notes: 链路第 4 段模板（**编译表达层**，SW-007）。输入**双上游** script_v1（SW-005，出锚）＋ storyboard_v1（SW-006，出决策）；输出**交付包 JSON**（`schema_version` **2.1.0**，对齐 `03-工程代码/delivery/schemas/CFG-006_shot_prompt_pack.v1.schema.json`）。契约来源《分镜提示词交付规范 **v2.1**》§3（含 §3.1.1 三层禁忌边界／§3.4.1 道具锚点）／§4／§5／§6.1；用例见 examples/CASE-002_shot-prompt-case01.md。**v1.1.0** 依导演视角独立评审 `PR-01`~`PR-15` 修订（该评审因**会话隔离未满足**而**降级使用**，只作设计期参考）：留空口径改「省略键」（PR-02）、承继清单去 prop_refs（PR-01）、白名单扩为「三类必改 + 一类条件改写」（PR-03）、segment 默认 auto + 超长 fallback（PR-08）、新增判据 R33~R36（其中 R36 系依 PR-14「清单外字段无人管」自查发现后补，字段集直接读交付 schema）。**v2.0.0 依契约升版批次（`T-054`＋`T-055`＋`T-056` 合并为同一次动作，依 `ISSUE-011`／`ISSUE-012`／`ISSUE-015` 定案 (a)）**：① `output` 顶层新增 `props`／`forbidden_items`、逐镜新增 `prop_refs` → **属 output 字段增删，故为主版本升版**；② 承继列**恢复 `prop_refs`**、`forbidden_items` **进出承继列**（v1.1 的处置随契约补齐**已撤销**）；③ `prompt_en` 上限由 schema 侧 900 → **1200** 字符、§3.7.6 长度建议上修。**`ISSUE-011`／`ISSUE-012` 均已闭环**（契约侧已补齐，非「只登记」）。⚠️ **门禁现状**：产物侧 `validate_output.py` **53/0/0** 全通过；交付门禁 `validate_pack.py` 对 `CASE-002` **BLOCK 1 → 0**（原唯一 BLOCK 系 `prompt_en` 上限，已随契约上修归零）

  - id: revise_v1
    name: 提示词解析重构
    task_type: generate
    stage: revise
    file: templates/TPL-014_revise_v1.yaml
    version: "1.2.0"
    status: active
    variables: [source_material, source_kind, pack_meta, client_visual_input, segment, gap_answers]
    scenes:
      - AI 漫剧链路第 5 段（链尾，**并行入口**）：客户已有素材（提示词清单／剧本／旧交付包／混合）→ 标准分镜提示词交付包
      - 存量内容的规范化改造：把别家格式或自由文本重构为本系统交付契约
    constraints:
      - 定位是**重构入口层**：客户带着素材来时，链路前四段（synopsis→script→storyboard→shot_prompt）**全部不跑**——本层在一次调用内承担了它们的全部职责（解析→锚定→决策→编译→组装），故其硬性约束是**前四段纪律的并集**，任何一段失守都会在交付门禁上暴露
      - 上游为空：本层是全链路唯一**没有模板上游**的一段（另一个起点是 synopsis_v1）；输入只有客户素材与 pack_meta。⚠️ 由此产生一条**结构性后果**——缺口台账**必须由本层自己产出**（链路前段的台账留在上游产物自身，本层无上游可依附），见下条
      - 素材守恒（**第一条纪律**，对应其他层的「承继守恒」）：素材中已明确者**只结构化、不改写**——事实类（人名／地名／机构名／年代／数值／**台词原文**）一字不改；镜头意图（已写的景别／运镜／时序／时长）原样承接为决策字段；风格描述原样承继为 style_bible 的锚
      - 粒度守恒（**第二条纪律**）：**不得改变素材已定的镜头数量与时序**，不得重写台词与结局；仅 `source_kind=script`（素材未切镜）时可由本层补切镜，并在 meta.notes 留痕「补切镜：素材未给镜头划分」。⚠️ 改客户的故事不是「重构」而是「另做」，属新需求、须走前四段
      - 来源三分（**v1.2.0 起取代原「锚的二分」**）：判据唯一——**「素材原文里有 → 客户已给；没有 → 本层新写」**；本层新写再分两类：**① 本层补出的镜头决策**（时长／`camera.height`／`roll`／`optics`／构图／轴线／画面结果——须在 `meta.notes` **声明补出范围**，属六类之⑥，**不算改写客户内容**）；**② 本层提议的设计类候选**（角色外观／全片风格／道具外观／声线——素材未写明者由本层提议并标「系统提议待确认」、不得留「未指定」）；事实类素材未给者**不得编造**，标「未指定」并登记台账。⚠️ **二分不落在交付包字段上**——交付包契约**无 design_source 键**（characters[]／props[] 均 additionalProperties=false，写入即被 R36 拒收），故落点为**缺口台账 + meta.notes**（系统提议者逐条入台账，客户提供者不入）。⚠️ **原「二分」的规则式已删除**——v1.1.0 写「凡 output 中带 `design_source` 字段的值即为设计类」，而该字段在本层 output 里**根本不存在**（系自剧本层口径**照搬未改造**），规则**没有执行对象**；且「二分」也**不覆盖**本层新写的非设计类内容（评审 `RR-04`）
      - 六类必改（**v1.2.0 起由「五类」扩为六类**）：**本层允许「不照抄素材」的全部情形**（比 SW-007 多一类，因输入是自由文本而非结构化 JSON）：① 形态改写（文本→字段，本层存在的理由）② 规范化（取值归一词表，如「推镜头」→`push_in`；词表外说法按语义映射最近值并在 meta.notes 写明依据，**禁自造 code**）③ 拆分（「决策+说明」同句 → 字段取 code、说明移入正文）④ 删冗余（制作备注／内部批注／平台参数指令如 `--ar 16:9` **不得进正文**）⑤ 补缺口（素材未给的单元级内容与设计类候选）⑥ **补镜头决策**（时长／`camera.height`／`roll`／`optics`／构图／轴线／画面结果——素材未给、**必须补出**；**不算改写客户内容**，但**须在 `meta.notes` 声明补出范围**）。⚠️ **第 ⑥ 类系本轮评审（`RR-02`）补入的关键一类**：原「五类」**接不住「本层补出的镜头决策」**，而 `guards` 又规定「标不出类别一律回退素材原文」——**素材原文里根本没有这些决策可回退**，只剩**伪造自检结论**一条路。**不属这六类的改写一律禁止**
      - 台账另行产出、绝不进包：交付包无 `unspecified` 段（规范 §3.1 顶层八段），而本层无上游可承载台账 → 必须**另行产出**独立产物 `<pack_id>.unspecified.json`（七项字段，`fill_stage` 一律 `revise`）；`segment` 为此**独有一个粒度 `gap_ledger`**。⚠️ 塞进交付包会被判据 **R36** 与 schema 的 `additionalProperties:false` 拒收。⚠️ **归档落点（v1.2.0 新增，依评审 `RR-07`）**：该文件**随交付目录落盘**、文件名 `<pack_id>.unspecified.json`，并**在 `manifest.json` 中登记**——规范 **V2.2** §1.4 已把该文件纳入交付目录树并增「**条件必须**」（`stage_chain` 含 `revise` 时**不可缺失**），§1.1 附注将其定位为与 `qa/audit_report.txt` **同构**的伴随产物（**不计入四件套定义、但缺失即阻断交付**）。**闭环口径**：客户答复后该条从台账移除、并在 `meta.notes` 记第二轮；客户答复**不得直接改写交付包**
      - stage_chain **照实填** `["revise"]`（本层一段直出完整包；`templates` 只含 `revise_v1`，其版本取**模板实际版本**、**不得硬编码**——当前 **v1.2.0**）。✅ **`ISSUE-017` 已闭环（2026-10-14 项目方裁决取 (a)）**：规范 **V2.1** 与 `CFG-006` schema 的 `stage_chain.items.enum` **同批补齐第 5 值 `revise`**（四值 → 五值）、`schema_version` 升 **2.1.0** → 本层产物**零改动**即 **BLOCK 归零**。**纪律不变**：宁可报 BLOCK 也**照实填**——**伪造溯源比报一条 BLOCK 严重得多**
      - 八维双落地（规范 §4.1）：每维须**同时** ① 有字段承载 ② 写进 prompt_zh 与 prompt_en **正文**；只填字段不写正文等于该维不存在。本层既做决策又做表达，故八维落点由其自行设计（不像 SW-007 承自上游）
      - 其余纪律与 SW-007 **同口径**：外观只定义一次（正文不得复述角色与道具外观）· 风格锚点封闭（正文不得出现 style_anchors 之外的风格词）· 负向词不进正文（须转写为正向约束句且全片同句式）· 单人替身法则（稳定指称、name 为「未指定」时不得自拟姓名、全片一致）· 英文侧运镜句须以 `The camera` **起句且独立成句** · 元数据不得编造（一律取自 pack_meta）· **不做模型适配**（规范 §6.1「基准唯一 + 单向投影」）
      - 单元划分（每单元 2–3 镜、同场、单元内运镜类型不得重复）与单镜时长（4–15s 整秒）同 SW-006/SW-007 口径；素材已定者原样承接、未定者由本层按动作量裁定
    notes: 业务链路**第 5 段（链尾）**，`revise`／SW-008 `v1.2.0`（**2026-10-14 由 v1.1.0 升次版本**：依导演视角独立评审 `REV-SW-008-02` 15 条处置，落地 `T-066`；**无 output 字段增删，故为次版本**）；**本层是链路的第二个起点**（客户自带素材的并行入口），不是下游续接——它把「客户已经有东西」这条路径也接入同一份交付契约。产物＝交付包（经 validate_pack.py 门禁）＋ **缺口台账**（独立产物，**随交付目录落盘并登记 `manifest.json`**，规范 **V2.2** §1.4／§1.1）。✅ **链路口径的两处缺口均已闭环**：① `ISSUE-017`（`stage_chain` 枚举缺 `revise`）——2026-10-14 项目方裁决取 (a)，规范 **V2.1** 与 `CFG-006` schema 同批补值，本层产物**零改动**即 **BLOCK 归零**；② 规范 §3.2 与 `CFG-007` 对「5 段链路」的读法差异（`SYS-Q11` 的 5 节点 vs 本工程 5 模板），随 `ISSUE-017` 一并裁决。⚠️ **评审遗留（已登记、非缺口）**：两条核心纪律（**素材守恒**／**粒度守恒**）**仍无脚本判据**——需与 `source_material` 原文比对（评审 `RR-01` 已实测出三处「字符串层之外」的失守），现由 `guards` **三层扫描**（事实字符串／镜头意图／物件设定）＋ 人工复核承担；评审**待议项 A** 已给出三层判据分层与「`--source` 比对脚本」候选，**待议项 B** 落为规范 **`NT-10`**（输入侧「素材来源」是否进契约）。用例见 examples/CASE-005_revise-case01.md

