# FX-P02 · Genre Profile · M1-02 寒门赘婿 · 机读轨
# 由人读轨 profiles/FX-P02_M1-02_寒门赘婿.md 派生；冲突时以 md 为准
# 字段结构 = schema/fx_framework.yaml 的 profile_template（14 顶层字段，无增删）
# 状态：draft / unverified　基准单集秒数：90（Σdur_s = 90）　骨架版本 1.1.0
# 生成日期：2026-11-26
# ============================================================

genre_id: M1-02
name: 寒门赘婿
status: draft
verification: unverified

# --- 槽位 1：beat_sheet（8 拍，Σdur_s = 90；at_s 首尾相接无空隙；9 型共用，逐值照契约 §四） ---
beat_sheet:
  - {at_s: 0, dur_s: 3, code: BEAT_OPEN_HOOK, purpose: 建立, is_payoff: false}
  - {at_s: 3, dur_s: 7, code: BEAT_CONTRAST, purpose: 铺垫, is_payoff: false}
  - {at_s: 10, dur_s: 15, code: BEAT_ESCALATE_1, purpose: 升级, is_payoff: false}
  - {at_s: 25, dur_s: 15, code: BEAT_ESCALATE_2, purpose: 升级, is_payoff: false}
  - {at_s: 40, dur_s: 15, code: BEAT_ESCALATE_3, purpose: 升级, is_payoff: false}
  - {at_s: 55, dur_s: 15, code: BEAT_PAYOFF, purpose: 兑现, is_payoff: true}
  - {at_s: 70, dur_s: 15, code: BEAT_AFTERSHOCK, purpose: 余波, is_payoff: false}
  - {at_s: 85, dur_s: 5, code: BEAT_CLOSE_HOOK, purpose: 断点, is_payoff: false}

# --- 槽位 2/3：hooks（open 4 / close 3 / extra 空列表，副类型注入位） ---
# sample_line 全部为范文长句压缩稿（标 U|，见 evidence U-05），Python len ≤15
hooks:
  open:
    - {code: OPEN_BRIDE_SHAME, name: "彩礼羞辱", formula: "岳家宴席+彩礼加码+众人围观", sample_line: "这彩礼，你也配？"}
    - {code: OPEN_DIVORCE_THROW, name: "甩离婚书", formula: "协议拍桌+净身出户+冷眼侧目", sample_line: "签了，滚出岳家。"}
    - {code: OPEN_INLAW_MOCK, name: "满堂讥讽", formula: "摆酒席+小舅子发难+特写眼神", sample_line: "倒插门的，也配上桌？"}
    - {code: OPEN_QUIET_DEED, name: "亮出旧契", formula: "旧婚书+一句短台词+定格", sample_line: "婚书在此，谁退？"}
  close:
    - {code: CLOSE_BANQUET_GUEST, name: "宴席贵客", formula: "刚压住讥讽→岳父引贵客入场", sample_line: "岳父，来的是谁？"}
    - {code: CLOSE_LEDGER_TURN, name: "账册翻转", formula: "摊牌定格+主角一句短台词", sample_line: "这账，明日再算。"}
    - {code: CLOSE_INLAW_BACKER, name: "靠山现身", formula: "对峙中→岳家更强靠山登场", sample_line: "退婚？先问他。"}
  extra: []

# --- 槽位 4：payoff ---
payoff:
  min_per_ep: 1
  escalate_every_s: 20

# --- 槽位 5：cast ---
cast:
  max_speaking: 3
  max_on_screen: 3

# --- 槽位 6：line（tone_codes 自拟大写码，标 U|；banned = R-S6 六词 + M1-02 exclude） ---
line:
  max_chars: 15
  char_per_sec: [4, 6]
  tone_codes: [ENDURE, IRONIC, FLAT, REVEAL, DISMISS]
  banned: [想, 觉得, 心里, 暗自, 不禁, 仿佛, 军令, 北境, 针灸, 灵根]

# --- 槽位 7：style_bible_ref（只写 STY-* 引用，不写提示词串） ---
style_bible_ref: STY-KR-WEBTOON

# --- 槽位 8：asset_bias（可绘制物件/场景，取自 M1-02 words 与 FX-010 §三 判别词） ---
asset_bias:
  prop_focus: [彩礼单, 离婚协议, 婚书, 聘礼箱]
  scene_pool: [岳家宴席, 堂屋, 婚宴厅, 门厅]

# --- 槽位 9：redlines（每条 code/rule/fallback 三件套；risk_flags 逐条各占 1 条） ---
redlines:
  - {code: RL_ZHUIXU_NO_MAMMON, rule: "禁止把财富数额当作正当性来源；禁止以多金为荣的台词与特写", fallback: "改用家世担当、手艺本事立身；礼金数额虚化为「未指定」"}
  - {code: RL_ZHUIXU_SNOB_TARGET, rule: "打脸只针对嫌贫爱富、逼签离婚协议等势利行为，不针对财产多寡", fallback: "反派恶行台词改为讥讽出身/逐客；删去比价与炫产镜头"}
  - {code: RL_ZHUIXU_NO_VIOLENCE, rule: "禁止见血/伤口/肢体断损特写；禁止拳脚命中身体的打脸动作", fallback: "改用推桌/拂袖+身份台词+反派后退半步+瞳孔特写轮切"}
  - {code: RL_ZHUIXU_NO_MENTAL, rule: "台词与 action 禁止出现：想/觉得/心里/暗自/不禁/仿佛", fallback: "改写为外部动作：把协议推回桌面、转身、指节叩桌、眼神特写"}
  - {code: RL_ZHUIXU_NO_CROSSWORD, rule: "禁止出现：军令/北境/针灸/灵根（M1-01 与玄幻判别词）", fallback: "改用 M1-02 判别词：彩礼/婚书/岳父/上门女婿/摆酒"}

# --- 槽位 10：adapt（keep 末 2 项 = M1-02 核心爽点，不复制 M1-01） ---
adapt:
  chars_per_ep: [2000, 3000]
  keep: [主线冲突, 关键转折, 名场面, 金手指觉醒, 寒门立业, 当众打脸势利亲戚]
  merge: [连续多次打脸, 多段日常, 次要支线, 同类重复]
  rewrite: [开场钩子, 集尾钩子, 视觉化瞬间, 心理描写转外部动作]

