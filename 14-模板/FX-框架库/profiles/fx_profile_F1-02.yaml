# ============================================================
# FX-P05 · Genre Profile · F1-02 重生复仇 · 机读轨
# 由人读轨 profiles/FX-P05_F1-02_重生复仇.md 派生；冲突时以 md 为准
# 字段结构 = schema/fx_framework.yaml 的 profile_template（14 顶层字段，无增删）
# 状态：draft / unverified　基准单集秒数：90（Σdur_s = 90）
# 骨架版本：1.1.0　生成日期：2026-11-26
# ============================================================

genre_id: F1-02
name: 重生复仇
status: draft
verification: unverified

# --- 槽位 1：beat_sheet（8 拍，Σdur_s = 90；9 型共用，逐值不改） ---
# at_s/dur_s 取自 MD-011 §二 S01~S08；末拍 code 含 CLOSE，首拍 code 含 OPEN
beat_sheet:
  - {at_s: 0, dur_s: 3, code: BEAT_OPEN_HOOK, purpose: 建立, is_payoff: false}
  - {at_s: 3, dur_s: 7, code: BEAT_CONTRAST, purpose: 铺垫, is_payoff: false}
  - {at_s: 10, dur_s: 15, code: BEAT_ESCALATE_1, purpose: 升级, is_payoff: false}
  - {at_s: 25, dur_s: 15, code: BEAT_ESCALATE_2, purpose: 升级, is_payoff: false}
  - {at_s: 40, dur_s: 15, code: BEAT_ESCALATE_3, purpose: 升级, is_payoff: false}
  - {at_s: 55, dur_s: 15, code: BEAT_PAYOFF, purpose: 兑现, is_payoff: true}
  - {at_s: 70, dur_s: 15, code: BEAT_AFTERSHOCK, purpose: 余波, is_payoff: false}
  - {at_s: 85, dur_s: 5, code: BEAT_CLOSE_HOOK, purpose: 断点, is_payoff: false}

# --- 槽位 2/3：hooks（open 3 / close 3 / extra 空列表，副类型注入位） ---
# sample_line 逐字原文 1 条（E|）、新写 5 条（U|）；全部 len<=15
hooks:
  open:
    - {code: OPEN_CHONGSHENG_AWAKE, name: 睁眼重生, formula: "濒死画面+弹坐惊醒+年轻双手特写", sample_line: "一睁眼，我重生了！"}
    - {code: OPEN_CHONGSHENG_LEDGER, name: 旧账亮牌, formula: "账本推到桌心+指尖点住某行", sample_line: "这笔账，我留着。"}
    - {code: OPEN_CHONGSHENG_VOW, name: 冷静立誓, formula: "旧照片扣在桌上+一句低声台词", sample_line: "这一世，换我开局。"}
  close:
    - {code: CLOSE_CHONGSHENG_TRAP, name: 设局收网, formula: "反派签字落笔+女主合上账本定格", sample_line: "签了，就别怪我。"}
    - {code: CLOSE_CHONGSHENG_BACKER, name: 新靠山登场, formula: "刚扳倒一人+更强人物推门", sample_line: "他背后，还有人。"}
    - {code: CLOSE_CHONGSHENG_RECKON, name: 清算回环, formula: "女主定格+下阶段目标亮出", sample_line: "名单，才翻到一半。"}
  extra: []

# --- 槽位 4：payoff（min_per_ep 与 beat_sheet 的 is_payoff 标记数 1 处对应） ---
payoff:
  min_per_ep: 1
  escalate_every_s: 20

# --- 槽位 5：cast ---
cast:
  max_speaking: 3
  max_on_screen: 3

# --- 槽位 6：line ---
line:
  max_chars: 15
  char_per_sec: [4, 6]
  tone_codes: [FOREKNOW, CALCULATING, RESOLVE, ICY, RETORT]
  banned: [想, 觉得, 心里, 暗自, 不禁, 仿佛, 抱错, 亲子鉴定, 灵根, 规则]

# --- 槽位 7：style_bible_ref（只写 STY-* 引用，不写提示词串） ---
style_bible_ref: STY-FINE-FEMALE

# --- 槽位 8：asset_bias（本型判别词内的可绘制物件与出图稳定场景） ---
asset_bias:
  prop_focus: [账本, 旧信, 前世遗物, 旧照片]
  scene_pool: [老式大院, 土炕灶台, 婚房, 当铺柜台]

# --- 槽位 9：redlines（4 条，risk_flags 逐条各占 1 条 + 通用红线） ---
redlines:
  - {code: RL_CHONGSHENG_NOGORE, rule: "禁止复仇过程的见血/伤口/施暴特写", fallback: "改用账本摊开+反派签字+字幕清算带过"}
  - {code: RL_CHONGSHENG_LAWFUL, rule: "报复须走举证、诉讼、报警等合法路径，禁止私刑与私下加害", fallback: "改用证据移交+立案回执+庭审宣判镜头"}
  - {code: RL_CHONGSHENG_MENTAL, rule: "台词与 action 禁用：想/觉得/心里/暗自/不禁/仿佛", fallback: "改用外部动作：合上账本、把旧信压在镇纸下、抬眼"}
  - {code: RL_CHONGSHENG_CAST, rule: "单集有台词角色 ≤3，同框含群演 ≤3", fallback: "群像拆为近景轮切+背影虚化+画外音"}

# --- 槽位 10：adapt ---
adapt:
  chars_per_ep: [2000, 3000]
  keep: [主线冲突, 关键转折, 名场面, 金手指觉醒, 先知碾压, 步步设局]
  merge: [连续多次打脸, 多段日常, 次要支线, 同类重复]
  rewrite: [开场钩子, 集尾钩子, 视觉化瞬间, 心理描写转外部动作]

