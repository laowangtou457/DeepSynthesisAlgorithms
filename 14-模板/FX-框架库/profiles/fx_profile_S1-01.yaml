# ============================================================
# FX-P09 · Genre Profile · S1-01 神探断案 · 机读轨
# 由人读轨 profiles/FX-P09_S1-01_神探断案.md 派生；冲突时以 md 为准
# 字段结构 = schema/fx_framework.yaml 的 profile_template（14 顶层字段，无增删）
# 状态：draft / unverified　基准单集秒数：90（Σdur_s = 90）　骨架版本：1.1.0
# 生成日期：2026-11-26
# ============================================================

genre_id: S1-01
name: 神探断案
status: draft
verification: unverified

# --- 槽位 1：beat_sheet（8 拍，Σdur_s = 90；9 型共用 MD-011 §二 S01~S08 基准表） ---
beat_sheet:
  - {at_s: 0, dur_s: 3, code: BEAT_OPEN_HOOK, purpose: 建立, is_payoff: false}
  - {at_s: 3, dur_s: 7, code: BEAT_CONTRAST, purpose: 铺垫, is_payoff: false}
  - {at_s: 10, dur_s: 15, code: BEAT_ESCALATE_1, purpose: 升级, is_payoff: false}
  - {at_s: 25, dur_s: 15, code: BEAT_ESCALATE_2, purpose: 升级, is_payoff: false}
  - {at_s: 40, dur_s: 15, code: BEAT_ESCALATE_3, purpose: 升级, is_payoff: false}
  - {at_s: 55, dur_s: 15, code: BEAT_PAYOFF, purpose: 兑现, is_payoff: true}
  - {at_s: 70, dur_s: 15, code: BEAT_AFTERSHOCK, purpose: 余波, is_payoff: false}
  - {at_s: 85, dur_s: 5, code: BEAT_CLOSE_HOOK, purpose: 断点, is_payoff: false}

# --- 槽位 2/3：hooks（open 4 / close 3 / extra 空列表，副类型注入位） ---
hooks:
  open:
    - {code: OPEN_CASE_REPORT, name: 报案开场, formula: "现场+报案人一句陈述", sample_line: "报案人说，门锁没坏。"}
    - {code: OPEN_DOSSIER_GAP, name: 缺页卷宗, formula: "卷宗+缺页特写", sample_line: "卷宗少了第三页。"}
    - {code: OPEN_INQUEST_CLUE, name: 验状反常, formula: "勘验+身份存疑陈述", sample_line: "仵作验过，死者不是本地人。"}
    - {code: OPEN_TESTIMONY_CLASH, name: 口供对撞, formula: "公堂+两份口供并列", sample_line: "两份口供，一字不差。"}
  close:
    - {code: CLOSE_VERDICT_FLIP, name: 反转推翻, formula: "结案一句+推翻定格", sample_line: "最信任的人，才是凶手。"}
    - {code: CLOSE_ALIBI_BREAK, name: 伪证戳破, formula: "不在场证明+一处破绽", sample_line: "不在场证明，是伪造的。"}
    - {code: CLOSE_DOSSIER_SELF, name: 卷宗自指, formula: "末页特写+姓名落定", sample_line: "末页写着我的名字。"}
  extra: []

# --- 槽位 4：payoff（min_per_ep 与 beat_sheet 的 is_payoff 标记数 1 处严格相等） ---
payoff:
  min_per_ep: 1
  escalate_every_s: 20

# --- 槽位 5：cast ---
cast:
  max_speaking: 3
  max_on_screen: 3

# --- 槽位 6：line（banned = R-S6 六词 + genres[S1-01].words.exclude 四词） ---
line:
  max_chars: 15
  char_per_sec: [4, 6]
  tone_codes: [PROBE, CLIPPED, DEDUCE, INTERROGATE, VERDICT]
  banned: [想, 觉得, 心里, 暗自, 不禁, 仿佛, 规则, 轮回, 重生, 赘婿]

# --- 槽位 7：style_bible_ref（只写 STY-* 引用，不写提示词串） ---
style_bible_ref: STY-DARK-REAL

# --- 槽位 8：asset_bias（可绘制物件与出图稳定场景，避开本型排除词） ---
asset_bias:
  prop_focus: [卷宗, 勘验箱, 物证袋, 口供簿, 不在场证明]
  scene_pool: [公堂, 案发旧宅, 雨夜巷口, 卷宗房]

# --- 槽位 9：redlines（RL_DUANAN_* 语义前缀，逐条覆盖 risk_flags + 通用红线） ---
redlines:
  - {code: RL_DUANAN_CORPSE, rule: "禁止尸体/伤口/血迹正面特写；禁止伤情细节画面", fallback: "改用卷宗照、白布轮廓、旁人反应特写轮切；以口供与物证推进"}
  - {code: RL_DUANAN_METHOD, rule: "禁止给出可模仿的作案步骤、工具配比、时间规避细节", fallback: "只呈现推理结论与证据链；手法以结果镜头带过，不列步骤"}
  - {code: RL_DUANAN_MENTAL, rule: "台词与 action 禁止出现：想/觉得/心里/暗自/不禁/仿佛", fallback: "改写为外部动作：把证物袋搁上桌、翻卷宗停在某行、抬眼扫过嫌疑人"}
  - {code: RL_DUANAN_PROC, rule: "禁止虚构真实办案程序细节与真实机构名称；结尾须正邪有界", fallback: "程序以架空称谓与结果镜头带过；改用 S1-01 判别词：卷宗/口供/不在场证明/勘验箱/公堂"}

# --- 槽位 10：adapt ---
adapt:
  chars_per_ep: [2000, 3000]
  keep: [主线冲突, 关键转折, 名场面, 金手指觉醒, 巧验真相, 层层反转]
  merge: [连续多次打脸, 多段日常, 次要支线, 同类重复]
  rewrite: [开场钩子, 集尾钩子, 视觉化瞬间, 心理描写转外部动作]

