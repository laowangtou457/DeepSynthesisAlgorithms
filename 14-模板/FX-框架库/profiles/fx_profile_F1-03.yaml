# ============================================================
# FX-P06 · Genre Profile · F1-03 弱女反杀 · 机读轨
# 由人读轨 profiles/FX-P06_F1-03_弱女反杀.md 派生；冲突时以 md 为准
# 字段结构 = schema/fx_framework.yaml 的 profile_template（14 顶层字段，无增删）
# 状态：draft / unverified　基准单集秒数：90（Σdur_s = 90）
# 骨架版本：1.1.0　生成日期：2026-11-26
# ============================================================

genre_id: F1-03
name: 弱女反杀
status: draft
verification: unverified

# --- 槽位 1：beat_sheet（8 拍，Σdur_s = 90；9 型共用，逐值不改） ---
# at_s/dur_s 取自 MD-011 §二 S01~S08；末拍 code 含 CLOSE，首拍 code 含 OPEN
beat_sheet:
  - {at_s: 0, dur_s: 3, code: BEAT_OPEN_HOOK, purpose: 建立, is_payoff: false}
  - {at_s: 3, dur_s: 7, code: BEAT_CONTRAST, purpose: 铺垫, is_payoff: false}
  - {at_s: 10, dur_s: 15, code: BEAT_ESCALATE_1, purpose: 升级, is_payoff: false}
  - {at_s: 25, dur_s: 15, code: BEAT_ESCALATE_2, purpose: 升级, is_payoff: false}
  - {at_s: 40, dur_s: 15, code: BEAT_ESCALATE_3, purpose: 升级, is_payoff: false}
  - {at_s: 55, dur_s: 15, code: BEAT_PAYOFF, purpose: 兑现, is_payoff: true}
  - {at_s: 70, dur_s: 15, code: BEAT_AFTERSHOCK, purpose: 余波, is_payoff: false}
  - {at_s: 85, dur_s: 5, code: BEAT_CLOSE_HOOK, purpose: 断点, is_payoff: false}

# --- 槽位 2/3：hooks（open 3 / close 3 / extra 空列表，副类型注入位） ---
# 范文 §四/§五 现成台词均带别型型属词，按禁串型强词不引用；6 条全部按 H 式节拍新写（U|）
hooks:
  open:
    - {code: OPEN_FANSHA_RECORDER, name: 录音亮牌, formula: "袖口录音笔+按下停止键", sample_line: "这段，我录下了。"}
    - {code: OPEN_FANSHA_INJURY, name: 验伤亮牌, formula: "验伤单摊开+日期特写", sample_line: "验伤单，日期在这。"}
    - {code: OPEN_FANSHA_WITNESS, name: 人证亮牌, formula: "证人推门+纸袋放上桌", sample_line: "人证在此，请讲。"}
  close:
    - {code: CLOSE_FANSHA_SUBPOENA, name: 传票登场, formula: "对峙中+法院传票递到+定格", sample_line: "法院传票，签收。"}
    - {code: CLOSE_FANSHA_TURN, name: 证人反水, formula: "反派话未落+证人起身", sample_line: "证人，换了一个。"}
    - {code: CLOSE_FANSHA_VERDICT, name: 宣判前夜, formula: "女主整衣定格+下一目标亮出", sample_line: "这一槌，明日落。"}
  extra: []

# --- 槽位 4：payoff（min_per_ep 与 beat_sheet 的 is_payoff 标记数 1 处对应） ---
payoff:
  min_per_ep: 1
  escalate_every_s: 20

# --- 槽位 5：cast ---
cast:
  max_speaking: 3
  max_on_screen: 3

# --- 槽位 6：line ---
line:
  max_chars: 15
  char_per_sec: [4, 6]
  tone_codes: [MEASURED, WITTY, PRESS, EVIDENT, STEADY]
  banned: [想, 觉得, 心里, 暗自, 不禁, 仿佛, 重生, 上一世, 军令, 灵根]

# --- 槽位 7：style_bible_ref（只写 STY-* 引用，不写提示词串） ---
style_bible_ref: STY-FINE-FEMALE

# --- 槽位 8：asset_bias（本型判别词内的可绘制物件与出图稳定场景） ---
asset_bias:
  prop_focus: [录音笔, 验伤单, 起诉书, 证据袋]
  scene_pool: [法庭, 派出所, 律所会议室, 调解室]

# --- 槽位 9：redlines（4 条，risk_flags 逐条各占 1 条 + 通用红线） ---
redlines:
  - {code: RL_FANSHA_NOVIGILANTE, rule: "禁止把私自报复/设局伤人拍成正当爽点，恶人受惩不靠私刑", fallback: "改用报警回执+笔录镜头+警车到场带过"}
  - {code: RL_FANSHA_PUBLICPATH, rule: "恶人清算须由报警、立案、庭审、判决等公权力环节收口", fallback: "改用起诉书递交+法槌落下+判决书特写"}
  - {code: RL_FANSHA_MENTAL, rule: "台词与 action 禁用：想/觉得/心里/暗自/不禁/仿佛", fallback: "改用外部动作：按下录音停止键、把验伤单折好、抬眼"}
  - {code: RL_FANSHA_EVIDENCE, rule: "陷害与出轨实锤用证据呈现，不拍侵害过程", fallback: "改用聊天记录截图+验伤单+录音回放轮切"}

# --- 槽位 10：adapt ---
adapt:
  chars_per_ep: [2000, 3000]
  keep: [主线冲突, 关键转折, 名场面, 金手指觉醒, 以智取胜, 证据反打]
  merge: [连续多次打脸, 多段日常, 次要支线, 同类重复]
  rewrite: [开场钩子, 集尾钩子, 视觉化瞬间, 心理描写转外部动作]

