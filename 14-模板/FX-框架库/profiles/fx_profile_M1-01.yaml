# ============================================================
# FX-P01 · Genre Profile · M1-01 战神归来 · 机读轨
# 由人读轨 profiles/FX-P01_M1-01_战神归来.md 派生；冲突时以 md 为准
# 字段结构 = schema/fx_framework.yaml 的 profile_template（14 顶层字段，无增删）
# 状态：draft / unverified　基准单集秒数：90（Σdur_s = 90）
# 生成日期：2026-11-25
# ============================================================

genre_id: M1-01
name: 战神归来
status: draft
verification: unverified

# --- 槽位 1：beat_sheet（8 拍，Σdur_s = 90；at_s 首尾相接无空隙） ---
# at_s/dur_s 取自 MD-011 §二 S01~S08；末拍 code 含 CLOSE，首拍 code 含 OPEN
beat_sheet:
  - {at_s: 0, dur_s: 3, code: BEAT_OPEN_HOOK, purpose: 建立, is_payoff: false}
  - {at_s: 3, dur_s: 7, code: BEAT_CONTRAST, purpose: 铺垫, is_payoff: false}
  - {at_s: 10, dur_s: 15, code: BEAT_ESCALATE_1, purpose: 升级, is_payoff: false}
  - {at_s: 25, dur_s: 15, code: BEAT_ESCALATE_2, purpose: 升级, is_payoff: false}
  - {at_s: 40, dur_s: 15, code: BEAT_ESCALATE_3, purpose: 升级, is_payoff: false}
  - {at_s: 55, dur_s: 15, code: BEAT_PAYOFF, purpose: 兑现, is_payoff: true}
  - {at_s: 70, dur_s: 15, code: BEAT_AFTERSHOCK, purpose: 余波, is_payoff: false}
  - {at_s: 85, dur_s: 5, code: BEAT_CLOSE_HOOK, purpose: 断点, is_payoff: false}

# --- 槽位 2/3：hooks（open 4 / close 3 / extra 空列表，副类型注入位） ---
hooks:
  open:
    - {code: OPEN_HUMILIATE, name: 极端羞辱, formula: "狠话+支票/耳光+围观", sample_line: "废物！拿着五十万，滚出林家！"}
    - {code: OPEN_DEATH_BETRAYAL, name: 死亡开局, formula: "背叛瞬间+坠落/濒死+恨意特写", sample_line: "我信错两人，落得身死道消！"}
    - {code: OPEN_IDENTITY_GAP, name: 身份反差, formula: "众人嘲笑+一句冷台词+特写眼神", sample_line: "肩章摘了，军令还在。"}
    - {code: OPEN_TOKEN_REVEAL, name: 宣言亮牌, formula: "证据+平静语气", sample_line: "虎符在此，请过目。"}
  close:
    - {code: CLOSE_CRISIS, name: 危机降临, formula: "刚解决小麻烦→更大麻烦电话/人物登场", sample_line: "什么?!公司资金链断裂?!"}
    - {code: CLOSE_SHOWDOWN_EVE, name: 摊牌前夜, formula: "反派扬手/扇耳光定格+主角眼神一凛", sample_line: "敢欺我者，今日，全部清算！"}
    - {code: CLOSE_NEW_ARRIVAL, name: 新人物出场, formula: "对峙中→更强人物推门而入", sample_line: "我看谁敢动我的人。"}
  extra: []

# --- 槽位 4：payoff（min_per_ep 与 beat_sheet 的 is_payoff 标记数 1 处严格相等） ---
payoff:
  min_per_ep: 1
  escalate_every_s: 20

# --- 槽位 5：cast ---
cast:
  max_speaking: 3
  max_on_screen: 3

# --- 槽位 6：line ---
line:
  max_chars: 15
  char_per_sec: [4, 6]
  tone_codes: [COLD, RESTRAINED, PROVOKE, DECLARE, COMMAND]
  banned: [想, 觉得, 心里, 暗自, 不禁, 仿佛, 灵根, 宗门, 修为, 入赘, 赘婿]

# --- 槽位 7：style_bible_ref（只写 STY-* 引用，不写提示词串） ---
style_bible_ref: STY-KR-WEBTOON

# --- 槽位 8：asset_bias ---
asset_bias:
  prop_focus: [虎符, 军牌, 军令, 肩章]
  scene_pool: [酒会, 写字楼, 豪车, 雨夜街头]

# --- 槽位 9：redlines（每条 code/rule/fallback 三件套，覆盖两条题材风险） ---
redlines:
  - {code: RL_01, rule: "禁止见血/伤口/肢体断损特写；禁止拳脚命中身体的打脸动作", fallback: "改用气场压迫+身份台词+反派后退半步+瞳孔特写轮切；兵器只亮相不交锋"}
  - {code: RL_02, rule: "禁止真实军队番号/真实军区名/现役军衔全称/真实编制名", fallback: "改用虚构称谓：北境、护国、虎符、旧部；肩章去掉可识别标识"}
  - {code: RL_03, rule: "禁止以财富数额作为打脸正当性依据；禁止炫富特写作为爽点兑现物", fallback: "打脸对象改为势利行为台词；支票/豪车仅作羞辱道具，不作兑现物"}
  - {code: RL_04, rule: "台词与 action 禁止出现：想/觉得/心里/暗自/不禁/仿佛", fallback: "改写为外部动作：手部停在半空、把照片翻过来扣在桌上、转身、眼神特写"}
  - {code: RL_05, rule: "禁止出现：灵根/宗门/修为/入赘/赘婿", fallback: "改用 M1-01 判别词：军令/北境/元帅/虎符/退役"}

# --- 槽位 10：adapt ---
adapt:
  chars_per_ep: [2000, 3000]
  keep: [主线冲突, 关键转折, 名场面, 金手指觉醒, 身份揭晓, 实力碾压]
  merge: [连续多次打脸, 多段日常, 次要支线, 同类重复]
  rewrite: [开场钩子, 集尾钩子, 视觉化瞬间, 心理描写转外部动作]

