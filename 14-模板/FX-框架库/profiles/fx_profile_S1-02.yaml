# ============================================================
# FX-P10 · Genre Profile · S1-02 鬼节轮回 · 机读轨
# 由人读轨 profiles/FX-P10_S1-02_鬼节轮回.md 派生；冲突时以 md 为准
# 字段结构 = schema/fx_framework.yaml 的 profile_template（14 顶层字段，无增删）
# 状态：draft / unverified　基准单集秒数：90（Σdur_s = 90）　骨架版本：1.1.0
# 生成日期：2026-11-26
# ============================================================

genre_id: S1-02
name: 鬼节轮回
status: draft
verification: unverified

# --- 槽位 1：beat_sheet（8 拍，Σdur_s = 90；9 型共用 MD-011 §二 S01~S08 基准表） ---
beat_sheet:
  - {at_s: 0, dur_s: 3, code: BEAT_OPEN_HOOK, purpose: 建立, is_payoff: false}
  - {at_s: 3, dur_s: 7, code: BEAT_CONTRAST, purpose: 铺垫, is_payoff: false}
  - {at_s: 10, dur_s: 15, code: BEAT_ESCALATE_1, purpose: 升级, is_payoff: false}
  - {at_s: 25, dur_s: 15, code: BEAT_ESCALATE_2, purpose: 升级, is_payoff: false}
  - {at_s: 40, dur_s: 15, code: BEAT_ESCALATE_3, purpose: 升级, is_payoff: false}
  - {at_s: 55, dur_s: 15, code: BEAT_PAYOFF, purpose: 兑现, is_payoff: true}
  - {at_s: 70, dur_s: 15, code: BEAT_AFTERSHOCK, purpose: 余波, is_payoff: false}
  - {at_s: 85, dur_s: 5, code: BEAT_CLOSE_HOOK, purpose: 断点, is_payoff: false}

# --- 槽位 2/3：hooks（open 4 / close 3 / extra 空列表，副类型注入位） ---
# 全部 sample_line 只含可归因的物理物件与现象（纸条/钟表/计数器/门牌/录音/走廊），
# 不留任何不可归因的超自然实体；异象一律在 RL_LUNHUI_* 的 fallback 落到科学/心理解释。
hooks:
  open:
    - {code: OPEN_RULE_NOTE, name: 门缝纸条, formula: "门缝纸条+第一条禁令特写", sample_line: "门缝塞进一张纸：别回头"}
    - {code: OPEN_CLOCK_HALT, name: 午夜停摆, formula: "午夜钟表+指针归零定格", sample_line: "钟又停在十二点"}
    - {code: OPEN_LOOP_COUNT, name: 计数回环, formula: "循环计数器+数字跳回特写", sample_line: "计数器跳回第七次"}
    - {code: OPEN_PLATE_SHIFT, name: 门牌错位, formula: "副本门牌+编号更替特写", sample_line: "门牌换号，还是这层"}
  close:
    - {code: CLOSE_RULE_BROKEN, name: 规则被破, formula: "末镜+第三条被划掉定格", sample_line: "第三条，被人划掉了"}
    - {code: CLOSE_TAPE_VOICE, name: 录音多声, formula: "旧磁带回放+多出一句人声", sample_line: "录音里多出一句人声"}
    - {code: CLOSE_EXIT_RESET, name: 出口重置, formula: "推门定格+同一条走廊", sample_line: "推开同一扇门，又是走廊"}
  extra: []

# --- 槽位 4：payoff（min_per_ep 与 beat_sheet 的 is_payoff 标记数 1 处严格相等） ---
payoff:
  min_per_ep: 1
  escalate_every_s: 20

# --- 槽位 5：cast ---
cast:
  max_speaking: 3
  max_on_screen: 3

# --- 槽位 6：line（banned = R-S6 六词 + genres[S1-02].words.exclude 四词） ---
line:
  max_chars: 15
  char_per_sec: [4, 6]
  tone_codes: [FLAT, MEASURED, REPEAT, HALTED, VERBATIM]
  banned: [想, 觉得, 心里, 暗自, 不禁, 仿佛, 验尸, 卷宗, 军令, 赘婿]

# --- 槽位 7：style_bible_ref（只写 STY-* 引用，不写提示词串） ---
style_bible_ref: STY-DARK-REAL

# --- 槽位 8：asset_bias（可绘制、可归因的物理物件与场景，避开本型排除词） ---
asset_bias:
  prop_focus: [规则纸条, 午夜钟表, 循环计数器, 副本门牌, 监控屏]
  scene_pool: [单元楼道, 值班室, 旧式钟楼, 电梯间, 空走廊]

# --- 槽位 9：redlines（RL_LUNHUI_* 语义前缀，逐条覆盖 risk_flags + 通用红线） ---
# fallback 全部在 P15 扫描范围内：把异象正向改写为误判/药物致幻/记忆错位/机关装置等
# 科学或心理解释，措辞逐字避开禁用词，不出现任何不可归因的超自然实体。
redlines:
  - {code: RL_LUNHUI_SUPERNATURAL, rule: "禁止鬼神/亡魂/托梦/还魂/符咒等灵异实指与封建迷信仪轨；禁止跳吓式惊吓画面", fallback: "异象改写为误判、药物致幻、记忆错位或机关装置；用影子、声音、缺席、留白替代实体镜头"}
  - {code: RL_LUNHUI_ATTRIBUTION, rule: "每处异象须在本集内给出可复验的科学或心理解释，不得悬置或归于超自然", fallback: "用监控回放、钟表机关、音效错位、旧照片比对给出成因；尾场落到可核查物证"}
  - {code: RL_LUNHUI_MENTAL, rule: "台词与 action 禁止出现：想/觉得/心里/暗自/不禁/仿佛", fallback: "改写为外部动作：把纸条翻过来扣在桌面、指尖停在计数器上、转身看向门牌"}
  - {code: RL_LUNHUI_EXCLUDE, rule: "禁止出现：验尸/卷宗/军令/赘婿（本型排除词，防串型）", fallback: "改用 S1-02 判别词：规则纸条/午夜钟表/循环计数器/副本门牌/监控屏"}

# --- 槽位 10：adapt ---
adapt:
  chars_per_ep: [2000, 3000]
  keep: [主线冲突, 关键转折, 名场面, 金手指觉醒, 规则解谜, 循环逃生]
  merge: [连续多次打脸, 多段日常, 次要支线, 同类重复]
  rewrite: [开场钩子, 集尾钩子, 视觉化瞬间, 心理描写转外部动作]

